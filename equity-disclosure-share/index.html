const SRC = "# Ⅲ. 자료와 표본: 지배주주 주식담보 firm-year 패널\n\n## 1. 자료의 원천과 담보 정보의 특성\n\n본 연구의 지배주주 주식담보 자료는 금융감독원 전자공시시스템(DART)에 제출된 「주식등의 대량보유상황보고서」(자본시장법 제147조, 이른바 5% 보고) 제2부 「2. 보유주식등에 관한 계약」에서 직접 구축하였다. 이 항목의 「나. 계약 내용」 표(이하 「나」)는 보고자와 그 특별관계자가 보유 주식에 설정한 계약을 **계약 건별로** 한 행씩 기재하며, 계약의 종류(담보·질권·차입·대출·대차·공동보유 등), 계약 대상 주식수, 계약상대방, 계약기간, 비고가 자유기재 형식으로 실린다. 2020년 7월 서식 개정 이후에는 같은 항목에 「다. 주요계약이 담보계약인 경우 추가 기재사항」 표(이하 「다」)가 신설되어 담보계약에 한해 대출금액·이자율·담보유지비율·채무자가 추가로 보고된다.[^sec]\n\n지배주주 주식담보 자료는 상용 데이터베이스(FnGuide DataGuide)가 「주식담보대출내역」이라는 이름으로 제공하고 있으며(코스피·코스닥, 2009년~, 계약별 이력과 연말 단면의 두 형태), 본 연구도 이 자료를 입수하여 자체 구축 자료와 양방향으로 대조하였다(§6). 그러나 대조에서 확인된 다음 네 가지 한계 때문에 벤더 자료를 분석 자료로 쓰지 않고 공시 원문에서 직접 구축하였다. 첫째, **조회 시점의 상장 종목만 수록하여 생존 편의(survivorship bias)가 있다**. 조회 시점 이전에 상장폐지된 기업은 상장 기간의 담보까지 통째로 빠져, 본 연구 패널에서 담보가 있는 기업-연도의 6%가 이 이유만으로 벤더 자료에 없다.[^surv] 지배주주의 주식담보는 반대매매·경영권 이전·기업 부실과 이어지기 쉬우므로 이 결측은 무작위가 아니다. 상장 중인 종목에서도 종목 전체나 특정 공시가 빠진 공백이 있다.[^gap] 둘째, **계약 유효성을 판정하지 않는다**. 「나」 표는 작성기준일 현재의 계약을 적는 곳이지만, 이미 끝난 계약이 지워지지 않은 채 다음 보고서까지 반복 기재되기도 한다. 벤더는 표에 실린 행을 그대로 잔존 계약으로 옮기고 담보가 없다고 적은 최신 보고서는 반영하지 않아, 본 연구와 대응되는 벤더 연말 잔존 행의 16%가 그 시점에 유효한 담보가 아니었다.[^stale] 벤더의 「계약/해지 구분」으로도 이 행들은 걸러지지 않으며, 벤더 자료에는 계약기간·계약의 종류·비고 칸이 없어 이용자가 직접 가려낼 수도 없다.[^termcase] 이 문제는 공시 원문의 시계열을 대조해야만 해소된다(§4). 셋째, **가공 오류가 있다**. 상환을 뜻하는 음수 행의 부호를 버려 원계약과 이중으로 센 행, 공시 원문의 참고용 표를 정식 계약으로 옮긴 행, 같은 행이 기계적으로 복제된 행이 있다.[^proc] 넷째, **연구에 필요한 변수와 추적성이 부족하다**. 「다」의 대출금액·이자율·담보유지비율·채무자를 제공하지 않고, 연말 단면을 작성기준일이 아닌 공시일로 자르며,[^cutoff] 각 행이 어느 보고서의 어느 행에서 왔는지 추적할 수 없다. 또 본 연구의 대상은 최대주주·사실상지배주주 그룹의 담보인데, 벤더 자료에는 그 밖의 주주가 제공한 담보가 최대주주 그룹의 것인지 가리키는 항목 없이 함께 실려 있고,[^nontop] 상품명과 달리 금융 차입이 아닌 납세담보와 법원 공탁도 섞여 있다.[^taxdep]\n\n벤더의 담보 자료는 본 연구가 공시 원문에서 구축한 자료의 추출 정합성을 검증하는 대조군으로만 사용하였다(§6).\n\n수집 범위는 2011년 1월부터 2026년 7월까지 제출된 대량보유상황보고서이다(정정공시는 최종본만). 패널은 2011~2025년 기업-연도이지만, 2025년 말의 변동을 2026년 초에 보고한 보고서가 그 해의 스냅샷이 되고(§2.1) 연말 뒤에 낸 보고서가 계약의 유효성을 판정하는 근거가 되므로(§4.1) 2026년 공시까지 모았다. 수집한 보고서 가운데 최대주주 그룹의 보고서 **79,359건**이 본 연구의 모집단이다.[^pop] 최대주주 그룹은 표지·「2.가 보고자」·「2.나 특별관계자」 중 하나라도 발행회사와의 관계를 최대주주 또는 사실상지배주주로 적은 보고서에서 출발하여, 공시 원문 점검으로 그룹이 아닌 것으로 확인된 보고서를 제외하고 회사의 사업보고서와 최대주주 지위 승계로 확인된 보고서를 더해 정하였다(§4.1).\n\n## 2. 표본 구성\n\n### 2.1 관측 단위와 연도 배정\n\n분석 단위는 기업-연도(firm-year)이다. 대량보유상황보고서는 사건 발생 시 제출되는 비정기 공시이므로, 연도 $t$의 값은 **$t$년 12월 31일 이전의 상태를 나타내는 가장 최근의 최대주주·사실상지배주주 보고서** 하나에서 읽는다. 이 보고서를 그 해의 **스냅샷**(연말 상태를 대표하도록 고른 보고서)이라 부른다. 연말 최대주주는 12월 31일에 의결권 있는 주식을 실제로 소유한 그룹이다. 보고서가 나타내는 날(상태일)은 작성기준일이다.[^state] 한 해에 보고서가 여럿이면 상태일이 가장 늦은 것 하나만 그 해의 스냅샷이 되고, 앞선 보고서들은 계약의 유효성을 판정하는 근거로만 쓰인다(§4.1).[^snap] 해당 연도에 새 보고서가 없으면 직전 보고서를 그대로 스냅샷으로 쓰며, 이를 **이월**(carry-forward)이라 한다(전체 기업-연도의 30.8%). 담보 계약의 체결·변경도 대상 주식이 발행주식총수의 1% 이상이면 보고 사유이므로(자본시장법 제147조 제4항, 같은 법 시행령 제155조 제2호) 새 보고서가 없는 해는 그만한 담보 계약 변화가 없었던 해로 읽는데, 이는 관측이 아니라 측정상의 가정이다. 그래서 이월 여부(`is_carried`)와 이월 연수(`carry_years`)를 함께 두어, 관측 연도만 쓰거나 이월 기간을 제한한 강건성 검정을 할 수 있게 하였다.\n\n연말 담보는 스냅샷 보고서의 기재에 더하여, 모든 기업-연도의 스냅샷을 앞뒤 지분 공시와 대조하는 추가 검증을 거쳐 확정하였다. 앞뒤 공시에는 있으나 스냅샷에 없는 계약과 스냅샷에 있으나 계약기간이 연말 전에 끝나는 계약을 가려내고, 이들을 정기보고서·담보를 제공한 법인의 감사보고서 주석·거래소 공시로 확인해 12월 31일에 살아 있던 계약은 더하고 연말 전에 끝난 계약은 제외했다(연말 보충, `collateral_supplement_shares`).[^supp] 확인되지 않은 담보는 보고서에 적힌 대로 두었다. 이렇게 정한 연도 값은 최종 정정본과 수집 끝(2026년 7월)까지 공시된 뒤 보고서를 반영해 복원한 연말 상태이므로, 그 해 말에 시장이 알던 정보와는 다를 수 있다.[^timing]\n\n### 2.2 표본 선정 절차\n\n〈표 1〉은 표본 선정 절차이다. 출발점은 최대주주·사실상지배주주 보고서가 한 번이라도 제출된 종목의 첫 보고 연도부터 2025년까지의 기업-연도이다. 다만 최대주주 그룹이 지분 처분 등으로 최대주주 자리에서 물러났는데(이하 「퇴장」) 그 자리를 이어받은 새 최대주주(승계인)의 보고서가 없으면, 새 최대주주 보고서가 나오기 전까지의 연도는 담보를 읽을 보고서가 없으므로 제외했다.[^exit] 여기서 (i) 해당 연도 말 시점에 거래소에 상장되어 있지 않은 기업-연도, (ii) 코넥스 종목과 스팩(기업인수목적회사)·리츠·인프라펀드·선박투자회사처럼 일반기업이 아닌 종목의 기업-연도, (iii) 연말 최신 최대주주 보고서가 계약 절이 없는 약식 대량보유보고서라 담보를 관측할 수 없는 기업-연도를 제외하여 최종 표본 28,633 기업-연도(2,863개 기업)를 얻었다.[^t1]\n\n(iii)의 약식 보고서는 경영권에 영향을 주려는 목적이 아닌 보유자와 일부 전문투자자가 쓰는 간소 서식으로, 대개 보유주식등에 관한 계약 절이 없다. 그런 기업-연도를 담보 없음으로 두면 서식 때문에 $PLEDGE=0$ 이 강제되므로 표본에서 제외하고, 다른 주주의 이전 일반 보고서로 대체하지 않았다.[^yak]\n\n〈표 1〉 표본 선정 절차\n\n| 단계 | 조건 | 기업-연도 | 기업 |\n|---|---|---:|---:|\n| (0) | 최대주주·사실상지배주주 보고서(표지·「2.가」·「2.나」 중 하나라도)가 있는 종목 × 첫 보고 연도~2025 (이월 포함, 승계 없는 퇴장 뒤 최대주주 보고서가 없는 838 기업-연도 제외) | 35,359 | |\n| (1) | − 해당 연도 말 시점 거래소 비상장 (직전 보고서 이월 3,176 포함) | −3,391 | |\n| (2) | − 코넥스 종목과 일반기업이 아닌 종목(스팩·리츠·인프라펀드·선박투자회사 등)의 기업-연도 (코넥스 2,208, 스팩 512, 리츠 202, 선박투자회사 57, 인프라펀드 16, 해외자원개발펀드 10) | −3,005 | |\n| (3) | − 연말 최신 최대주주 보고서가 계약 절 없는 약식 대량보유보고서 (담보 관측 불가) | −330 | |\n| 최종 | 유가증권·코스닥 상장 기업-연도 | **28,633** | **2,863** |\n| | 그중 해당 연도에 보고서가 있는 관측 기업-연도 | 19,816 | |\n| | 그중 직전 보고서 이월 기업-연도 | 8,817 | |\n| | 시장별: 유가증권 / 코스닥 | 10,329 / 18,304 | 892 / 1,985 |\n\n주: 기업은 종목코드(6자리, 2024년 이후 신규 상장은 `0126Z0`처럼 영문이 섞인다)로 센다. 시장별 기업 수는 표본 기간에 시장을 옮긴 14개 기업을 양쪽에 모두 세어 합이 2,863보다 14 많다.\n\n### 2.3 담보 계약 행의 식별\n\n「나」 표에는 주식담보뿐 아니라 주식매매, 공동보유 약정, 증권 대차 등 여러 종류의 계약이 함께 기재되어 있다. 이 가운데 본 연구가 측정하려는 것은 최대주주 그룹이 의결권 있는 보통주를 금융 차입의 담보로 제공한 계약이다.[^side] 선별 대상은 §1의 모집단, 곧 최대주주 그룹이 낸 보고서(정정공시는 최종본)에 실린 「나」 행이다. 보고자와 특별관계자의 행을 모두 포함하며, 같은 종목의 다른 주주가 낸 보고서의 행은 대상이 아니다. 그룹이 그 해 연말에도 최대주주였는지는 행이 아니라 스냅샷을 고를 때 따진다(§2.1). 이 범위에서 다음 다섯 조건으로 계약 행을 선별한다. 선별된 행은 기업-연도별 담보 변수 계산에 쓰기 전에 두 가지를 더 확인한다(§4). 첫째는 계약의 유효성이다. 그 담보가 보고서 작성기준일에도 여전히 유효한지, 아니면 계약기간이 이미 끝났거나 해지·상환되었는데 표에서 지우지 않아 기재만 남아 있는지를 가린다. 기간 칸이 지났더라도 만기를 연장해 담보가 살아 있는 경우가 있으므로 기간 칸만으로 정하지 않는다(§4.1). 둘째는 중복 기재 여부이다. 같은 주식에 순위가 다른 근질권을 설정한 경우처럼 한 담보가 여러 줄에 실리면 한 번만 센다(§4.2).\n\n| 조건 | 공시 원문에서 보는 곳 | 충족 기준 |\n|---|---|---|\n| ① 의결권 있는 보통주 | 「나」 표의 주식등의 종류 | 「의결권있는 주식」 또는 「보통주」인 행만 쓴다. 잠재주식(전환사채권 등)·우선주·증권예탁증권·「기타」는 제외한다.[^stkknd] |\n| ② 주식수의 기재 | 「나」 표의 주식수 | 숫자가 적혀 있어야 한다. 「-」만 적혀 수량을 알 수 없는 행은 제외한다. |\n| ③ 담보성 계약 | 「나」 표의 계약의 종류. 「상동」·「〃」·「\"」나 빈칸이면 같은 보고서에서 바로 위에 실제 값이 적힌 행의 값 | 계약의 종류에 담보·질권·차입·대출 등 금융 차입 담보 어휘가 들어 있다(부분 일치, 같은 어휘의 오기 포함). 이름만으로 담보인지 알 수 없는 계약(대여·대차, 신탁)과 어휘 밖에 적힌 질권은 「다」 연결이나 공시 원문 판정으로 금융 차입 담보가 확인될 때만 포함한다.[^f5gap] 환매조건부 매도는 포함한다.[^repo] 주주간계약, 공동보유 약정, 되사는 조건이 없는 주식매매·양수도, 의결권 위임, 교환사채 발행, 담보가 아닌 신탁은 제외된다.[^vocab] |\n| ④ 양의 주식수 | 「나」 표의 주식수 | 0보다 커야 한다. 담보 감소분을 음수로 적은 상계 행과 0인 행은 판정 대상에서 제외한다. 음수 행은 버리지 않고 집계에서 부호를 보존해 더한다(§4.2). |\n| ⑤ 금융 차입 담보 | 계약의 종류·계약상대방·비고와 연결된 「다」, 각주와 같은 사람의 전후 보고서 | 과세관청에 제공한 납세담보이거나, 세금 목적이 드러나지 않는 법원 공탁·관공서 이행보증으로 판별된 행은 ①~④를 모두 충족해도 제외하고 별도 변수로 잰다(아래). |\n\n이 범위와 조건으로 전체 계약 행 449,986개 중 282,012행(44,894보고서·1,733종목)을 최대주주 그룹의 금융 차입 담보로 선별하였다.[^rowfunnel]\n\n①은 담보로 제공한 증권의 종류를 가리는 조건이다. 전환사채·신주인수권부사채·교환사채 등 비의결권 증권을 담보로 한 계약은 제외한다. 다만 이런 담보가 있는 기업-연도는 별도 변수(`has_nonvoting_collateral`)로 표시하였다.[^nonvote]\n\n③에서 이름만으로 금융 차입 담보인지 알 수 없는 대여·대차와 신탁은 「다」 연결이나, 해당 보고서의 공시 원문과 앞뒤 공시를 읽은 판정으로 담보가 확인된 행만 넣었다.[^lend] 대차 형식으로 채권자에게 넘긴 주식과 담보신탁처럼 경제적으로 질권과 같은 계약이 이렇게 들어온다.[^trust] 주식을 넘기고 돈을 받은 뒤 정해진 날 되사는 환매조건부 매도(repo)도 실질이 주식담보 대출이므로 넣었고, 넘긴 주식은 분자(담보)와 분모(의결권 보유)에 모두 넣는다.[^repo] 담보는 **계약으로 받은 신용(대출·사채·상거래 신용, 또는 그런 채무의 보증)에서 생긴, 지금 확정된 금전 채무**나 **갚을 금액이 주가에 따라 정해지는 자금 조달**(총수익스와프·주식스와프·환매조건부 매도)을 담보하는 것만 센다. 지배주주가 주식을 맡기고 자금을 조달한 계약이어야 주가가 내릴 때 추가 담보나 처분(마진콜)으로 이어지는 주식담보의 위험을 나타내기 때문이다. 법률로 생긴 채무(조세), 조건이 생겨야 빚이 되는 의무, 금전이 아닌 의무를 담보하는 계약은 주 담보에 넣지 않고 처분 제한으로 따로 잰다(⑤, §3.1).[^oblig]\n\n⑤에서는 납세담보와 법원 공탁·관공서 이행보증을 금융 차입 담보와 구분한다. 이들은 주 담보의 주식수(`collateral_shares_live`)와 대출금액(`loan_krw_live`)에 포함하지 않고 별도로 기록한다(§3.1). 다만 세금 납부 자금을 빌리면서 주식을 담보로 맡긴 경우는 금융 차입 담보이므로 주 담보에 포함한다.[^taxmix] 납세담보가 지키는 세금은 확정된 금전 채무이지만 계약으로 받은 신용이 아니라 법률로 생긴 채무이다. 담보 가액도 지배주주가 고르지 않고 세액의 120%(금전·납세보증보험증권 등은 110%) 이상으로 법이 정하며, 담보 가치가 줄면 과세관청이 추가 담보를 요구할 수 있지만 금융기관 담보처럼 시장에서 곧바로 처분되지는 않는다(국세징수법 제18조·제21조, 2020년까지는 국세기본법). 법원 공탁·관공서 이행보증은 조건이 생겨야 빚이 되는 의무의 담보이다. 그래서 주 담보의 위험과는 성격이 다르지만, 그 주식도 지배주주가 자유롭게 처분할 수 없다. 그래서 주 담보에 섞지 않고, ③에서 조건부 의무나 금전이 아닌 의무를 담보한다고 보아 제외한 질권과 함께 주 담보 밖의 처분 제한 주식수($RESTRICT\\_SH_{it}$)로 따로 재어 처분이 제한된 지분 전체를 볼 수 있게 하였다. 그 가운데 납세담보·공탁 몫은 열을 따로 두었다(§3.1).\n\n## 3. 변수의 측정\n\n### 3.1 담보 변수\n\n〈표 2〉는 본 연구의 주요 담보 변수이다. 분자인 살아있는 담보 주식수(`collateral_shares_live`)는 스냅샷 보고서의 「나」 행에서 다음 순서로 구한다. \n(1) §2.3의 다섯 조건을 충족하는 행을 모은다. \n(2) §4.1의 판정에서 작성기준일 현재 유효한 행만 남긴다. \n(3) 같은 주식을 여러 행에 적은 동일 담보 다중 기재는 대표 1행만 남긴다(§4.2). \n(4) 담보 감소분을 적은 음수 행은 같은 계약의 담보 설정을 적은 행과 짝지어 그 수량만큼 차감한다(§4.2). 양수로 적힌 부분해지 기록행의 수량도 담보 설정을 적은 행에서 차감한다(§4.1 부분해지 상계). \n(5) 분할·병합·감자 환산과 보유 초과에 따른 수량 보정을 한다(§4.1 분할·병합·감자 환산과 보유 캡).[^cap]\n(6) 남은 값을 합하고 연말 보충(§2.1)을 더하거나 차감한다. $PLEDGE_{it}$는 이 합이 0보다 크면 1이다.\n\n분모는 같은 스냅샷 보고서 「1.가」에서 보고자와 특별관계자의 **의결권 있는 주식**을 합산한 수(`holding_shares_voting`)이며, 전환사채·신주인수권 등 잠재주식은 넣지 않는다. 의결권 있는 발행주식총수(`issued_voting_shares`)는 자기주식과 상장 전에 이미 발행된 신주를 포함하며, 같은 보고서의 제1부와 제2부에 적힌 발행총수 및 기재 지분율을 대조해 확정한다.[^denom] 주 분석에는 아래 〈표 2〉의 의결권 주식 기준 변수를 쓰고, 종전 기준 변수는 비교용으로 보존한다.[^denomlegacy]\n\n〈표 2〉 주요 변수의 정의\n\n| 변수 (예시명) | 패널 컬럼 | 정의 |\n|---|---|---|\n| $PLEDGE_{it}$ | `has_collateral` | $t$년 말 스냅샷에서 위 (1)~(6)을 거친 살아있는 의결권 주식 담보 주식수($PLEDGE\\_SH_{it}$)가 0보다 크면 1 |\n| $PLEDGE\\_RATIO_{it}$ | `collateral_to_voting_pct` | 살아있는 담보 주식수 ÷ 검증된 지배주주 그룹 의결권 주식수 × 100. 잠재주식 제외; 분모 사유 표시가 있으면 결측 |\n| $PLEDGE\\_TOT_{it}$ | `collateral_pct_of_voting_total` | 살아있는 담보 주식수 ÷ 검증된 의결권 있는 발행주식총수 × 100 |\n| $PLEDGE\\_SH_{it}$ | `collateral_shares_live` | 살아있는 담보 주식수 (주, 위 (1)~(6)의 결과) |\n| $NONSTD\\_SH_{it}$ | `nonstandard_collateral_shares` | $PLEDGE\\_SH_{it}$ 가운데 전통적 주식담보대출(담보제공자 본인이나 그룹 구성원이 금융기관 등에서 빌린 돈의 담보)이 아닌 담보제공계약의 몫. 유형별 주식수는 `collateral_types`이며[^ctype], 단서가 있는 계약만 판정했으므로 하한이다 |\n| $RESTRICT\\_SH_{it}$ | `restricted_other_shares` | 주 담보에 넣지 않았지만 처분이 제한된 주식수. 살아있는 납세담보·법원 공탁·관공서 이행보증(§2.3 ⑤)과, 조건부 의무나 금전이 아닌 의무를 담보해 주 담보에서 제외한 질권 가운데 연말에 살아 있던 것이다[^oblig]. 납세담보·공탁 몫은 `tax_collateral_shares_live`(납세담보)와 `deposit_shares_live`(공탁·이행보증)이고, 나머지가 질권 몫이다. $PLEDGE\\_SH_{it}$와 계약 행이 겹치지 않아 둘을 더하면 이 패널이 잰 처분 제한 주식 전체가 된다 |\n| $N\\_LENDER_{it}$ | `n_counterparties_live` | 살아있는 담보의 계약상대방(담보권자) 수 |\n| $N\\_PLEDGOR_{it}$ | `n_pledgors_live` | 살아있는 담보의 담보제공자(보고자·특별관계자) 수 |\n| $LOAN_{it}$ | `loan_krw_live` | 그 회사 주식을 담보로 잡은 살아있는 대출의 보고 금액 합 (원). 「다」에 연결된 담보만 더하며 채무자는 지배주주 본인이 아닐 수 있다(§4.3). 2020-07 개정 서식 보고서만[^loanrow] |\n| $MAINT_{it}$ | `kep_pct_median` | 담보유지비율 중앙값(%). 대출금액이 0을 넘고 비율이 100~300%인 행(계약상 유지 하한으로 읽히는 구간)만 사용. 2020-07 이후 |\n| $MAINT\\_W_{it}$ | `kep_pct_wavg` | 담보유지비율의 대출금액 가중평균(%). 같은 유효 행, 공동담보 중복 제거 후 대출금액으로 가중 |\n| $INT_{it}$ | `int_pct_median` | **이자율 중앙값(%)**. 1~20%인 행과, 1 미만이지만 같은 문서에서 퍼센트 표기임이 확인된 행만 사용(§4.5). 2020-07 이후 |\n| $INT\\_W_{it}$ | `int_pct_wavg` | 이자율의 대출금액 가중평균(%). 같은 유효 행, $MAINT\\_W$ 와 같은 가중 규칙 |\n| $OWN_{it}$ | `holding_pct_voting` | 의결권 주식 기준 보유비율(%). 검증된 보유 주식수 ÷ 검증된 의결권 있는 발행주식총수 × 100 |\n| $CARRIED_{it}$ | `is_carried` | 그 해 안의 상태를 적은 최대주주 보고서가 없어 직전 보고서를 이월했으면 1. 공시일이 아니라 스냅샷의 상태일(`state_dt`)로 가른다 (이월 연수는 `carry_years`) |\n| $REPORTER\\_CHG_{it}$ | `reporter_changed` · `group_continuity` | 직전 연도 스냅샷과 대표보고자가 다르면 1. 같은 그룹 안에서 대표보고자만 바뀐 경우도 1이므로 최대주주 교체 지표가 아니며, 교체 후보는 `group_continuity=0`인 경우이다[^repchg] |\n\n$LOAN_{it}$은 「다」 항목이 신설된 2020년 7월 이후 서식의 보고서에만 존재하므로 2020~2025년에만 두고 2011~2019년은 비운다. 2020년 이후라도 그 전 서식의 보고서를 이월한 기업-연도에서는 결측이다.[^loanna] 담보유지비율은 같은 칸에 보고자마다 다른 개념을 적어, 계약상 유지 하한인 100~300%의 값만 쓰고 담보인정비율로 적은 100% 미만과 시점 평가값이 대부분인 300% 초과는 제외한다(§4.4).\n\n결측과 0은 구분하였다. 대출금액·이자율·담보유지비율의 빈칸은 담보 유무에 따라 뜻이 다르다. 담보가 없는 기업-연도($PLEDGE_{it}=0$)에 대해서는 이 변수들이 해당 없음이라 빈칸이다. 담보가 있는 기업-연도($PLEDGE_{it}=1$)에 대해서는 $LOAN_{it}$을 얻지 못하면 0이 아니라 결측으로 두고, 그 사유를 `loan_na_reason`에 남겼다(§5).[^loanfill] 또 담보가 있는 기업-연도 중 살아있는 담보 행 일부만 「다」에 연결된 경우에는 $LOAN_{it}$이 연결된 몫만 더한 값이라 실제보다 작을 수 있다.[^partial]\n\n### 3.2 표본 구성과 담보 유무 비교\n\n이 패널은 최대주주 그룹이 대량보유보고서를 낸 기업-연도로 이루어진다. 읽을 보고서가 없어 담보 유무를 모르는 상장 기업-연도는 0이나 1로 채우지 않고 제외했다. 제외된 기업-연도에는 담보가 없었을 수도 있고 있었을 수도 있으므로, 이 선택은 담보가 있는 쪽($PLEDGE_{it}=1$)과 없는 쪽($PLEDGE_{it}=0$)의 구성에 모두 영향을 준다.[^absent] 다만 발행주식총수의 1% 이상인 담보를 맺거나 바꾸는 일 자체가 보고 사유이므로 담보를 쓰는 기업은 대개 보고서를 내게 된다. 패널이 놓치는 담보는 관측 기간 전에 맺어 그 뒤로 바뀌지 않은 담보, 1% 미만인 담보, 보고되지 않은 담보 정도이므로 제외된 기업-연도는 담보가 없는 쪽에 기울었을 가능성이 크다. 패널 안에서 담보가 있는데 0으로 잡힐 위험(보고 누락, 1% 미만 변화, 이월)은 §7의 첫째·넷째에서 다룬다.\n\n제외된 기업-연도는 초기 연도에 몰려 있다. 기본 패널은 2011~2025년 유가증권·코스닥 상장 기업-연도의 91.9%를 덮지만, 2011년에는 상장 기업-연도의 36.2%가 패널 밖이고 2015년부터는 해마다 10% 아래이다. 초기의 결손은 대부분 2010년 이전 보고서를 모으지 않아 첫 보고서 이전 연도의 담보를 알 수 없는 좌측 절단이다. 그러므로 **담보 유무와 관련한 분석(같은 기업의 0→1, 1→0 전환 포함)은 2015년 이후 자료로 할 것을 권한다.** 2015~2025년에는 기본 패널이 상장 기업-연도의 95.8%를 덮고, 패널 밖 기업-연도를 모두 담보 없음으로 두는 끝과 모두 담보 있음으로 두는 끝 사이에서 담보 기업-연도의 비율은 31.6%에서 35.8% 사이에 있다(같은 기간 기본 패널 32.9%). 2011~2014년을 넣은 전 기간으로는 결론이 같은지 확인하는 강건성 점검을 하면 된다. 담보가 있는 기업-연도끼리 담보 비율·대출 조건을 견주는 분석은 제외된 담보 기업-연도가 드물어 이 선택의 영향이 작다.[^pledge0]\n\n## 4. 측정상의 문제와 처리\n\n### 4.1 계약 유효성 판정\n\n「나」 표에 실렸다는 사실만으로는 그 계약이 작성기준일 현재 살아있다고 볼 수 없고, 그 보고서 한 건만으로 정해지지 않는 경우도 있다. 더 이상 유효하지 않은 계약이 공시에 기재된 경우로는 계약기간이 만료된 채 실린 행, 비고에 \"해지\"·\"전액 상환\"이 적혀 있으나 표에서 지워지지 않은 행, 담보 설정과 해지를 모두 양수 행으로 남겨 장부처럼 쓴 누적 이력표가 있다. 처음부터 담보가 아닌 주식대차가 담보 어휘와 섞여 실린 행도 같은 쪽의 오류다. 반대로 유효한 계약인데 유효하지 않은 것처럼 기재된 경우로는 만기 연장(롤오버)으로 담보가 살아있는데 계약기간 칸을 갱신하지 않아 만료된 것처럼 보이는 행이 있다. 이런 행을 기간 칸만 보고 만료 처리하면 살아있는 담보를 지우게 된다.\n\n본 연구는 이를 두 단계로 판정하였다. **1단(기간 규칙에 의한 자동 판정)**은 계약기간 칸을 읽어 작성기준일 전에 끝난 행을 기본 무효로 두는 규칙이다. **2단(시계열 재검증)**은 종목별로 전 기간의 보고서를 시간순으로 나란히 비교하여 직접 검증하는 절차이다. 또한 기간이 끝났더라도 각주 표시가 달린 행은 2단에서 각주를 확인하도록 하였다.[^twotier] 최종적으로 표본 행 가운데 6,453행이 주 담보 집계에서 제외되었다(§2.3의 비담보 계약 포함). 판정이 불명확한 행은 「나」 표에 기재된 대로 존속으로 보아 담보 집계에 넣었다.[^endcase] 한편 누적 이력표의 해지 기록행은 양수로 적혀 있어 행을 통째로 제외하는 방식으로는 걸러지지 않으므로, 그 수량을 같은 담보제공자·상대방의 담보 설정을 적은 행 가운데 살아있는 행에서 차감하였다(**부분해지 상계**).\n\n또한 같은 보고서의 「1.가」 보유내역과 제3부 세부변동내역을 확인하여 담보제공자마다 보유주식수를 확정하고, 살아있는 담보 행을 이와 대조하였다.[^person] 「1.가」 보유가 분할·병합·감자 뒤 수량인데 「나」 담보 행은 그 전 수량으로 남아 있으면 제3부에 적힌 비율을 곱해 단위를 맞추었다(**분할·병합·감자 환산**). 그래도 담보 합이 보유를 넘으면, 빌린 주식 등 정당한 초과를 제외하고 보유로 제한하였다(**보유 캡 적용**).[^exceed]\n\n최대주주 그룹의 경계도 같은 방식으로 점검하였다. 보고서가 적은 관계 표기를 회사가 사업보고서에 적은 최대주주(「최대주주 변동현황」과 연말 「최대주주 및 특수관계인의 주식소유 현황」), 벤더(FnGuide DataGuide)의 연말 최대주주 자료, 「1.가」의 의결권 있는 주식 서열과 대조하였다. 맞지 않는 보고서는 공시 원문으로 판정해 그룹에 넣거나 제외했다. 최대주주 지위를 잃은 것이 확인된 그룹은 그 시점부터 최대주주 그룹으로 보지 않고, 새 최대주주의 보고서가 나올 때까지 그 기업-연도를 패널에서 제외했다.[^topcheck] 새 최대주주가 보고한 뒤 뒤늦게 나온 옛 최대주주의 보유 0 보고서는 늦은 퇴장 기록으로 보고, 새 최대주주의 최신 보고서를 스냅샷으로 썼다(**늦은 퇴장**). 재무적 투자자나 채권은행단이 대표보고자인 연명 보고서는 `snapshot_reporter_type`으로 표시해 강건성 검정에서 제외할 수 있게 하였고, 기본 패널에는 포함하였다(**스냅샷 보고자 구분**).[^rules]\n\n### 4.2 동일 담보의 다중 기재와 상계 행\n\n같은 주식에 근질권을 순위별로 설정하거나 대출채권 양도로 근질권자가 추가되면 「나」에 같은 주식이 상대방만 다르게 여러 줄 실린다. 각 행은 실제로 살아있는 계약이라 종료로 처리해 제외하면 안 되지만, 그대로 더하면 같은 주식을 여러 번 세게 되므로 집계에서는 한 번만 센다. 본 연구는 같은 보고서 안에서 담보제공자와 주식수가 같은 행의 합이 그 담보제공자의 의결권 주식 보유를 넘으면 대표 1행만 계상하였다(대표는 「다」에 연결된 행).[^dup]\n\n보고자에 따라서는 담보 감소분을 음수 행으로 적어 상계 표기한다. 음수 행은 부호를 보존하여 합산하되 짝인 양수 행이 종료되면 함께 종료한다. 이번 보고서에 짝이 없는 「고아」 음수 행은 합산에서 제외한다. 패널 스냅샷의 고아 음수 행을 모두 원문으로 확인한 결과, 앞 보고서 담보의 해지 기록이거나 그룹 이탈·상대방 묶음 표기여서 그 몫이 이미 남은 담보에서 제외되어 있었다. 짝은 담보제공자와 상대방 이름으로 찾는데, 같은 상대방과 같은 날 옛 질권을 풀고 새 질권을 맺은 대환에서는 옛 계약의 해지 행이 새 계약 행과 짝으로 잡힌다. 이런 해지 행은 체결일과 보고서의 「2.나」 합계 행으로 확인해, 새 계약에서 차감하지 않고 합산에서 제외하였다.[^neg]\n\n### 4.3 대출금액의 단위와 공동담보\n\n「다」의 대출금액은 셀 안에 단위가 없어 보고서별로 주석·자릿수·담보유지비율과 주가의 교차검증으로 배율을 판정해 원 단위로 복원하였고, 외화 대출은 작성기준일 근접 영업일의 매매기준율로 환산하였다.[^unit] $LOAN_{it}$은 그 회사 주식을 담보로 잡은 대출의 보고 금액이지 발행회사의 부채나 지배주주 개인의 차입액이 아니며, 채무자는 계열회사·특별관계자일 수도 있다. 하나의 대출을 여러 사람의 주식으로 담보하면 공시 원문은 각 행에 같은 대출금액을 반복하므로, 같은 보고서 안에서 대출금액·채무자·대주(「나」 표의 계약상대방)가 모두 같은 행은 1회만 계상한다.[^loankey]\n\n대출 하나를 여러 회사의 주식으로 함께 담보한 경우 그 대출은 각 회사의 $LOAN_{it}$에 전액 들어가므로, 여러 기업-연도의 대출을 합할 때는 같은 대출을 한 번만 세야 한다.[^cross]\n\n같은 대출금액 칸이라도 보고자마다 적는 값의 뜻이 다르다. 실제로 빌린 금액(차입 잔액)을 적는 보고자가 많지만, 빌릴 수 있는 최대 금액(한도)·계약서상 약정액·질권으로 담보되는 최대 금액(채권최고액)을 적는 보고자도 있다. 이 경우, 담보를 준 쪽이나 채무자의 감사보고서·사업보고서 차입금·담보 주석, 같은 계약을 적은 앞뒤 보고서로 그 해 12월 31일의 실제 잔액이 확인되면 그 잔액(0 포함)을 쓰고, 확인되지 않은 대출은 보고서 금액을 그대로 두되 그 가운데 한도로 판정된 금액을 `loan_krw_limit`으로 표시한다. 그 밖에 대주 이름의 표기 변형, 같은 담보에 붙은 여러 대출분(트랜치), 다중 기재로 주식수에서 제외한 행의 대출, 총액에 포함된 대환 대출을 처리하는 규칙을 두었다.[^loanrules]\n\n### 4.4 담보유지비율의 정의 이질성과 유효 행\n\n「다」의 담보유지비율은 서식에 정의가 없어 보고자마다 다른 개념을 적는다. 대부분은 계약상 유지해야 할 담보가치 ÷ 대출금의 하한으로, 140%·150%처럼 딱 떨어지는 계약 조건이다. 일부는 다른 개념이다. 100% 미만으로 적은 값은 오류가 아니라 대출금 ÷ 담보가치, 즉 담보인정비율(LTV)을 같은 칸에 적은 것이고, 300%를 넘는 값은 대부분 그 시점의 담보 평가값이다.[^kep]\n\n따라서 담보유지비율 변수는 **유효 행**만으로 계산한다. 유효 행은 (i) 대출금액이 0을 초과하고 (ii) 담보유지비율이 100% 이상 300% 이하인 「다」 행이다.[^kepvalid] 두 경계는 극단값을 자르는 기준이 아니라, 측정하려는 개념(계약상 유지 하한)이 아닌 값을 가려내는 선이다. 유지 하한은 담보가치가 대출금을 밑돌기 전에 추가 담보나 처분을 요구하려고 두는 것이어서 100% 미만일 수 없다. 300%를 넘는 값은 대부분 계약 조건이 아니다. 계약 조건은 140%·150%처럼 딱 떨어지는 수인데 이 값은 그런 비중이 절반에 못 미치고, 같은 대출인데도 보고서마다 값이 달라진다. 200~300%는 업계에서 흔한 하한(140~200%)보다 높고 200% 이하보다 평가값이 더 섞여 있을 수 있다. 그래도 같은 대출이 여러 보고서에 나올 때 같은 대주와 같은 값이 그대로 이어지는 경우가 다수라 계약 조건으로 보고 유효 행에 넣었다. 100% 미만 값은 역수로 바꾸면 유효 행과 비교할 수 있지만, 보고자가 적은 개념을 우리가 바꾸지 않고 주 변수에서 제외했다. 경계를 옮기거나, 역수를 넣거나, 평가값일 수 있는 대출을 제외해도 $MAINT_{it}$의 분포는 거의 바뀌지 않는다.[^kepsens]\n\n기업-연도 변수는 유효 행의 중앙값($MAINT_{it}$)과 대출금액 가중평균($MAINT\\_W_{it}$)을 병기하며, 두 값 모두 §4.3의 공동담보 중복 제거를 통과해 $LOAN_{it}$에 합산된 행만 쓴다.[^maint]\n\n### 4.5 이자율의 표기 이질성: 보정하지 않고 표시만 한다\n\n「다」의 이자율도 담보유지비율과 같은 문제를 가진다. 대부분은 1~20% 구간에 있으나, 1 미만인 값에는 비율을 배수로 적은 보고자(0.04 = 4%)와 실제 저금리 차입이 섞여 있어 **기계적으로 가릴 수 없다.**[^ratelow] 따라서 **원본 값은 보정하지 않고** 유효 행(이자율 1% 이상 20% 이하)만 기업-연도 변수에 넣었다. 1 미만 값은 같은 문서의 다른 이자율이 퍼센트로 적혀 있어 그 보고자가 퍼센트로 적는다는 것이 문서 안에서 확인될 때만 실제 금리로 넣었다.[^ratefix]\n\n기업-연도 변수 $INT_{it}$·$INT\\_W_{it}$는 **유효 행만으로** 계산하며, 담보유지비율과 같이 중앙값과 대출금액 가중평균을 병기한다. 결과적으로 이자율 변수는 **3,753 기업-연도**에서 관측되어 담보유지비율(3,201)보다 넓다.\n\n## 5. 기술통계\n\n〈표 3〉은 연도별·시장별 표본 분포이다. 기업-연도 수는 2011년 1,117개에서 2025년 2,505개로 늘어난다. 종목이 첫 최대주주 보고서가 나온 해부터 패널에 들어오기 때문이며, 초기 연도에는 아직 첫 보고가 나오지 않은 종목이 빠져 있다(2011년 548개, 2020년 21개). 2020년 이후의 증가는 코스닥 종목의 증가가 중심이다. 담보를 보유한 기업-연도의 비율은 연도별로 29.8~36.2%이며 전체로는 32.9%이다. 담보 기업-연도 가운데 전통적 주식담보대출이 아닌 몫($NONSTD\\_SH>0$)이 있는 것은 1,025개로, 담보 주식의 8.4%이다. 주 담보 밖에서 처분이 제한된 주식($RESTRICT\\_SH>0$)이 있는 기업-연도는 1,354개(4.7%)이고, 그중 1,253개에는 납세담보·법원 공탁·관공서 이행보증이 있다(§2.3 ⑤). 1,354개 가운데 488개는 금융 차입 담보가 없어 $PLEDGE=0$인데도 처분이 제한된 주식이 있다.\n\n〈표 3〉 연도별 표본 분포\n\n| 연도 | 기업-연도 | 유가증권 | 코스닥 | 관측 | 담보 있음 | 비율(%) | 담보/보유 중앙값(%) |\n|---:|---:|---:|---:|---:|---:|---:|---:|\n| 2011 | 1,117 | 444 | 673 | 1,092 | 388 | 34.7 | 31.4 |\n| 2012 | 1,343 | 546 | 797 | 1,031 | 438 | 32.6 | 28.2 |\n| 2013 | 1,474 | 599 | 875 | 1,053 | 465 | 31.5 | 31.9 |\n| 2014 | 1,550 | 626 | 924 | 1,055 | 505 | 32.6 | 31.3 |\n| 2015 | 1,653 | 649 | 1,004 | 1,147 | 519 | 31.4 | 26.5 |\n| 2016 | 1,738 | 671 | 1,067 | 1,152 | 565 | 32.5 | 26.5 |\n| 2017 | -연도, 나머지는 담보 있는 기업-연도의 값이다. $LOAN$ N부터 오른쪽 칸은 「다」가 신설된 2020년 7월 서식 이후에만 있어 2011~2019년은 「–」이고, 전체 행도 2020~2025년만 센다.\n\n$PLEDGE\\_RATIO$는 평균(35.4%)이 중앙값(27.4%)보다 크고 P90이 82.9%로, 오른쪽으로 긴 꼬리를 가진다. 정확히 100%인 기업-연도는 226개(2.4%)이다. 연말 담보 상태의 연도 간 전이(연속된 두 기업-연도 기준)는 0→1이 1,292회, 1→0이 1,013회로 기업 고정효과 설계에 필요한 기업 내 변동이 있다. 다만 이는 연말 상태의 변화이지 담보 설정·해소 사건의 수가 아니다.\n\n## 6. 자료의 타당성\n\n구축 자료의 정합성은 상용 데이터베이스(DataGuide) 「주식담보대출내역」과 양방향으로 대조하여 확인하였다. 대조는 두 단계이다. 첫째는 추출의 정합성으로, 계약이 작성기준일에 유효한지 가리기 전의 공시 원문 담보 행 277,076행(벤더 상품의 범위에 맞춘 집합)이 벤더 자료에 있는지를 본다. 공시일·종목·주식수로 짝지은 기준에서 96.9%가, 체결일·주주·계약상대방·1:1 유일성까지 요구하는 엄격한 기준에서도 82.9%가 일치하였다.[^match] 양방향 모두에서 마지막까지 설명되지 않던 수량 불일치는 공시 원문으로 전수 확인하였으며, 그 결과 점검한 불일치 가운데 본 연구 측의 추출 오류나 수집 누락으로 남은 것은 없었다. 둘째는 계약 유효성 판정(해지·상환·만료로 끝난 계약의 제외)의 비교이다. 벤더 자료는 보고서 표의 행을 그대로 잔존 계약으로 옮기므로 본 연구의 유효성 판정을 대신할 수 없으며, 두 자료의 잔존 판정이 갈린 행은 전부 본 연구가 벤더보다 담보를 적게 잡는 방향이었다(이미 끝났거나 최신 보고서에서 사라진 계약을 본 연구는 제외하고 벤더는 남긴 경우).[^resid]\n\n〈표 5〉는 벤더의 연말 단면에서 출발해 행을 제외하고 더하는 단계를 거쳐 본 연구 패널의 살아있는 담보 행에 이르는 과정이다. 먼저 본 연구 행과 짝을 지을 수 없는 행과 본 연구 범위 밖의 행을 걷어 비교 모집단을 만들고, 여기서 벤더에는 있으나 연말에 살아 있지 않은 담보(§4의 판정, 벤더의 최신 보고서 미반영, 중복 기재)를 제외한다. 그다음 벤더에 없는 담보(생존 편의로 빠진 상장폐지 종목과 상장 중인 종목의 커버리지 공백)와 벤더에도 있으나 행끼리 짝을 짓지 못한 계약을 더하면 본 연구의 12월말 스냅샷에 살아있는 담보 행이 되며, 담보 주식수 합이 양쪽에서 일치함을 확인하였다.[^t5]\n\n〈표 5〉 벤더 연말 단면에서 본 연구 패널까지의 조정\n\n| 단계 | 행 | 내용 |\n|---|---:|---|\n| 벤더 연말 단면 (2011~2025년 각 12월 31일) | 48,256 | |\n| − 본 연구 행과 짝을 지을 수 없는 벤더 행 | −3,947 | 본 연구 수집 범위(2011년~) 밖인 2009~2010년 공시 2,273<br>벤더가 정정 전 판의 공시일을 출처로 적어 그 날짜의 보고서가 본 연구 자료에 없음 812<br>공시일·종목·주식수가 같은 행이 여럿이라 1:1로 붙일 수 없음 759<br>그 날 보고서는 있으나 같은 수량의 행이 없음 103 |\n| − 본 연구 범위 밖 | −4,871 | 최대주주 그룹 보고서가 아님 1,465<br>납세담보·공탁(본 연구 별도 변수, §2.3 ⑤) 3,156<br>의결권 없는 증권·담보가 아닌 계약·음수 행 190<br>연말 최신 최대주주 보고서가 계약 절 없는 약식이라 패널에서 제외한 기업-연도(§2.2 (iii)) 60 |\n| = 비교 모집단 | 39,438 | 본 연구 행과 짝을 지어 비교할 수 있는 벤더 행 |\n| − 벤더에는 있으나 연말에 살아 있지 않은 담보(유효하지 않은 잔존) | −6,435 | 벤더가 출처로 삼은 공시 시점에 이미 끝난 계약(질권자 쪽·담보가 아닌 계약 포함) 1,272<br>그 뒤 최신 보고서(대부분 담보 없음)를 벤더가 반영하지 않아 남은 옛 공시의 행 타내는 스냅샷의 연도이다. 스냅샷은 작성기준일이 아니라 상태일(`state_dt`, §2.1)로 연도에 배정하므로, 2025년 스냅샷 가운데에는 2026년에 공시된 보고서(`rpt_dt`)도 있다. 12월 결산이 아닌 기업의 재무자료와 이을 때는 결산월을 확인한다.\n\n**변수.** `firm_year_panel.csv`의 43개 열은 다음과 같다. 비율 변수는 모두 의결권 주식 기준이다.\n\n| 묶음 | 열 | 정의 |\n|---|---|---|\n| 식별·시점 | `stock_code` | 종목코드. 6자리 문자열(선행 0 보존, 2024년 이후 신규 상장은 `0126Z0`처럼 영문 혼합) |\n|  | `corp_name` | 회사명(스냅샷 보고서 시점) |\n|  | `year` | 연도. 그 해 12월 31일 상태를 나타낸다 |\n|  | `market` | 그 해 연말의 시장. `Y` 유가증권, `K` 코스닥 |\n|  | `rcept_no` | 그 해 스냅샷 보고서의 접수번호(최종 정정본) |\n|  | `state_dt` | 스냅샷의 상태일. 연도 배정의 기준(§2.1) |\n|  | `rpt_dt` | 스냅샷 보고서의 공시일(최종 정정본 접수일). 정보 시점 점검에 쓴다 |\n|  | `is_carried` | $CARRIED$. 그 해 안의 상태를 적은 보고서가 없어 직전 보고서를 이월했으면 1 |\n|  | `carry_years` | 이월 연수(`year`와 상태일 연도의 차) |\n|  | `reporter` | 스냅샷 보고서의 대표보고자 |\n|  | `reporter_changed` | 직전 연도 스냅샷과 대표보고자가 다르면 1. 그룹 안의 대표 교대도 1이라 최대주주 교체 지표로 쓰지 않는다 |\n|  | `group_continuity` | `reporter_changed=1`일 때만 값. 직전·이번 스냅샷의 대표보고자·특별관계자·최대주주 이름이 겹치면 1(같은 그룹), 0이면 그룹이 바뀐 후보 |\n|  | `snapshot_reporter_type` | 스냅샷 보고자 유형. `group` 지배주주 그룹, `financial_investor` 재무적 투자자 연명 보고서, `creditor` 채권은행 |\n| 보유 | `holding_shares_voting` | 검증된 지배주주 그룹(보고자와 특별관계자)의 의결권 보유주식수. 잠재주식 제외(§3.1) |\n|  | `issued_voting_shares` | 검증된 의결권 있는 발행주식총수(자기주식 포함) |\n|  | `holding_pct_voting` | $OWN$. `holding_shares_voting` ÷ `issued_voting_shares` × 100 |\n| 담보 | `has_collateral` | $PLEDGE$. 연말에 살아 있는 금융 차입 담보가 있으면 1 |\n|  | `collateral_shares_live` | $PLEDGE\\_SH$. 연말에 살아 있는 담보 주식수(유효성 판정, 동일 담보 중복 제거, 수량 보정, 연말 보충 반영) |\n|  | `collateral_to_voting_pct` | $PLEDGE\\_RATIO$. `collateral_shares_live` ÷ `holding_shares_voting` × 100 |\n|  | `collateral_pct_of_voting_total` | $PLEDGE\\_TOT$. `collateral_shares_live` ÷ `issued_voting_shares` × 100 |\n|  | `nonstandard_collateral_shares` | $NONSTD\\_SH$. `collateral_shares_live` 가운데 전통적 주식담보대출(담보제공자 본인이나 그룹 구성원이 금융기관 등에서 빌린 돈의 담보)이 아닌 담보제공계약의 몫. 유형이 여럿인 계약도 한 번만 센다 |\n|  | `collateral_types` | 그 몫의 유형별 주식수(`유형=주식수`를 `;`로 이음. 한 계약이 여러 유형이면 각 유형에 모두 센다). 유형은 [^ctype] |\n|  | `n_live` | 스냅샷 보고서의 살아 있는 담보 계약 행 수 |\n|  | `n_counterparties_live` | $N\\_LENDER$. 살아 있는 담보의 상대방(담보권자) 수 |\n|  | `n_pledgors_live` | $N\\_PLEDGOR$. 살아 있는 담보의 담보제공자 수 |\n|  | `has_nonvoting_collateral` | 비의결권 증권(전환사채 등) 담보가 스냅샷 보고서에 있으면 1. 주 담보 변수에는 넣지 않는다 |\n| 주 담보 밖 처분 제한 | `restricted_other_shares` | $RESTRICT\\_SH$. 주 담보에 넣지 않았지만 처분이 제한된 주식수: 납세담보·공탁(`tax_collateral_shares_live` + `deposit_shares_live`)과, 조건부 의무·금전이 아닌 의무를 담보한 질권 가운데 연말에 살아 있던 것. `collateral_shares_live`와 계약 행이 겹치지 않는다 |\n|  | `has_tax_collateral` | 그 가운데 납세담보·공탁 등 금융 차입이 아닌 담보가 살아 있으면 1(주 담보와 별도) |\n|  | `tax_collateral_shares_live` | 살아 있는 납세담보 주식수 |\n|  | `deposit_shares_live` | 그 밖의 법원 공탁·관공서 이행보증 주식수 |\n|  | `tax_collateral_to_voting_pct` | (납세담보 + 공탁) ÷ `holding_shares_voting` × 100. 분모가 $PLEDGE\\_RATIO$와 같아 더할 수 있다 |\n| 대출 (2020~2025년만, 2011~2019년은 빈칸) | `loan_krw_live` | $LOAN$. 살아 있는 담보에 연결된 「다」 대출금액 합(원, 공동담보 중복 제거, 원천으로 확인된 연말 잔액 반영) |\n|  | `loan_na_reason` | 담보가 있는데 `loan_krw_live`가 빈 이유(담보가 없으면 빈칸).<br>`pre_2020`: 2011~2019년(대출 변수를 두지 않음)<br>`no_da_rows`: 「다」 행 자체가 없음(2020년 7월 개정 전 서식 보고서를 이월한 경우 포함)<br>`da_blank`: 「다」의 모든 칸이 「-」 자리표시<br>`no_loan_amount`: 「다」는 연결됐으나 대출금액 칸이 빔<br>`unmapped`: 「다」에 내용이 있으나 살아 있는 「나」 행과 연결되지 않음<br>`repo_no_da`: 담보가 환매조건부 매도뿐(대금은 「나」 비고·각주에 적힘)<br>`supplement_no_loan`: 담보가 연말 보충분뿐인데 보충한 계약의 대출금액이 없음 |\n|  | `loan_krw_limit` | `loan_krw_live` 가운데 한도·약정액으로 판정되고 연말 잔액을 확인하지 못한 몫 |\n|  | `loan_krw_cross_issuer` | `loan_krw_live` 가운데 다른 회사 주식과 함께 담보로 잡힌 대출 몫. 그 대출은 관련 기업마다 전액 들어 있어 여러 기업을 합산하면 중복된다 |\n|  | `loan_linked_shares` | `loan_krw_live`에 대출금액이 들어간 담보의 주식수. `loan_krw_live` ÷ 이 값이 담보 1주당 대출이다(아래 「비율을 만들 때 분자와 분모의 짝」) |\n|  | `kep_pct_median` | $MAINT$. 유효 행(100~300%)의 담보유지비율 중앙값 |\n|  | `kep_pct_wavg` | $MAINT\\_W$. 같은 유효 행의 대출금액 가중평균 |\n|  | `int_pct_median` | $INT$. 유효 행의 이자율 중앙값 |\n|  | `int_pct_wavg` | $INT\\_W$. 같은 유효 행의 대출금액 가중평균 |\n| 주가 | `close_yearend` | 그 해 마지막 매매거래일의 KRX 종가(원). 수정하지 않은 그날의 실제 종가이다 |\n|  | `trade_halted_yearend` | 그날 거래량이 0이면 1(매매거래정지 등이며, 종가는 그날의 기준가격) |\n|  | `unit_factor` | 주식수 열을 그 해 12월 31일 단위로 바꾸는 배수. 스냅샷 뒤 연말 전에 분할·병합·감자·무상증자·주식배당이 있으면 그 배수, 없으면 1, 확인되지 않으면 빈칸(아래 「주가와 주식수의 단위」) |\n\n**단위.** 주식수는 주, 금액은 원, 비율은 % 단위이다. 비율의 범위는 변수마다 다르다(담보/보유는 100을 조금 넘을 수 있고 담보유지비율은 100~300). 〈표 4〉의 천주·억원은 표시용이다.\n\n**결측과 0.** 패널에 들어 있는 기업-연도(최대주주 그룹 보고서로 연말 상태를 읽을 수 있는 기업-연도, §2.2)에서는 주 담보비율과 보유비율에 빈칸이 없다. 스냅샷에서 의결권 주식이 0주로 확인되면 그 그룹이 최대주주 자리에서 물러난 것으로 보아 그 기업-연도를 패널에서 제외했기 때문이다(§2.2). 대출금액·이자율·담보유지비율의 빈칸은 경우에 따라 뜻이 다르다. 담보가 없는 기업-연도($PLEDGE_{it}=0$)와 2011~2019년(`loan_na_reason=pre_2020`)에서는 해당 없음이고, 2020년 이후 담보가 있는 기업-연도($PLEDGE_{it}=1$)에서는 결측이며 그 사유를 `loan_na_reason`에 적었다. 어느 경우든 빈칸을 0으로 채우지 않는다. `group_continuity`는 `reporter_changed=1`일 때만 값이 있다.\n\n**목적별 강건성 점검.**\n\n- 담보 유무($PLEDGE$): 0 또는 1로 재는 변수라 기업-연도 하나가 잘못 분류되면 결론이 곧바로 흔들린다. 아래 세 점검은 담보 유무를 가장 믿기 어려운 부분을 차례로 걷어내도 결론이 같은지를 본다.\n  - 공시가 모자라는 초기 연도: 패널은 최대주주 그룹의 보고서가 있는 기업-연도만 담고, 보고서가 없어 담보 유무를 모르는 기업-연도는 0으로 채우지 않고 제외했다. 이렇게 제외된 기업-연도는 2011년에 상장 기업-연도의 36.2%이고 2015년부터는 해마다 10% 아래로 초기에 몰려 있다. 수집 이전(2010년 이전)에 낸 보고서를 모으지 않아 첫 보고서 이전 연도의 담보를 알 수 없기 때문이다. 그래서 2015년 이후를 주 표본으로 하고(§3.2, 이 기간 패널은 상장 기업-연도의 95.8%를 덮는다) 2011~2014년을 넣은 전 기간에서도 결론이 같은지 견준다.\n  - 직접 보지 않고 가정한 이월 연도: 그 해에 새 보고서가 없으면 직전 보고서를 이월해 쓴다(전체의 30.8%). 발행주식총수의 1% 이상인 담보 변화는 보고 사유이므로 새 보고서가 없으면 변화도 없었다고 읽는데, 이는 관측이 아니라 가정이다. 담보를 제공한 쪽이 법인이면 그 해 감사보고서로 연말 상태를 확인해 끝난 담보를 제외했지만(§2.1, [^supp]), 개인이 맡긴 담보는 그런 원천이 없다. 이월이 길수록(`carry_years`) 가정은 약해지므로 새 보고서가 있는 관측 연도만(`is_carried=0`) 쓰거나 이월 연수를 제한해 본다. 이월 기업-연도는 담보가 있는 비율이 14.7%로 관측 연도의 41.0%보다 크게 낮은데, 담보를 맺고 바꾸는 기업은 보고서를 자주 내 이월이 드물기 때문이다. 그러므로 관측 연도만 쓰면 담보 있는 기업이 상대적으로 많이 남는다는 점을 감안해 읽는다.\n  - 담보의 성격이 다를 수 있는 보고서: 대부분의 스냅샷은 지배주주 그룹이 대표보고자이지만, 재무적 투자자(55개 기업-연도)나 채권은행단(2개)이 대표보고자인 연명 보고서가 스냅샷인 기업-연도가 있다. 이 보고서의 담보는 지배주주가 자금을 조달하려고 맡긴 것과 성격이 다를 수 있어 `snapshot_reporter_type='group'`인 기업-연도만 남겨 본다. 전체의 0.2%이고 담보가 있는 것은 4개뿐이라 결론을 바꿀 여지는 작으며, 이 점검은 그 소수가 결과를 좌우하지 않음을 확인하는 데 있다.\n- 담보 수준($PLEDGE\\_RATIO$·$PLEDGE\\_TOT$): 주 변수는 의결권 주식 기준이다. 두 변수는 분모가 달라 묻는 것이 다르다. $PLEDGE\\_RATIO$는 지배주주 그룹이 가진 주식 가운데 얼마를 맡겼는지, $PLEDGE\\_TOT$는 회사 전체 주식 가운데 얼마가 담보로 잡혔는지를 잰다($PLEDGE\\_TOT$ = $PLEDGE\\_RATIO$ × $OWN$ ÷ 100). 지분이 작은 대주주가 전량을 맡기면 앞의 것은 100%이지만 뒤의 것은 작으므로 결론이 두 변수에서 같은 방향인지 함께 본다. 값 자체가 흔들릴 수 있는 세 곳은 아래처럼 따로 점검한다.\n  - 보유 전량을 맡긴 기업-연도: 담보/보유가 정확히 100%인 기업-연도는 226개(2.4%)로 값이 상한에 몰려 있고, 그중 154개는 계약이 1건이다.[^t4] 이들을 제외하거나 위쪽 꼬리를 잘라, 결론이 전량 담보 기업에 좌우되지 않는지 본다.\n  - 주 담보에 넣지 않은 담보: 비의결권 증권(전환사채 등)을 담보로 한 기업-연도는 203개이고 주식수는 싣지 않았으므로(`has_nonvoting_collateral` 표시만 있음) 비율에 더하지 못한다. 이 표시가 켜진 기업-연도를 제외하고 비교한다.[^nonvote] 납세담보·공탁, 그리고 조건이 생겨야 돈을 내는 의무나 금전이 아닌 의무를 담보한 질권은 금융 차입의 담보가 아니어서 주 담보에서 제외했다. 하지만 처분이 제한된 주식이라는 점은 같으므로(`restricted_other_shares`, 1,354개 기업-연도. 그중 납세담보·공탁 1,253개) 이 주식수를 `collateral_shares_live`에 더해 비율을 다시 재어 본다(분모는 그대로).\n  - 전통적 주식담보대출이 아닌 담보: 대부분의 담보는 담보제공자 본인이나 그룹 구성원이 금융기관에서 빌린 돈의 담보이다. 그런데 형식(환매조건부 매도·담보신탁), 빚진 사람(계열사·현지법인 등 남의 빚을 대신 담보한 물상보증), 담보하는 빚(사채·파생 거래 정산·상거래 채무), 상대방(같은 그룹이나 발행회사 자신)이 다른 계약이 섞여 있다.[^ctype] 모두 주식의 처분을 묶고 빚을 갚지 못하면 주식이 처분될 수 있어 주 담보에 넣었다. 다만 분석이 무엇을 보느냐에 따라 무게가 다르다. 최대주주 자신의 자금 압박을 보는 분석이면 남의 빚을 대신 담보한 몫은 성격이 다르고, 반대매매로 주식이 그룹 밖으로 팔려 나갈 위험을 보는 분석이면 상대방이 그룹 안이거나 발행회사인 몫은 그 위험이 작다. 그래서 이 계약들의 몫(`nonstandard_collateral_shares`, 1,025개 기업-연도, 담보 주식의 8.4%) 전체를 차감하거나, `collateral_types`에서 분석 목적에 맞지 않는 유형만 골라 차감한 주식수로 비율을 다시 재어 비교한다(분모는 그대로). 담보가 이 몫뿐인 330개 기업-연도는 차감하면 담보가 없어지므로 담보 유무 점검의 성격도 겸한다.\n- 대출 계약 조건($LOAN$·$INT$·$MAINT$): 담보 변수가 지배주주의 주식이 얼마나 묶였는지를 잰다면, 이 변수들은 그 주식을 담보로 얼마를 어떤 조건에 빌렸는지를 잰다. 담보가 없는 기업-연도에는 값이 없으므로 담보 유무가 아니라 담보가 있는 기업끼리 견주는 데 쓴다. 세 변수는 묻는 것이 다르다. $LOAN$은 빚의 크기로, 기업 규모에 따라 차이가 커서(〈표 4〉) 원값보다 로그를 취하거나 담보 주식의 가치에 견주어 쓴다. $INT$는 그 빚의 값(조달 비용)이다. $MAINT$는 대주가 요구하는 담보의 두께로, 높을수록 주가가 조금만 내려도 추가 담보나 처분 요구를 받는다. 셋을 담보 주식수·주가와 합치면 반대매매 압력을 잴 수 있다. 담보 1주당 대출($LOAN$ ÷ `loan_linked_shares`)을 연말 주가(`close_yearend`)로 나누면 담보가치 대비 대출 비율이 되고, 1주당 대출에 $MAINT\\_W$ ÷ 100을 곱하면 주가가 그 아래로 내려갈 때 추가 담보나 처분 요구가 나오는 기준 주가가 된다. 연말 주가가 이 기준 주가보다 얼마나 높은지(연말 주가 ÷ 기준 주가 − 1)가 마진콜까지 남은 하락 여유이다. 대출이 여럿이면 기준이 대출마다 달라 이 기준 주가는 여러 대출을 하나로 본 근사이므로, 대출금액으로 가중한 $MAINT\\_W$를 쓴다. 나누는 주식수와 주가의 짝은 아래 「비율을 만들 때 분자와 분모의 짝」과 「주가와 주식수의 단위」에서 맞춘다. 다만 $LOAN$은 지배주주 개인의 빚이 아니고 채무자가 계열회사일 수도 있으므로(§4.3), 최대주주 개인의 자금 압박으로 읽을 때는 이 점을 감안한다. 이 변수들은 「다」 표가 신설된 2020년 7월 서식 이후에만 값이 있어 2020~2025년만 대상이고, 그 기간의 담보 기업-연도 4,474개 가운데에도 507개는 비어 있다.[^t4] 아래 다섯 점검은 공시의 한 칸에 성격이 다른 값이 섞인 것(한도·공동담보·여러 대출의 대표 조건)과, 비율을 만들 때 분자와 분모가 가리키는 범위나 단위가 다른 것이 결론을 좌우하지 않는지 본다.\n  - 한도와 실제 대출의 혼재: 「다」의 대출금액 칸에 실제로 빌린 돈이 아니라 빌릴 수 있는 최대 금액(한도, 마이너스통장의 한도와 같은 것)을 적은 보고자가 있다. 한도에는 아직 쓰지 않은 몫이 들어 있어, 그대로 더하면 빚이 실제보다 크게 잡힌다. 「다」의 기타 칸이나 각주에 한도·약정 같은 말이 있는 대출은 원문으로 판정해, 그 해 12월 31일의 실제 잔액이 확인되면 잔액으로 바꿨다(§4.3). 잔액을 확인하지 못해 한도 금액이 그대로 남은 대출이 있는 기업-연도는 `loan_krw_limit`이 0보다 크며(66개), 이들을 제외하고 결론이 같은지 본다. 한도 몫을 대출금액에서 차감하는 방식을 쓰지 않는 것은, 66개 가운데 19개는 대출 전액이 한도여서 차감하면 대출이 0이 되고, 한 행에 실제 대출과 한도가 합쳐진 경우(두산의 350억 원 가운데 100억 원이 한도)에는 실제로 빌린 돈까지 차감되기 때문이다. 다만 한도라는 말 없이 한도를 적은 대출은 가려낼 수 없으므로 66개는 한도가 섞인 기업-연도의 하한이다.\n\n  - 여러 회사가 함께 담보로 잡힌 대출: 하나의 대출이 여러 회사의 주식을 함께 담보로 잡으면 그 대출 전액이 관련된 회사마다 들어 있다(396개 기업-연도). 그 대출은 그 회사 주식만이 아니라 다른 회사 주식과 함께 담보하는 것인데 대출금액($LOAN$)에는 전액이 잡히므로, 이 기업-연도들에서는 그 회사 담보에 비해 대출이 크게 보인다. 대부분은 패널 안 두 회사에 함께 들어 있는 대출이고, 가장 큰 예로 2021년 다섯 회사 주식이 함께 담보인 3조 원 대출은 다섯 회사 모두에 3조 원으로 들어 있다. 그래서 `loan_krw_cross_issuer` 몫을 차감한 대출금액(`loan_krw_live − loan_krw_cross_issuer`)으로 다시 재거나 이 기업-연도를 제외하고 결론이 같은지 본다. 기업-연도별 분석이 아니라 여러 회사를 더해 시장·업종별 합계를 낼 때는 같은 대출이 여러 번 세어지는 문제도 더해지므로, 연도·채무자·대출금액·대주가 같은 대출은 한 번만 센다.\n  - 비율을 만들 때 분자와 분모의 짝: 1주당 대출이나 기준 주가처럼 대출금액을 담보 주식수로 나눌 때는 둘이 같은 담보를 가리켜야 한다. $LOAN$은 「다」에 대출금액이 적힌 담보의 대출만 더하는데 $PLEDGE\\_SH$는 살아 있는 담보를 모두 센다. 그래서 대출금액이 실제로 들어간 담보만 센 주식수 `loan_linked_shares`로 나눈다.[^linkneg] 두 주식수가 다른 기업-연도는 대출이 관측된 3,967개 가운데 396개이고, 여기서 $PLEDGE\\_SH$로 나누면 1주당 대출이 실제보다 작게 나온다. 〈표 4〉의 담보 1주당 대출금액도 `loan_linked_shares`로 나눈 값이다.\n\n    이렇게 나눠도 맞지 않는 경우가 하나 남는다. 대출 하나를 여러 회사의 주식으로 함께 담보하면, 대출금액은 전액인데 나누는 주식은 이 회사 주식뿐이어서 1주당 대출이 크게 나온다. 패널의 `loan_krw_cross_issuer`가 0보다 큰 기업-연도(396개)가 이 경우이므로, 이 열로 골라 제외한다. 이 열은 「다」의 기타·채무자 칸에 다른 회사 주식과 함께 담보라는 문구가 있거나, 같은 해 다른 종목의 패널에 같은 대출(연도·채무자·대출금액·대주가 같은 대출)이 있는 대출의 금액을 더한 값이다(§4.3).\n\n    대출이 관측된 3,967개에서 이 396개와, 대출이 연결된 담보 주식이 없는 1개를 제외하면 3,570개가 남는다. 이 3,570개에서는 1주당 대출과, 연말 종가와 견준 담보가치 대비 대출 비율을 잴 수 있다. 기준 주가와 하락 여유까지 재려면 담보유지비율($MAINT\\_W$)이 더 있어야 하는데, 그중 716개는 담보유지비율이 계약 조건으로 읽히는 100~300%로 적힌 「다」 행이 없어 $MAINT\\_W$가 비어 있다(§4.4). 그래서 기준 주가와의 거리까지 잴 수 있는 것은 2,854개이다(연말 종가는 모두 있고, 환산 배수가 빈 1개는 이 716개에 들어 있다).\n  - 주가와 주식수의 단위: 담보가치는 주식수에 주가를 곱한 값이므로 두 숫자가 같은 날 같은 단위여야 한다. 주가는 패널의 `close_yearend`를 쓴다. 따로 계산한 값이 아니라, 그 해 마지막 매매거래일에 KRX 「전종목 시세」가 발표한 그날의 실제 종가(수정하지 않은 주가)이다. 수정주가는 나중에 생긴 분할·증자를 과거 가격에 거슬러 반영한 값이라 그 시점에 공시된 주식수와 곱하면 단위가 어긋나므로, 수익률·변동성처럼 기간에 걸친 변화를 잴 때만 쓴다. 그날 거래량이 0인 645개 기업-연도(`trade_halted_yearend=1`)는 매매거래정지 등으로 종가가 그날의 기준가격이다.\n\n    주식수 쪽은 스냅샷 보고서에 적힌 수량이다. 스냅샷의 상태일 뒤 연말 전에 액면분할·주식병합·감자·무상증자·주식배당이 있으면 연말 종가는 사건 뒤 가격인데 주식수는 사건 전 수량이라 단위가 어긋난다. 이를 맞추는 것이 환산 배수 `unit_factor`이다. 배수는 그 사이 사건마다 기존 1주가 몇 주가 되었는지(사건 뒤 주식수 ÷ 사건 전 주식수)를 모두 곱한 값이다. 1:5 액면분할은 5, 10:1 주식병합은 0.1, 1주당 0.5주 무상증자는 1.5, 5% 주식배당은 1.05이고, 사건이 없으면 1이다. 이 배수로 연말 단위의 값을 만든다.\n\n    - 연말 담보 주식수 = `collateral_shares_live` × `unit_factor`, 연말 담보가치 = 연말 담보 주식수 × `close_yearend`\n    - 연말 단위 1주당 대출 = $LOAN$ ÷ (`loan_linked_shares` × `unit_factor`), 기준 주가 = 연말 단위 1주당 대출 × $MAINT\\_W$ ÷ 100\n    - 하락 여유 = `close_yearend` ÷ 기준 주가 − 1\n\n    현대ADM 2024년이 그 예이다(아래 그림). 스냅샷(2024년 7월 1일)의 담보는 7,623,641주인데, 11월 28일 1:1 무상증자로 1주가 2주가 되었고 연말 종가 1,677원은 무상증자 뒤 가격이다. 환산하지 않으면 담보가치가 127.8억 원으로 대출 180억 원보다 작아 이미 마진콜 아래에 있는 것처럼 보이지만, 배수 2를 곱하면 담보가치 255.7억 원, 기준 주가 1,299원, 하락 여유 29%이다. 담보를 준 현대바이오사이언스의 2024 사업보고서 주석도 연말 담보를 15,247,282주(= 7,623,641 × 2)로 적었다.\n\n    ![주식수와 연말 종가의 단위 맞추기: 현대ADM 2024년](img/unit_factor_example.svg)\n\n    무상증자 뒤 질권이 신주에 미치지 않은 담보는 이미 스냅샷 단위로 고쳐 두었으므로 배수를 그대로 곱한다. 배수의 크기는 보고서 제3부 세부변동내역에 적힌 보유자의 변동 전후 주식수에서 구하고, 같은 사건을 날짜를 달리해 두 번 적은 기록을 걸러내려고 사건 전후 보고서의 발행주식총수 비율로 확인했다. 어느 조합으로도 확인되지 않으면 배수를 비워 두었다.\n\n    사건이 그 해 연말 종가에 이미 반영됐는지는 제3부에 적힌 날짜가 아니라 KRX가 그 사건으로 주가를 조정한 날로 정한다. 제3부의 날짜는 보고자마다 신주배정기준일·상장일·교부일로 다르고, 주가는 무상증자·주식배당이면 권리락일(그날부터 주식을 사도 신주를 받지 못하는 첫날)에, 분할·병합·감자면 바뀐 주식이 거래되기 시작하는 변경상장일에 바뀌기 때문이다. 이 조정일이 그 해 마지막 매매거래일 이전이면 그 해 배수에 넣는다. 예컨대 신주배정기준일이 1월 1일인 무상증자는 권리락이 12월 말이어서 연말 종가가 이미 무상증자 뒤 가격이다. NHN의 1:1 무상증자는 기준일이 2022년 1월 1일이지만 권리락은 2021년 12월 29일이었고, 2021년 연말 종가 45,000원은 무상증자 뒤 가격이다. 조정일은 KRX 개별종목 시세에서 원주가와 수정주가의 비율이 바뀐 날로 찾았고, 찾지 못한 사건은 제3부의 날짜가 12월 31일 이전인지로 정했다.\n\n    KRX 수정주가 계수를 배수의 크기로 쓰지 않는 이유는 두 가지이다. 첫째, KRX는 유상증자 권리락에서도 과거 주가를 조정하지만 유상증자는 기존 1주가 그대로 1주이다. 권리락으로 주가가 내려가는 것은 떨어져 나간 신주인수권의 값만큼이어서, 공시된 주식수에 연말 원주가를 그대로 곱하면 그 시점의 담보가치가 된다. 둘째, 무상증자에서 자기주식에는 신주를 배정하지 않아 KRX 계수가 보유자의 배수보다 작다(NHN은 KRX 계수가 1.917, 보유자는 2배). 해당하는 기업-연도는 대출이 관측된 3,967개 가운데 46개(배수를 비운 1개 포함), 담보 기업-연도 9,422개 가운데 164개(배수를 비운 5개 포함)로 많지 않으므로, 환산하거나 제외하고 결론이 같은지 본다.  - 대출이 여러 건일 때의 대표 조건: 한 기업-연도에 대출이 여러 건이면 담보유지비율을 하나로 요약해야 한다. 대주에 따라 관행 유지비율이 달라(한국증권금융은 거의 110%, 증권사는 대개 140~170%) 한 기업-연도의 대출들이 서로 다른 조건을 갖는 것이 보통이다. 중앙값($MAINT$)은 「다」 행 수를, 가중평균($MAINT\\_W$)은 대출금액을 기준으로 요약하므로, 큰 대출과 작은 대출의 대주가 다르거나 보고자가 한 대출을 여러 행으로 나눠 적으면 두 값이 크게 벌어진다. 두 변수 각각으로 결론이 같은지 확인하고, 대주 종류를 통제하는 것도 방법이다.\n\n**근거 자료(대장) 보는 법.** 본문에는 논지에 필요한 수치만 두고, 세부 수치와 대표 사례는 각주에 두었다. 각주 끝의 「(대장 1-4)」·「(대장 2.3-5)」 같은 표시는 **그 수치의 근거가 된 공시 행들을 모아 둔 묶음의 번호**이다. 이 묶음들은 웹 문서 하나([gap_review.html](gap_review.html), 이하 「대장」)에 「분류」라는 이름으로 모여 있으며, 같은 폴더의 `gap_review_data.js`와 함께 두고 브라우저로 열면 된다. 아래 그림은 첫 각주(생존 편의)의 「대장 1-4」를 따라가는 예이다.\n\n![대장에서 각주의 근거를 찾는 순서](img/ledger_howto.svg)\n\n1. **탭을 고른다.** 번호에 점이 없으면(1-4) 「§1」 탭, 점이 있으면(2.3-5) 「§2~§6 판정 근거」 탭이다. 2.3-5는 원고 §2.3을 뒷받침하는 다섯째 분류이고, 1-4는 §1이 든 벤더 자료의 첫째 한계(생존 편의)에 딸린 넷째 분류이다(5로 시작하는 번호는 §1 끝 문단의 모집단).\n2. **번호 줄을 누른다.** 아래 표에 그 근거 행만 남는다. 줄 끝 「원고」 칸이 초록(✓)이면 원고의 수치와 대장의 계산이 같고, 빨강이면 다르다. 계산이 같다는 뜻이지 판정이 옳다는 보증은 아니다.\n3. **설명 상자를 읽는다.** 그 번호를 단 원고 각주가 그대로 나온다. 각주 속 접수번호 옆 ⌕를 누르면 표가 그 사례의 행으로 좁혀진다.\n4. **행을 누른다.** 벤더가 적은 값, 본 연구가 적은 값, 판정 사유와 근거 원문이 펼쳐진다.\n5. **원문을 연다.** 접수번호를 누르면 DART 원문이 열린다.\n\n표는 한 번에 3,000행까지만 보여 주므로, 그보다 많으면 검색창과 연도 선택으로 좁힌다. 행으로 보여 줄 수 없는 서술(벤더 종목 유니버스와 상장폐지 종목 수, 벤더 원본 안의 중복, 「다」 변수 미제공과 행 단위 추적 불가, 수집 범위와 모집단 총수)은 각주에 수치만 있다. 대장을 다시 만들 때마다 각주의 번호와 사례가 실제 분류와 근거 행을 가리키는지 자동으로 확인한다.\n\n---\n\n[^surv]: 벤더 자료의 종목 유니버스 1,609개는 모두 자료 추출 시점(2026년 8월)의 상장 종목이다. 2011~2025년 중 상장되어 있다가 그 뒤 상장폐지된 538개 종목은 상장 당시의 공시까지 통째로 빠져 있다. 본 연구 패널에서 살아 있는 담보를 가진 기업-연도 9,422개 가운데 554개(172개 기업, 담보 63억 주)가 이 경우이다(대장 1-4). 예컨대 한진해운은 2017년 상장폐지되어 벤더 자료에 종목 자체가 없지만, 2016년 10월 보고서([20161011000365](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20161011000365))에서 최대주주 대한항공은 한진해운 주식 81,496,169주를 한국수출입은행·한국외환은행에 질권으로 제공하고 있었고, 이것이 본 연구 패널의 2016년 말 한진해운 담보이다. 연말 단면으로 대조해도 같다. 본 연구의 12월말 스냅샷에 살아 있는 담보 행 가운데 6,090행이 벤더 단면에 없고 그 80%(4,866행)는 해당 종목·연도 자체가 벤더에 없는 경우였다(433종목, 그중 182종목 3,012행은 상장폐지 종목). 나머지는 벤더에 그 종목·연도는 있으나 같은 주주·상대방의 계약이 없는 경우이다(대장 1-1·1-2·1-3·1-7).\n\n[^gap]: 계약별 원자료에 그 공시일·종목의 행이 하나도 없는 경우만 센 것이다(같은 공시가 있으나 수량만 다른 경우는 제외). 공시가 빠지면 그 공시에 새로 실린 담보가 벤더에 없고, 그 공시에서 사라진 담보는 옛 공시의 행으로 남는다. 본 연구의 담보 판정 대상 행을 기준으로 종목 전체가 빠진 경우(28종목 3,364행, 공시 778건, 대장 1-9)와 특정 공시만 빠진 경우(190종목 3,376행, 공시 479건, 대장 1-10)가 있으며, 앞의 28종목 가운데 26종목은 벤더 자신의 「상장된 시장」 자료에서 2025년 말 유가증권·코스닥 상장 종목이고 나머지 2종목은 리츠이다(링크는 DART 원문, 표시는 접수번호).\n\n    | 공백의 모양 | 사례 | 빠진 것 |\n    |---|---|---|\n    | 종목 전체 누락 | 더존비즈온. HD현대인프라코어(당시 두산인프라코어)와 아이에이치큐(행 수로 가장 큰 공백, 1,210행)도 같다 | 2011년 3월~2026년 6월 공시 110건 618행이 모두 없다. 계약의 종류가 주식담보대출 491행·담보계약 103행·질권 설정 18행으로 벤더 상품 정의에 그대로 들어맞는다(예: 최대주주 김용우가 신한투자증권 외에 6,221,184주를 질권 설정한 [20251107000002](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251107000002)) |\n    | 특정 공시만 누락 | 한온시스템 | 최대주주 한앤코오토홀딩스가 269,569,000주(50.50%)를 엔에이치투자증권 외 42를 상대로 설정한 주식근질권(2021년 3월 체결)은 벤더의 2021년 3월·2024년 12월 공시에는 있으나, 한국타이어앤테크놀로지와의 주식매매계약을 보고한 2024년 11월 공시 [20241101000396](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241101000396)에서만 빠졌다 |\n    | 특정 기간 통째 누락 | 금호석유화학 | 벤더 자료가 2011년 10월 공시 다음 2015년 4월 공시로 건너뛰어, 그 사이 최대주주 측 박찬구·박철완·박준경이 낸 보고서 49건 1,140행(우리은행·외환은행·광주은행·증권금융 등을 상대로 한 주식담보 차입계약)이 전부 없다(대장 1-10의 금호석유화학 1,179행은 이 1,140행과 2011년 2~3월 공시분 39행이다). 예컨대 [20141024000340](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20141024000340)(23행 4,218,627주)의 행 가운데 21행은 벤더가 2015년 4월 공시에서 처음 수록한 26행에 담보제공자·수량까지 같게 들어 있다 |\n\n[^stale]: 벤더 연말 단면 가운데 본 연구 모집단과 대응되는 39,438행 중 1,272행(3.2%, 주식수 3.5%)은 벤더가 출처로 삼은 바로 그 공시의 작성기준일에 이미 해지·상환·만료된 계약이었다(대장 2-1). 4,972행(12.6%, 주식수 13.3%)은 그 뒤에 제출된 최신 보고서를 벤더가 반영하지 않아 남은 옛 공시의 행이며(그중 4,191행은 최신 보고서의 「나」 표에 §2.3 조건을 충족하는 담보 행이 하나도 없는 경우, 대장 2-9·2-10), 90행은 동일 담보의 중복 기재였다(대장 2-13). 여기에 벤더 쪽 중복 등을 더한 6,435행(16.3%)이 〈표 5〉의 「유효하지 않은 잔존」이다. 옛 공시의 행이 남는 예로, 벤더는 티웨이항공(현 트리니티항공)의 2024년 말과 2025년 말 단면에 최대주주 티웨이홀딩스가 제이케이엘파트너스에 제공한 53,579,830주 질권을 2022년 5월 공시([20220502000544](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20220502000544))를 출처로 그대로 두었다. 그러나 티웨이홀딩스의 2024년 8월 보고서([20240809000295](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20240809000295))는 계약 여부를 「없음」으로 적고 「나」 표를 「-」로 비웠으며, 2025년 말 스냅샷인 새 최대주주 소노인터내셔널의 보고서([20251226000395](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251226000395))에도 담보가 없다. 동일 담보의 중복 기재는 보고자가 같은 주식을 1순위·2순위 근질권으로 나눠 상대방만 다르게 적거나, 대출채권 양도로 근질권자가 추가되어 같은 수량의 행이 다시 실린 경우이다. 행 하나하나는 살아 있는 계약이라 종료로 풀 수 없지만 합하면 보유주식수를 넘으므로, 본 연구는 대표 1행만 집계한다(§4.2, 기업-연도별 제외 행 수는 `n_dup_excluded`).\n\n[^termcase]: 벤더의 계약별 원자료에는 행마다 「계약/해지 구분」이 있지만 이것으로는 끝난 계약이 걸러지지 않는다. 벤더가 살아 있는 담보로 수록한 이 1,272행은 벤더 자신이 출처로 삼은 공시의 작성기준일에 이미 해지·상환·만료·담보권 실행 등으로 끝난 계약이었는데, 그 가운데 1,271행이 벤더의 계약별 원자료에서 「계약」으로 표시되어 있다(대장 2-2). 종료가 공시 원문의 어디에서 드러나는지로 나누면, 절반(612행, 48%)은 보고자가 공시 원문의 바로 그 행, 즉 계약의 종류나 비고 칸에 해지·해제·상환·말소를 직접 적어 두어 표만 보아도 끝난 계약임을 알 수 있다(대장 2-3). 나머지 660행은 그 행만 보면 살아 있는 계약처럼 보인다(대장 2-4). 그중 169행은 같은 행의 계약기간이 작성기준일 전에 끝난 것이 1단 규칙으로 먼저 드러났고(대장 2-5), 491행은 기간만으로는 존속이었으나 그 행 밖의 공시 원문(표 밖 각주, 제1부 변동사유, 제3부 세부변동내역, 「다」 표, 전후 보고서)으로 종료가 확인되었다(대장 2-6). 「다」 표는 2020년 7월 서식 개정으로 생겼으므로 그 전 보고서에는 이 근거가 없다. 1,272행에는 종료가 아니라 담보가 아니거나(194행) 보고자가 담보를 받은 쪽인(19행) 행도 들어 있다(대장 2-7·2-8). 근거 유형별 대표 사례는 다음과 같다(「계약」은 벤더 계약별 원자료의 계약/해지 구분).\n\n    | 종료가 드러난 곳 | 사례 | 공시 원문 |\n    |---|---|---|\n    | ① 같은 행의 비고 | 판타지오: 벤더가 2016~2025년 연말 단면 10개에 모두 「계약」으로 수록한 골드파이낸스코리아의 13,624,745주 | 출처 공시 [20161206000191](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20161206000191)의 「나」 비고가 \"해제: 2016년 12월 02일\"(작성기준일 12월 6일) |\n    | ② 계약기간 | 상상인증권(당시 골든브릿지투자증권): 골든브릿지 8,000,000주 | [20180403001773](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20180403001773)의 계약기간 \"2016.08.31~2017.12.31\"이 작성기준일보다 석 달 앞서 끝났고 연장 문구가 없다 |\n    | ③ 표 밖 각주 | 이스트소프트: 김장중의 예탁담보 | 표만 보면 존속이지만 [20240201000507](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20240201000507)의 표 아래 각주 (주2)가 \"대출금을 전액 상환함에 따라 동 계약을 해지 하였습니다\"라고 밝힌다 |\n    | ④ 제1부 변동사유 | 삼부토건: 디와이디 3,368,069주 | [20240826000365](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20240826000365)는 계약기간이 남아 있으나 변동사유가 \"담보권 실행\"이고 보유가 정확히 담보 수량만큼 줄었으며, 다음 보고서 [20241002000504](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241002000504)의 「나」는 빈 표이다 |\n    | ⑤ 제3부 세부변동내역 | 해성옵틱스: 서광희 67,156주 | [20160902000377](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20160902000377)의 「나」 비고는 \"차입금 담보제공\"이나 세부변동내역에 \"담보주식 반대매매\"로 적힌 장내매도가 있다 |\n    | ⑥ 「다」 표 | 안국약품: 어광·어진의 담보 세 행 | [20210513000938](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20210513000938)의 「나」 비고는 \"담보계약\"뿐이나 같은 수량의 「다」 세 행은 기타 칸이 \"상환완료\"이다 |\n    | ⑦ 전후 보고서 | 이노뎁: 이성진의 신한투자증권 담보 206,612주 | [20241226000354](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241226000354) 다음 보고서 [20250106000258](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20250106000258)에서 사라지고 앞 보고서 [20241213000402](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241213000402)에 같은 금액·금리의 iM증권 담보가 새로 실려 대출을 옮긴 것으로 확인된다(1단 규칙이 계약기간으로 먼저 만료를 잡아 대장 2-5에 있다) |\n\n    해지 행을 일괄 차감하는 방법도 쓸 수 없다. 해지 행이 가리키는 계약 행이 표에서 빠진 뒤에도 해지 행이 반복 기재되는 경우가 있어, 일괄 차감하면 다른 존속 계약이 깎인다. 벤더 자료에는 계약의 종류·계약기간·비고 칸이 없고 각주·변동사유·세부변동내역·「다」와도 연결되지 않으므로, 이용자는 벤더 자료만으로 이들 근거를 대조할 수 없다.\n\n[^proc]: 벤더 연말 행과 같은 수량의 본 연구 행이 없는 경우를 공시 원문으로 전수 귀속한 결과, 벤더 쪽 가공 오류로 확인된 행이 65행이다(대장 3-1). 두 유형이 대표적이다.\n\n    | 유형 | 사례 | 공시 원문과 벤더 기재 |\n    |---|---|---|\n    | ① 음수 행의 부호를 버림 | 씨젠 2024년 3월 보고서 [20240329002336](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20240329002336) | 공시 원문은 담보 설정 행과 함께 상환분을 「-3,345」처럼 음수로, 비고를 「상환」으로 적었다. 벤더는 이 상환 행 48개를 부호 없이 2024년 말 단면에 살아 있는 담보로 실어, 설정 행과 상환 행을 모두 잔존 담보로 센다 |\n    | ② 참고용 표를 정식 계약으로 옮김 | 카카오 2023년 6월 보고서 [20230607000422](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20230607000422) | 공시 원문은 정식 「나」 표(연번 1~18) 아래에 이미 끝난 계약을 모은 「계약 완료 현황」 표를 따로 두었다. 벤더는 그 표의 연번 26(장윤정 3,326주, 비고 「주식담보대출-상환」, 계약기간 2022년 5~11월)을 2023년 말과 2024년 말 단면에 살아 있는 담보로 실었다 |\n\n    이와 별도로 벤더의 계약별 원본(308,682행) 안에는 공시일·종목·주주·보고자·주식수·계약상대방·체결일이 전부 같은 행이 반복되는 기계적 중복이 2.2%(6,922행) 있다. 공시 원문에 같은 행이 반복 기재된 경우도 섞여 있어 일괄 제거하지 않았고, 대조에서는 비율만 보고한다. 연말 단면 파일에서는 같은 성격의 완전중복이 239행(0.5%)이며, 비교 모집단 안에서 본 연구의 대표로 뽑히지 않은 벤더 쪽 중복은 98행이다(대장 3-2). 이 가운데 59행은 사업보고서 「최대주주 및 특수관계인의 주식소유 현황」 대조(§4.1)로 본 연구가 연말 스냅샷을 바꾸거나 제외한 기업-연도의 벤더 행이다.\n\n[^cutoff]: 벤더는 연말 단면을 공시일로 자르므로, 상태일(§2.1)이 연말 이전인 보고서가 이듬해 1월에 공시되면 그해 단면에 반영되지 않고 그 전 공시의 행이 남는다(667행, 대장 4-2. 작성기준일 칸에 제출일을 적은 보고서도 본 연구는 상태일로 그해에 두므로 이 차이가 커졌다). 예컨대 에이블씨엔씨의 최대주주 리프앤바인은 작성기준일이 2017년 12월 28일인 보고서([20180104000076](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20180104000076))에서 유상증자 신주 취득과 함께 담보 수량을 13,726,235주로 고쳐 적었으나, 이 보고서가 2018년 1월 4일에 공시되어 벤더의 2017년 말 단면에는 그 전 공시([20171213000184](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20171213000184))의 9,032,700주 행이 남았다. 본 연구는 작성기준일로 연도를 배정한다(§2.1).\n\n[^nontop]: 벤더 연말 단면에는 최대주주 그룹 밖 주주의 담보가 1,465행 실려 있다(〈표 5〉, 대장 4-1). 벤더의 「보고자와 관계」는 그 보고서의 보고자를 기준으로 한 본인·특수관계인 구분이라, 어느 행이 발행회사 최대주주 그룹의 것인지 가려 주지 않는다. 아래 사례는 보고서 표지의 관계, 벤더 자신의 「최대주주등-대표주주명」, 사업보고서 「최대주주 변동현황」, 같은 시기 최대주주 측 보고서의 명단과 보유비율로 모두 최대주주 그룹 밖임을 확인한 것이다(괄호 안은 연말 기준일, 숫자열은 DART 접수번호).\n\n    | 사례 | 벤더가 실은 담보 | 그 보고서의 관계 | 연말 최대주주 |\n    |---|---|---|---|\n    | ① 한진칼(2021): 경영권 분쟁의 상대방 | 그레이스홀딩스(「본인」), 엠마홀딩스·헬레나홀딩스(「특수관계인」) 4행 6,959,688주 | 20211112000586: 특별관계자는 케이씨지아이(KCGI)와 그 사모투자합자회사들, 표지 관계는 주요주주(18.24%) | 조원태(벤더의 최대주주 자료와 사업보고서). 조원태 측 보고서 20210812000446의 보유비율 30.20% |\n    | ② 아시아나항공(2025): 피인수 뒤 남은 옛 지배주주 | 금호건설(「본인」) 22,896,020주, 계약상대방 한국산업은행 | 20250905000483: 대한항공의 신주 인수(2024년 12월) 뒤 표지 관계 주요주주(11.12%), 금호아시아나그룹 전 회장 박삼구가 특별관계자 | 대한항공(벤더 자료 63.88%, 대한항공 보고서 20241219000467) |\n    | ③ LG씨엔에스(2025): 재무적 투자자 | 크리스탈코리아(「본인」) 8,026,799주 | 20251105000317: 특별관계자는 맥쿼리코리아오퍼튜니티즈 사모투자합자회사들과 맥쿼리자산운용, 표지 관계 주요주주(8.28%) | LG(벤더 자료 47.09%, LG 보고서 20250207000688) |\n\n    그 밖에 최대주주와 지분이 비슷한 운용사(JB금융지주의 얼라인파트너스자산운용), 최대주주가 바뀐 뒤의 창업자(SK오션플랜트의 송무석) 같은 경우가 대장에 있다.\n\n[^taxdep]: 벤더 연말 행 가운데 본 연구의 공시 원문 행과 짝지어지는 행 중 3,156행은 과세관청에 맡긴 납세담보나 법원 공탁이다(대장 4-3). 상속세·증여세를 나눠 내거나(연부연납) 납부를 미루려면 세액에 상당하는 담보를 세무서에 제공해야 하는데, 지배주주는 보유 주식에 세무서를 질권자로 하는 질권을 설정하거나 주식을 법원에 공탁하는 방식으로 이를 제공하고 5% 보고서 「나」 표에 대출 담보와 함께 적는다. 예컨대 2025년 말 벤더 단면에는 삼성전자 이부진의 3,300,000주(계약상대방 서울서부지방법원, 계약의 종류 「공탁」, [20251107000558](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251107000558))와 LG 구광모의 817,000주(계약상대방 용산세무서, 계약의 종류 「주식 담보 제공」, [20251224000648](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251224000648))가 실려 있다. 이런 담보는 대주가 없고 주가가 떨어져도 반대매매로 이어지지 않으므로, 본 연구는 주 담보에서 떼어 별도 변수로 두었다(§2.3 ⑤).\n\n[^pop]: 정정공시의 최종본과 정정 사슬 중간 판을 남긴 최신본 141,883건의 공시 원문 XML에서 「나」 계약 449,986행, 「다」 담보 189,720행을 적재하였고, XML이 제공되지 않는 2,114건은 DART 웹 뷰어 HTML에서 읽었다. 보고자가 새 변동을 「[기재정정]」으로 앞 보고서에 덧붙여 낸 정정 사슬은 최종본만 받으면 그 사이 상태가 빠지므로, OpenDART의 정정 전 판까지 포함한 목록과 대조해 다른 작성기준일의 상태를 적은 중간 판 가운데 그 해 연말 스냅샷이 되는 14건을 공시 원문 판정으로 골라 별도 보고서로 넣었다. 모집단의 출발점은 표지·「2.가」·「2.나」 중 하나라도 발행회사와의 관계가 최대주주 또는 사실상지배주주로 기재된 보고서 78,527건이며, 여기서 공시 원문 점검으로 최대주주 그룹이 아닌 것으로 확인된 645건을 제외하고, 회사가 사업보고서 「최대주주 변동현황」에 최대주주로 적은 사람의 보고서 1,203건, 최대주주 지위를 승계한 보고서 175건, 「최대주주 및 특수관계인의 주식소유 현황」 대조로 확인한 연말 실제 최대주주의 보고서 99건을 더하였다. 가감의 대표 사례는 다음과 같다. ① **라벨은 있으나 제외한 보고서(대장 5-1).** 에스엠 지분을 모두 처분한 하이브의 2025년 6월 보고서([20250605000413](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20250605000413))는 「2.가」에 자신을 최대주주로 적었으나, 에스엠의 최대주주는 2023년 3월 공개매수 이후 카카오였다. 광림의 2대주주 쌍방울의 보고서([20181127000300](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20181127000300))도 「2.가」에 최대주주로 적었지만 최대주주는 칼라스홀딩스였다. ② **사업보고서로 더한 보고서(대장 5-2).** 넥슨은 2012년 6월 김택진 대표의 지분을 사들여 엔씨소프트 지분 14.68%를 가진 최대주주가 되었으나, 그 보고서([20120613000101](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20120613000101))의 관계는 표지와 「2.가」 모두 「주요주주」였다. 엔씨소프트의 사업보고서 「최대주주 변동현황」은 넥슨을 최대주주로 적었다. ③ **승계로 더한 보고서(대장 5-3).** 삼아알미늄의 최대주주 한상구가 2013년 4월 사망한 뒤 가족 한남희 외가 새로 낸 보고서([20130507001005](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20130507001005))부터 2025년까지의 25건은 관계를 모두 「임원(등기)」로 적었다.\n\n[^state]: 상태일은 대개 작성기준일이다. 다만 작성기준일 칸에 제출일을 적어 12월 말의 변동이 이듬해 날짜로 보고된 경우처럼 실제 변동보다 늦은 날짜가 적힌 보고서는, 보고서에 적힌 사건일(보고의무발생일, 「세부변동내역」의 변동일, 작성기준일 이전에 맺은 「2.나」 계약의 체결일) 가운데 가장 늦은 날을 상태일로 둔다. 또 장내 거래는 체결일에, 장외 양수도는 대금 지급일과 주식 인도일 중 먼저인 날에 소유가 넘어간 것으로 보므로, 장외 양수도 계약만 맺고 인도 전에 제출한 매수인의 보고서는 대금 지급·인도일을 상태일로 둔다. 연말 전의 큰 변동을 적은 보고서가 연말 뒤 소액 매매 한 줄이나 작성기준일 칸의 제출일 때문에 이듬해로 넘어간 경우에는, 연말 뒤 변동이 담보와 분모에 닿지 않는지 공시 원문과 사업보고서로 확인하고 연말 전 마지막 변동일을 상태일로 두었다. 12월 31일 당일의 임원 퇴임(특별관계 해소)은 대량보유 공시대로 그 날 그룹 밖으로 본다(사업보고서 주식소유 현황은 퇴임자를 연말 명단에 넣기도 한다). 이월 연도에는 그 보고서의 담보·보유·대출·금리 값을 그대로 옮기되 연말 보충으로 공시 원문에서 확인된 차이만 고치며, 1%에 못 미치는 담보의 설정·해지는 보고 없이 지나갈 수 있다. 대량보유 보고기준일은 장외 취득이면 계약체결일, 장외 처분이면 대금 수령일과 인도일 중 먼저인 날이고(자본시장법 시행령 제153조 제3항), 임원·주요주주 소유상황의 변동일은 장외 매수이면 대금 지급일과 인도일 중 먼저인 날이다(같은 시행령 제200조 제4항). 그래서 매수인의 대량보유보고서는 실제 이전보다 먼저 제출될 수 있으며, 이전일은 임원·주요주주 소유상황보고와 매도인의 처분 보고로 확인했다. 스냅샷 가운데 상태일이 작성기준일과 다른 것은 1,586개 기업-연도이다(대장 2.1-5). 1,369개는 기계 규칙으로 정했고(그 해의 기존 스냅샷과 같은 그룹이고, 장외 취득이 없고, 날짜가 서로 맞고, 공시 원문에 연말 뒤 날짜가 없는 경우), 217개는 공시 원문 판정으로 정했다(대장 2.1-6·2.1-7). 기계 규칙의 표본 30개를 독립 감사한 결과 26개가 맞았다. 틀린 3개는 약정일(12월)과 실제 질권 설정·해제일(이듬해 1~2월)이 다르고 실제 날짜가 비고에만 적힌 대출약정 변경 보고였으므로, 공시 원문에 연말 뒤 날짜가 있는 보고서는 모두 판정으로 돌렸다. 예컨대 한세엠케이의 2020년 스냅샷은 한세실업이 그룹 지주회사 한세예스24홀딩스에 2020년 12월 28일 시간외매매로 지분을 넘긴 뒤의 신규 보고서([20210104000440](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20210104000440), 작성기준일 2021년 1월 4일)이다. 에이디칩스는 골든에이지인베스트가 2015년 11월 17일 양수도 계약 뒤 11월 24일에 낸 보고서의 의결권 주식이 0주(인도청구권만 보유)이고 명의개서는 12월 28일이었으므로, 2015년 스냅샷은 명의개서를 반영한 이듬해 1월의 보고서([20160105000487](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20160105000487))이다. 사업보고서 「최대주주 및 특수관계인의 주식소유 현황」과도 패널 기업-연도 전부(대조 당시 29,001개)를 대조했으며, 98.4%에서 스냅샷 보고자가 표의 최대주주 본인이었고 나머지는 공시 원문으로 판정했다(§4.1). 같은 보고자가 같은 작성기준일로 낸 보고서가 둘 이상이면(사건이 다른 기재정정을 같은 날 낸 경우 등) 마지막 사건일(보고의무발생일과 「세부변동내역」 변동일 중 늦은 날)이 늦은 판을 그 날의 상태로 썼다. 예컨대 행남사는 2019년 1월 3일에 작성기준일이 2018년 12월 31일인 기재정정 두 건을 냈는데, 11월 22일 사건 판은 12월 17일에 사임한 임원의 주식을 그대로 품고 있다.\n\n[^snap]: 예를 들어 상태일이 2011년 12월 1일, 2012년 3월 1일, 2012년 11월 11일인 세 보고서가 있으면 2011년은 첫째, 2012년은 셋째 보고서이며, 둘째 보고서의 계약 변동은 셋째 보고서의 「나」 표에 반영된 것으로 본다. 연말 경계는 공시일이 아니라 상태일이므로 12월 28일의 시간외매매를 이듬해 1월 4일 작성기준일로 보고한 보고서는 전년도에 속한다. 세부 규칙: (i) 상태일이 같은 보고서가 둘 이상이면 표지 보유가 큰 쪽을, 그것도 같으면 접수번호가 큰(나중 접수) 쪽을 쓴다. (ii) 정정공시는 정정본으로 갈아타되 작성기준일은 원본 것을 유지하므로 이듬해에 정정돼도 연도 배정은 바뀌지 않는다. (iii) 표지 보유주식수가 0인데 살아있는 담보 행이 실린 보고서는, 같은 작성기준일에 다른 최대주주 그룹 보고서(승계 공시)가 있을 때만 대표보고자 교대의 형식적 0 으로 보아 건너뛰고 직전 보고서를 쓰며 `skipped_exit_report`에 남긴다. 승계 공시가 없으면 그 그룹이 실제로 떠난 것이므로 그 해부터 새 최대주주 보고서가 나올 때까지 기업-연도를 만들지 않는다. 표지 보유가 0이거나 공시 원문 판독으로 의결권 주식이 0주로 확정된 보고서는 살아있는 담보 행이 없어도 같은 규칙으로 그 그룹이 떠난 것으로 본다(잠재주식만 남은 그룹 포함). (iv) 대표보고자가 임원·주요주주라도 특별관계자에 최대주주가 있으면 최대주주 그룹 보고서로 후보에 들어가므로, 같은 그룹 안에서 대표보고자가 바뀐 해에는 `reporter_changed=1`이 최대주주 교체를 뜻하지 않을 수 있다.\n[^supp]: 연말 보충이 걸린 기업-연도는 933개이다. 끝난 날짜가 공시 원문에 없거나 원문으로 확정하지 못한 것(근거가 약하거나, 중복으로 검증한 판정이 서로 어긋나거나, 주식 단위가 불확실한 것)은 지금 값을 두었고, 대환은 새 계약이 그 해 자료에 있을 때만 옛 계약을 제외했다. 원천으로는 지분공시와 정기보고서 외에 담보를 준 법인의 감사보고서 주석, 정정 사슬의 연말 직전 판(거래소 전자공시에 남은 모든 판), 표본 조건 밖이라 판정하지 않았던 스냅샷 행, 담보신탁 수탁자가 낸 대량보유보고서의 신탁 잔고(위탁자 보고서가 주가에 따른 신탁 수량 증감을 적지 않은 경우)를 썼다. 새 보고서 없이 직전 보고서를 이월한 해와 그 보고서가 처음 쓰인 해에는, 담보를 제공한 법인(또는 돈을 빌려준 발행회사·계열사)의 그 해 감사보고서 주석으로 연말 상태를 따로 확인해 담보가 해지되었거나 그 대출 잔액이 0이거나 수량이 줄었으면 그만큼 제외했다. 감사보고서에 공시보다 많은 담보가 있어도 더하지 않았고, 대주만 바뀌어 같은 주식이 새 대출의 담보로 이어진 경우는 제외하지 않았다.\n\n    | 보충 | 경우 | 예 |\n    |---|---|---|\n    | 더함 | 개정 전 서식이 그 보고서의 새 계약만 적어 빠진 존속 계약 | STX엔진 2018년 스냅샷: 사모펀드 인수금융의 보유 전량 근질권이 2018~2022년 내내 빠져 있었다 |\n    | 더함 | 늦게 처음 보고된 계약, 스냅샷 뒤 연말 전에 맺은 계약, 거래소 공시에만 있는 질권 | |\n    | 더함 | 표본의 주식 종류 조건 밖이라 판정하지 않았던 담보 | 외국 기업의 증권예탁증권 담보(그 기업은 「1.가」 보유와 분모도 증권예탁증권 단위: 엑세스바이오 2014~2018년, JTC 2025년 인수금융 근질권 등) · 보통주 담보를 주식 종류 「기타」로 적은 보고서(에코프로 2012~2013년) |\n    | 더함 | 「나」에는 매매·의결권 위임만 적고 담보 주식 수와 대출은 「다」에만 적은 보고서 | 아스트 2022년 |\n    | 더함 | 「나」에 적지 않은 그룹 구성원의 주식이 연말 직후 반대매매됨(연말 보유만큼) | 한국테크놀로지 2022년 데이원홀딩스 |\n    | 바꿈 | 같은 계약의 연말 수량 차이 | |\n    | 제외 | 스냅샷 행 가운데 연말 전에 끝난 계약 | 엑스큐어: 2020년 11월 26일의 담보 전량 해제를 거래소 공시에만 내고 대량보유보고서는 4년 뒤에야 내 2020~2023년 연말에 끝난 담보가 남아 있었다 |\n    | 제외 | 세부변동내역의 담보 주식 반대매매·질권자 임의처분(그 날짜로) | 한국테크놀로지 2022년, 아미노로직스 2012년 |\n\n    연말 보충은 계약 행이 아니므로 계약 단위 자료에는 나타나지 않는다.\n\n[^exit]: 제외한 기업-연도는 838개이지만 퇴장 사건으로는 181개 종목(퇴장 보고서·퇴장일 187건)이다. 새 최대주주 보고서가 끝내 나오지 않으면 퇴장 뒤 2025년까지의 연도가 모두 여기에 들어가기 때문이다(종목당 평균 4.7년, 대장 2.2-8).\n\n    | 퇴장의 종류 | 건 |\n    |---|---:|\n    | 보유 0 보고서로 떠났는데 승계인을 찾지 못함 | 78 |\n    | 지분을 줄이며 발행회사와의 관계를 최대주주가 아닌 것으로 바꿈(회사 기재와 지분율로 확인) | 47 |\n    | 사업보고서 「최대주주 및 특수관계인의 주식소유 현황」 대조로 연말 전 지위 상실이 확인되었는데 새 최대주주의 그 해 보고서가 없음(§4.1) | 50 |\n    | 연말 소유 기준(§2.1)으로 그 그룹의 의결권 주식이 0주가 되었거나 연말 전에 다른 주주가 실제로 더 많이 소유하게 됨 | 11 |\n\n    | 제외한 기업-연도의 그 해 상태 | 기업-연도 | 종목 | 근거 |\n    |---|---:|---:|---|\n    | 상장폐지 뒤 | 482 | 76 | 대장 2.2-10 |\n    | 벤더 시장 자료에 없거나 상장된 적 없음 | 165 | | 대장 2.2-11 |\n    | 그해 연말 스팩(기업인수목적회사) | 27 | 19 | 대장 2.2-22 |\n    | 상장 유지(확장 패널의 `gap`, §3.2) | 164 | 99 | 대장 2.2-9 |\n\n    앞의 세 줄(674개)은 그해 연말에 유가증권·코스닥 상장 일반기업이 아니어서 〈표 1〉 (1)·(2)에서도 제외되었을 해이다. 상장폐지 뒤 482개 가운데 43개 종목은 퇴장 보고서의 작성기준일이 상장폐지된 해이거나 그 뒤이다. 상장이 유지된 162개 가운데 57개 종목은 뒤에 새 최대주주 그룹의 보고서가 나왔고(56개는 2년 안) 40개 종목은 2025년까지 없었다.\n\n    | 새 최대주주 보고서가 없는 이유 | 예 |\n    |---|---|\n    | 새 최대주주의 지분이 5% 미만이라 보고 의무가 없음 | 미래산업 2012~2019년(벤더 연말 최대주주 포비스티앤씨 3.69%) |\n    | 가장 큰 주주가 기관투자자라 최대주주로 적은 보고서가 없음 | 한솔케미칼: 조동혁 그룹이 2025년 8월 지분 일부를 판 보고서 [20250825000185](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20250825000185) 뒤 연말 최대주주가 국민연금공단 13.1% |\n    | 새 지배주주가 2011년 이전에 보고한 뒤 지분 변동이 없어 수집 범위에 보고서가 없음 | 태영건설: 2011~2019년에 기관의 약식 보고만 있고 윤석민 측 보고서는 2020년 2월에 처음 나온다 |\n\n[^t1]: 상장 여부와 시장 구분은 FnGuide DataGuide의 결산일 기준 「상장된 시장」 자료로 판별하였다. 다만 결산일 뒤 그해 12월 31일 전에 상장폐지된 기업-연도는 KRX 상장폐지종목 현황으로 확인해 연말 비상장으로 보았다(6월 결산 저축은행 다섯 곳의 2011·2012년, 신성통상 2025년, 동양밸류스팩 2012년, 7개). 출발점 35,359개(승계 없는 퇴장 뒤 최대주주 보고서가 없는 기업-연도는 이미 제외한 수)에서 (i) 3,391개(그중 직전 보고서 이월 3,176개), (ii) 3,005개(코넥스 2,208, 스팩 512, 리츠 202, 선박투자회사 57, 인프라펀드 16, 해외자원개발펀드 10), (iii) 330개를 제외했다(대장 2.2-4·2.2-5·2.2-12·2.2-19·2.2-14·2.2-1). (i)은 대부분 상장폐지 뒤에도 마지막 보고서가 이월되는 연도이다. 예컨대 한진해운은 2017년 상장폐지된 뒤 새 보고서가 없어 2016년 10월 보고서([20161011000365](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20161011000365))가 2017~2025년에 이월되지만, 그 9개 기업-연도는 연말에 상장 종목이 아니므로 제외했다. (ii)의 코넥스 2,208개는 그해 연말 코넥스에 상장되어 있던 기업-연도 293개와, 코넥스에만 상장했던 225개 종목의 기업-연도 1,915개이다(대장 2.2-7·2.2-13). 뒤의 것과 리츠 등 37개 종목(285개)은 벤더의 시점별 시장 자료에 종목코드가 없다. 벤더 자료에는 코넥스에만 상장했던 종목도, 리츠·인프라펀드·선박투자회사 같은 투자회사형 종목도 하나도 없기 때문이다. 그래서 이들은 스냅샷 보고서 발행회사 절의 법인구분(보고 시점 값)과 종목명으로 성격을 가렸다. 코넥스 종목 1,915개 가운데 1,914개가 「코넥스상장법인」의 보고서이고, 리츠 등 285개는 모두 「유가증권상장법인」의 보고서이다. 코넥스 종목 225개 가운데 110개는 지금 비상장이라 그 1,036개 기업-연도에는 코넥스에서 상장폐지된 뒤 이월된 연도가 섞여 있다(758개가 보고서 없이 이월된 연도). 일반기업이 아닌 종목의 예로, 에이리츠의 2011~2025년 15개 기업-연도를 모두 제외했다([20181120000156](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20181120000156) 등). 스팩 512개는 247개 종목이 KIND 「상장종목현황」에서 그해 12월 31일 증권구분이 기업인수목적회사인 기업-연도이며, 그중 158개는 연말 최신 보고서가 약식이라 (3)에도 해당한다(대장 2.2-19·2.2-20). 스팩은 공모 자금을 신탁해 두고 합병 대상을 찾는 명목회사라 일반기업과 같은 모집단에 두지 않았고, 스팩 기업-연도에는 살아있는 담보가 하나도 없었다. 벤더 시장 자료에는 코스닥 종목으로 실려 있어 회사명이 아니라 거래소의 증권구분으로 가렸다. 지금 회사명은 존속합병 뒤의 이름이라 스팩 시절을 놓치고, 보고서의 발행회사명은 합병하는 해에 대상 회사 최대주주가 낸 보고서에도 스팩 이름으로 남아 있기 때문이다. 같은 종목코드로 이어지는 합병 뒤 연도는 표본에 남겼다. 거래소는 합병 신주가 상장될 때 증권구분을 바꾸므로, 합병기일이 그해 안이라 일반기업 연도로 둔 2개(알서포트 2013년, 합병기일 2013년 12월 18일 · 엑스플러스 2021년, 같은 해 12월 30일)는 연말 목록에 스팩으로 남아 있어도 표본에 넣었다(대장 2.2-21). 12월 결산이 아닌 스팩은 결산일의 증권구분도 보았다(동양밸류스팩 2012년, 6월 결산). 시장 구분은 회계연도 결산일 기준이라 12월 결산이 아닌 45개 기업(418개 기업-연도)은 12월 31일과 몇 달 어긋날 수 있다. 코넥스는 그해 연말에 코넥스에 상장되어 있던 기업-연도만 제외하므로, 한중엔시에스는 코넥스 시절인 2013~2023년 11개 기업-연도를 제외하고([20180601000091](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20180601000091) 등) 코스닥으로 옮긴 2024년부터 표본에 넣었다.\n\n[^yak]: 2020년 2월 신설된 일반투자 목적의 약식은 예외로 대개 계약 절을 두며, 계약 절이 있는 약식은 일반 보고서와 같이 썼다. 약식 보고서가 최대주주를 잘못 표기한 경우는 회사의 사업보고서와 벤더 자료로 가려, 실제 최대주주 그룹이 앞서 낸 일반 보고서를 스냅샷으로 썼다. 법률(제147조 제1항 후단)은 보유 목적이 경영권에 영향을 주기 위한 것이 아닌 경우와 일부 전문투자자에 대해 보고 내용과 시기를 시행령으로 달리 정할 수 있게 할 뿐 「약식」이라는 말은 쓰지 않는다. 시행령 제154조(대량보유 등의 보고에 대한 특례)도 목적별 보고 사항과 기한만 정하고(단순투자 목적은 변동이 있던 달의 다음 달 10일까지, 단순투자 목적이 아닌 경우는 10일 이내), 서식은 금융위원회가 정한다(제153조 제6항). 약식 서식의 표지는 그 대상을 「제147조에 의한 보고 중 '경영권에 영향을 주기 위한 목적'이 아닌 경우」로 적고, 2020년 2월 서식부터 「및 보고자가 동조 제1항 후단에 따른 전문투자자인 경우」를 덧붙였다. 같은 달 보유 목적에 일반투자가 신설되면서 약식 서식에 「제4부 단순투자 목적이 아닌 경우 추가 보고내용」이 붙었고, 일반투자 목적의 약식은 여기에 보유주식등에 관한 계약을 적는다. 시행령이 단순투자 목적이 아닌 경우의 보고 사항에 「보유 주식등에 관한 주요계약내용」을 넣고(제154조 제3항 제2호 다목) 단순투자 목적의 보고 사항에는 넣지 않았기 때문이다(같은 항 제1호). 약식 52,789건 가운데 2020년 1월까지 접수된 31,338건에는 계약 절이 하나도 없다. 계약 절이 있는 약식 1,704건은 모두 2020년 2월 이후 접수분으로(첫 접수 2020년 2월 3일), 일반투자 목적 약식 1,285건 가운데 1,252건과 단순투자 목적 약식 20,126건 가운데 433건 등이다. 일반투자 목적 약식의 대표적인 보고자는 국민연금공단이다(869건). 예컨대 국민연금공단은 2020년 2월 7일 현대자동차 등 56개 회사에 대해 보유 목적을 일반투자로 적은 약식 보고서를 냈고, 그 제4부에 계약 여부를 「없음」으로 적었다. 이런 약식에는 주식담보 계약도 실제로 기재되며, 연말 스냅샷이 된 27개 기업-연도(그중 22개가 국민연금)는 모두 계약 없음(「-」)을 적어 담보가 없다는 사실이 관측된 경우이다(대장 2.2-3). 국민연금 22개는 보고서의 관계 칸이 「주주」이지만 회사가 사업보고서 「최대주주 변동현황」에 국민연금을 최대주주로 적은 지배주주 없는 분산 소유 기업(신한지주·하나금융지주·케이티 등 7개사)이며, 패널에 `snapshot_reporter_type`이 재무적 투자자(`financial_investor`)로 표시되어 있다. 최대주주 표기가 틀린 약식은 그 연말에 회사가 사업보고서 「최대주주 변동현황」에 적은 최대주주와 벤더의 연말 대표주주가 이전 일반 보고서를 낸 그룹을 가리키고, 약식 제출인을 최대주주로 가리키는 원천이 없는 경우로 한정하였다. 두 원천에 모두 기록이 있으면 둘이 같은 그룹을 가리켜야 했고, 한쪽에만 기록이 있으면 그 원천과 같은 작성기준일의 보고서를 함께 보았다. 사업보고서 「최대주주 및 특수관계인의 주식소유 현황」 대조(§4.1)에서 공시 원문으로 약식 제출인이 연말 최대주주가 아니고 앞 일반 보고서의 그룹이 연말 최대주주임을 확인한 기업-연도도 더하였다. 42개 기업-연도(25개 기업)가 이에 해당하며 그 일반 보고서를 스냅샷으로 썼고(표기가 틀린 약식은 27건, 대장 2.2-2), 두 원천이 어긋나면 제외하였다. 예컨대 메리츠금융지주 2020~2021년은 KB자산운용이 약식 보고서([20201202000100](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201202000100)) 표지에 자신을 최대주주로 적었으나, 회사 기재(「조정호 외 4인」)와 벤더(조정호 72%)가 모두 조정호를 가리켜 조정호의 2020년 3월 일반 보고서([20200313001119](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20200313001119))를 스냅샷으로 썼다. 제외한 330개는 2020년 2월 개정 전 서식의 약식 284개, 단순투자 목적 약식 45개, 계약 절을 빠뜨린 일반투자 목적 약식 1개(POSCO홀딩스 2021년, 국민연금공단)이고, 계약 절이 있어 남긴 약식 27개는 일반투자 목적 25개와 단순투자 목적 2개이다. 보유 목적으로 가르면(단순투자면 제외) 이 가운데 3개만 달라지는데, 계약 절이 없는 1개를 남기고 계약 없음을 적은 2개를 버리게 된다. 제외한 330개 기업-연도는 모두 남겨 두었다면 담보가 없는 것으로 집계되었을 기업-연도였다(대장 2.2-1).\n\n[^rowfunnel]: 조건을 차례로 적용했을 때 남는 누적 행 수이다. ③의 확장 단계는 배제가 아니라 편입이라 행 수가 늘어난다.\n\n    | 단계 | 행 | 보고서 | 종목 |\n    |---|---:|---:|---:|\n    | 「나」 전체 | 449,986 | 90,797 | 3,471 |\n    | 대상 보고서(최대주주 그룹, 최종 정정본) | 384,046 | 78,382 | 3,329 |\n    | ① | 336,308 | 50,914 | 2,188 |\n    | ② | 336,245 | 50,867 | 2,183 |\n    | ③ 중 담보성 어휘 | 296,338 | 45,631 | 1,770 |\n    | ④ | 290,693 | 45,396 | 1,770 |\n    | ③ 중 공시 원문 판정·판별로 확인된 담보 편입(대여·대차·신탁·어휘 밖 질권·환매조건부 매도·차입 담보) | 293,123 | 45,512 | 1,775 |\n    | ⑤ 납세담보·공탁 분리 | 282,012 | 44,894 | 1,733 |\n\n[^nonvote]: 비의결권 증권을 담보로 한 행이 있는 기업-연도는 203개이고, 그중 53개는 의결권 있는 주식 담보가 없어 $PLEDGE=0$이다(대장 2.3-26·2.3-27). 담보로 쓰인 비의결권 증권은 전환사채권이 가장 많고 신주인수권부사채권·보통주로 전환될 우선주가 뒤를 잇는다. 증권예탁증권은 그 기업의 보유와 분모도 같은 단위라 연말 보충으로 분자에 넣었다([^supp]). 예컨대 CJ의 2022년 스냅샷([20220204000465](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20220204000465))에서 이경후·이선호는 보통주로 전환될 신형우선주를 한국증권금융·하이투자증권에 담보로 제공했고(보통주 담보도 있어 $PLEDGE=1$), 금호전기의 2021년 스냅샷([20211229000653](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20211229000653))에서 최대주주 측 담보는 전환사채권 1,459,854주뿐이어서 $PLEDGE=0$이다.\n\n[^trust]: 「신탁」으로만 적은 최대주주 그룹 행에는 처분신탁, 교환사채 교환대상 예탁, 가족·명의·투자신탁과 함께 채무를 담보하는 담보신탁이 섞여 있다(담보비율에 따라 신탁 주식이 늘고 줄거나, 차입금을 갚으면 신탁이 풀리는 계약). 마진콜 대상이 될 수 있는 담보신탁은 질권과 경제적으로 같으므로, 금전 채무를 담보하는 것으로 공시 원문 판정에서 확인된 행을 포함하였다. 「신탁」으로 적어 표본 조건 밖에 있던 최대주주 그룹 「나」 행은 785개(38개 종목)이다(대장 2.3-29).\n[^repo]: 환매조건부 매도(repo)는 매도인이 주식을 상대방에게 넘기고 대금을 받은 뒤 정해진 날 되사는 계약이다. 주가가 내리면 주식을 더 넘기는 조항이 붙는 경우가 많아 질권처럼 마진콜 구조를 가진다. 계약종류 때문에 표본 조건 밖에 있던 최대주주 그룹의 환매조건부 매도 「나」 행은 1,735개(27개 종목, 2020년 이후)이고 상대방은 대부분 에쿼티스퍼스트홀딩스이다(대장 2.3-50). 매도인과 매수인이 모두 같은 그룹인 거래 49행은 주식이 그룹 밖으로 나가지 않으므로 넣지 않았다. 연말 스냅샷의 환매조건부 매도 행 174개는 공시 원문·임원 보고·사업보고서로 작성기준일 현재 유효한지 판정하였고, 계약만 맺고 실행하지 않은 거래 등 5행을 종료로 보았다(대장 2.3-52·2.3-53). 매도인은 넘긴 주식을 대개 「1.나」 제2호(인도청구권)로 「1.가」에 계속 적으므로 분모에 이미 들어 있었고, 앞서 공시 원문으로 정한 분모가 이 주식을 제외했던 8개 기업-연도만 다시 더했다. 대금은 「다」의 대출금액이 아니라 「나」의 비고·각주에 적히므로, 담보가 환매조건부 매도뿐인 기업-연도는 대출금액이 비어 있고(`loan_na_reason=repo_no_da`) 다른 담보와 섞인 기업-연도의 대출금액에는 그 대금이 빠져 있다(그 담보 몫은 `collateral_types`의 `repo`).\n\n[^ctype]: 주 담보 가운데 전통적 주식담보대출이 아닌 담보제공계약의 유형이다(`collateral_types`). 기업-연도 수는 그 유형의 몫이 있는 기업-연도이고, 「그 유형뿐」은 담보 전부가 그 유형인 기업-연도이다. 한 계약이 여러 유형일 수 있어(예: 상대방이 그룹 안이면서 사채 담보) 유형별 수를 더하면 비전형 담보 기업-연도 1,025개보다 많다. 우리사주 취득자금 대출·인수금융·외화 대출은 담보 구조가 같아 전통 유형으로 두었다.\n\n    | 유형 | 내용 | 기업-연도 | 그 유형뿐 |\n    |---|---|---:|---:|\n    | `third_party` | 남의 빚 물상보증: 실제 채무자가 담보제공자가 아니고 그룹 밖 회사·현지법인·발행회사이거나 확인되지 않음 | 506 | 104 |\n    | `group_debt` | 그룹 안 다른 구성원(계열 법인·가족)의 빚 담보 | 216 | 35 |\n    | `intragroup` | 상대방(질권자)이 같은 그룹(그 공시의 보고자·특별관계자·담보제공자이거나 「특수관계인」으로 적힘) | 152 | 58 |\n    | `bond` | 사채(전환사채·교환사채 등) 원리금 담보 | 133 | 20 |\n    | `issuer` | 상대방이 발행회사 자신(주로 회사가 최대주주·임원에게 빌려준 돈의 담보) | 67 | 20 |\n    | `repo` | 환매조건부 매도([^repo]) | 59 | 25 |\n    | `trust` | 금전 채무를 담보하는 담보신탁([^trust]) | 19 | 1 |\n    | `trade` | 상거래 채무(매입채무·임대차보증금·미수금 등) 담보 | 17 | 10 |\n    | `deriv` | 파생 거래(TRS·주식스와프 등) 정산 담보 | 11 | 0 |\n    | `transfer` | 대여·대차 형식으로 채권자에게 넘긴 담보 | 11 | 0 |\n    | `lend_pledge` | 그룹 밖에 빌려준 주식을 차입자가 담보로 맡김(대여자 행이 유일한 기록) | 5 | 0 |\n    | `tax` | 주 담보 계약에 납세담보가 함께 걸림([^taxmix]) | 3 | 0 |\n\n    환매조건부 매도·담보신탁·대여 형식·대차 뒤 담보는 표본에 넣을 때의 공시 원문 판정으로, 그룹 안·발행회사 상대방은 그 공시 안의 이름으로 붙였다. 「그룹 안」을 감사보고서의 특수관계자로 넓히지 않았으므로 명단에 없는 계열사에 맡긴 담보는 빠져 있다. 물상보증·그룹 안 채무·사채·파생·상거래 채무는 계약종류·비고·「다」 채무자 칸에 단서가 있는 계약을 공시 원문(앞뒤 공시, 사업·감사보고서 포함)으로 판정해 붙였고, 「다」 채무자 칸만 보지 않았다(대주나 본인 이름을 채무자 칸에 잘못 적은 보고서가 많다). 단서가 없는 계약은 전통 유형으로 남으므로 이 유형들은 하한이다. 주 담보 밖의 처분 제한(`restricted_other_shares`)은 납세담보·공탁과, 조건이 생겨야 돈을 내는 의무(손실 보전·풋옵션 대금·위약벌·계약금 반환 등)나 금전이 아닌 의무(주식 인도·동반매각 등)를 담보한 질권이다. 뒤의 둘은 마진콜 구조가 아니어서 주 담보에서 제외했고([^oblig]), 연말에 살아 있었는지를 공시 원문으로 판정해 주식수를 넣었다.\n\n    | 판정 | 행 | 근거 |\n    |---|---:|---|\n    | 금전 채무를 담보하는 담보신탁: 표본에 넣음 | 341 (8개 종목) | 대장 2.3-30 |\n    | 교환사채 교환대상 예탁 | 118 | 대장 2.3-31 |\n    | 투자·특정금전신탁 | 85 | 대장 2.3-32 |\n    | 가족·증여 신탁 | 73 | 대장 2.3-33 |\n    | 수탁자·특수목적회사 쪽에서 같은 주식을 다시 적은 행 | 49 | 대장 2.3-34 |\n    | 처분신탁(상속세 납부용 매각 등) | 36 | 대장 2.3-35 |\n    | 금전이 아닌 의무를 담보하는 신탁 | 17 | 대장 2.3-36 |\n    | 명의신탁 | 9 | 대장 2.3-37 |\n    | 그 밖의 신탁(해지 기록 0주 행 등) | 57 | 대장 2.3-38 |\n\n    | 사례 | 판정 | 근거 |\n    |---|---|---|\n    | 엘브이엠씨홀딩스(옛 코라오홀딩스) 오세영의 흥국생명 신탁(2012~2019년) | 담보신탁 | 흥국생명 자신의 대량보유보고서의 보유목적이 「담보목적 유가증권신탁」 |\n    | 현대상선이 현대증권 주식을 한국씨티은행·대우증권·한국투자증권에 신탁(2014~2015년) | 담보신탁 | HMM 사업보고서 주석의 「신탁담보」 |\n    | 이월드 2016년 「담보 비율 유지를 위한 추가 신탁」 | 담보신탁 | 차입금 담보 |\n    | 이월드 2019~2021년 신탁 | 넣지 않음 | 전환사채·상환전환우선주 투자자의 동반매각청구권을 담보(금전 채무가 아님) |\n    | 삼성전자 최대주주 일가의 「유가증권처분신탁」 | 넣지 않음 | 신탁 주식 전량이 매번 시간외대량매도로 팔린 매각 목적 |\n\n[^oblig]: 갚을 금액이 주가에 연동된 자금 조달(총수익스와프·주식스와프)을 담보하는 질권도 금전 채무 담보로 셌다. 반면 주식 인도·동반매각처럼 금전이 아닌 의무나, 풋옵션 행사·계약 위반처럼 조건이 생겨야 빚이 되는 의무만 담보하는 질권은 실제로 설정되었더라도 제외했다. 대출이 아닌 의무를 시사하는 낱말(주주간계약·동반매도·매도청구·풋옵션·이행담보·확약 등)이 걸린 존속 질권 1,211행(78개 종목)을 공시 원문으로 판정했다(대장 2.3-39). 금전 채무와 금전이 아닌 의무를 함께 담보하는 질권은 담보로 두었다.\n\n    | 담보하는 의무 | 행 | 판정 | 예 |\n    |---|---:|---|---|\n    | 지금 갚을 금전 채무(대출·사채·매입채무·대출 보증)나 갚을 금액이 주가에 연동된 총수익스와프(TRS)·주식스와프 | 1,071 | 담보 | 총수익스와프·주식스와프가 비고에 드러난 것은 HMM 2011~2014년(현대엘리베이터가 현대상선 주식을 기초자산으로 맺은 파생상품 계약의 이행 담보)과 케이비증권 2012~2013년(현대상선이 현대증권 우선주를 기초자산으로 맺은 파생상품 계약의 담보)으로, 패널 담보 기업-연도의 0.1%에 못 미친다 |\n    | 금전이 아닌 의무(주식 인도·동반매각·경영권 이전·용역 이행) | 23 (5개 종목) | 제외, 대장 2.3-40 | 엠로 창업자 송재민의 삼성에스디에스 앞 근질권(주주간계약의 콜옵션·처분제한·동반매각 의무) · 칩스앤미디어 주주의 한투반도체투자 앞 질권(동반매각 협력의무, 「별도의 대출은 진행되지 않았습니다」) |\n    | 조건이 생겨야 빚이 되는 의무 | 115 (12개 종목) | 제외, 대장 2.3-43 | 투자자 풋옵션 행사 때 매수대금(KG이니시스·코스모화학·엠에스오토텍 등) · 주식매매계약상 손해배상(지누스 최대주주의 현대백화점 앞 근질권) · 주주간계약 위반 때 상대방 주식 매수대금(유일로보틱스 창업자의 SK Battery America 앞 근질권) · 거래가 깨지면 돌려줄 계약금 · 계약 이행보증 |\n    | 원천으로 정할 수 없음 | 2 | 지금 값(담보) 유지 | |\n\n    주 담보 기준을 본문의 한 문장으로 정리하면서 두 가지를 다시 보았다(대장 2.3-55). 보증기관 이행보증서(선급금 반환·계약 이행 보증)를 받으려고 낸 질권은 보증 대상이 조건이 생겨야 빚이 되는 의무이므로 조선사 선수금 환급보증 담보와 같이 제외했다(금화피에스시 2024·2025년 [20241031000392](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241031000392), 대장 2.3-56). 또 조건부 의무로 제외한 투자자 회수 보장 담보(풋옵션 매수대금·손실 보전) 14건을 의무자·회계처리로 다시 보았다(대장 2.3-57). 질권이 담보하는 그 의무를 채무자가 차입금으로 적은 경우는 없었고, 피담보 채무가 실은 사채 원리금으로 확인된 것만 담보로 되돌렸다(1건, 대장 2.3-58). DH오토리드 2019~2021년은 담보를 준 대유에이텍의 사업보고서가 그 질권을 제16회 사모 전환사채의 담보로 적었다([20191230000507](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20191230000507)). 나머지 13건은 의무자가 개인이거나 옵션 공정가치·약정 주석만 있어 그대로 두었다(대장 2.3-59). 투자금이 자회사의 전환사채·전환우선주로 들어와 연결 차입금에 잡힌 경우도 질권이 담보하는 것은 지배주주 측의 풋옵션(파생상품부채로 계상)이어서 그대로 두었다(엠에스오토텍 2019·2020년, [20190312000918](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20190312000918)).\n\n[^f5gap]: 계약종류 칸이 담보 어휘 밖이어도(「약식질」, 질권을 붙인 「여신거래약정」, 계약종류 칸에 대출금액·대주 이름을 잘못 적은 행 등) 비고나 「다」로 질권이 확인되면 포함하였다. 계약종류 칸이 표본 어휘 밖이지만 비고에 질권·담보가 적혔거나 「다」에 연결된 최대주주 그룹 「나」 행, 곧 어휘 밖 질권 후보 137행(21개 종목, 처음 판정에서 빠졌던 같은 계약 1행 포함)을 그 보고서의 「나」·「다」·각주와 앞뒤 보고서로 판정했다(대장 2.3-44).\n\n    | 판정 | 행 | 근거 |\n    |---|---:|---|\n    | 질권으로 확인: 표본에 넣음 | 100 (17개 종목) | 대장 2.3-45 |\n    | 같은 주식의 다른 순위 질권으로 이미 집계 | 6 | 대장 2.3-46 |\n    | 담보가 아님(대물변제·매각제한 약정·그룹을 떠난 사람·해지 기록·조건부 의무) | 31 | 대장 2.3-47 |\n\n    | 넣은 질권의 예 | 수량 | 근거 |\n    |---|---:|---|\n    | 아나패스 최대주주의 2024년 증권사 약식질 3건 | 739,441주 | 대장 2.3-48 |\n    | 웅진이 웅진씽크빅 주식에 설정한 OK캐피탈 질권(「나」 주식 수 칸은 보유 전체) | 각주의 실제 담보 20,037,534주 | 대장 2.3-49 |\n    | 계약종류 칸에 대출금액을 적은 케이프 2011년 주주들의 질권 | | |\n\n[^lend]: 「다」에 연결된 대여·대차는 담보로 보았다. 2020년 7월 서식 개정 전에는 「다」 자체가 없었고, 개정 후에도 보고자가 담보계약을 「다」에 적지 않거나 합계로 기재하여 개별 행과 연결되지 않는 경우가 있었다. 「다」에 연결되지 않은 대여·대차는 대부분 일반적인 증권 대차거래이거나 보고자 측이 주식을 빌린 계약이므로, 공시 원문에서 담보로 확인된 행만 추가로 포함하였다. 여기에는 대여·대차 형식으로 채권자에게 넘긴 주식담보와 대차후담보가 포함된다.\n\n    **대차후담보**는 보고자 그룹(대여자)이 주식을 빌려주고, 그 주식을 빌린 사람(차입자)이 자기 대출의 담보로 금융기관(대주)에 맡긴 경우이다. 빌려준 주식은 대여자의 보고서에 대여 계약으로만 적히지만 실제로는 대주의 담보로 묶여 있으므로, 차입자가 최대주주 그룹 밖이면 대여자 행이 그 담보의 유일한 기록이 된다.\n\n    「다」에 연결되지 않은 대여·대차 행을 처음 전수 검증했을 때 97.3%가 증권 대차거래였으나, 그 검증은 주로 「다」의 연번 체계에 기댄 것이라 「다」가 없는 서식이나 「다」에 적지 않은 계약은 가리지 못했다. 그래서 개정 전 서식의 대여·대차 1,026행(57종목)과 개정 후 서식에서 「다」에 연결되지 않은 대여·대차 양수 1,726행(51종목)을 공시 원문으로 다시 보았다(대장 2.3-13·2.3-20). 개정 전과 후는 접수일이 아니라 그 보고서 공시 원문에 「다」 절이 있는지로 갈랐으므로, 2020년 7월 뒤에 접수됐지만 옛 서식으로 낸 3개 보고서의 25행은 개정 전에 들어 있다. 판정할 때는 같은 보고서의 각주·보고사유·변동사유·세부변동내역, 앞뒤 보고서와 임원·주요주주 소유상황보고서, 정기보고서를 함께 보았다. 판정의 기본값은 증권 대차거래이며, 담보라는 근거를 공시 원문(행의 비고·각주·보고사유·세부변동내역·정기보고서의 문장)에서 인용할 수 있을 때만 주식담보나 대차후담보로 판정하였다. 대차를 담보로 잘못 넣으면 담보가 부풀려지기 때문이다. 개정 후 서식에서는 그 보고서의 「다」도 직접 보아, 보고자가 「다」에 다른 계약만 적었으면 이 계약을 스스로 담보로 분류하지 않은 것으로 보고 명시적 공시 원문이 있을 때만 담보로 뒤집었다. 판정 결과는 다음과 같고, 개정 후 서식에서는 「다」 연결 규칙이 대체로 맞았다.\n\n    | 판정 | 개정 전 서식 | 개정 후 서식 |\n    |---|---:|---:|\n    | 증권 대차거래(교환사채·전환사채 헤지, 공매도, 대차풀, 친인척 간 무상대차 등) | 372 | 888 |\n    | 보고자 측이 주식을 빌린 쪽 | 234 | 482 |\n    | 대여·대차 형식으로 채권자에게 넘긴 주식담보 | 116 | 137 |\n    | 빌려준 주식을 차입자가 자기 대출의 담보로 제공(대차후담보) | 304 | 219 |\n    | 판별 불가 | - | - |\n    | 합 | 1,026 | 1,726 |\n    | 표본에 넣은 행 | 159 (7종목) | 140 |\n\n    표본에 넣은 행의 근거는 대장 2.3-19·2.3-25이다. 개정 전은 주식담보 116행 가운데 근거가 약하거나 같은 주식의 다른 담보 행과 겹치는 2행을 제외한 114행과, 대차후담보 가운데 차입자가 그룹 밖이라 대여자 행이 그 담보의 유일한 기록인 45행이다. 차입자가 특별관계자이면 그 담보가 같은 보고서에 차입자 명의 행으로 따로 실려 이미 집계되므로(255행) 대여자 행을 다시 넣지 않았고, 가족의 납세담보로 쓰인 것으로 보이는 4행은 ⑤의 원칙에 따라 주 담보에서 제외했다. 담보일 수 있는 정황만 있고 공시 원문 문구가 없는 행은 기본값대로 증권 대차거래로 두어 넣지 않았다. 대여자가 법인이면 그 법인의 감사보고서 차입금·담보 주석도 공시 원문으로 보았다. 제낙스의 무평산업이 「기타개인」에게 빌려준 주식은 대차 목적이 적혀 있지 않아 처음에는 대차거래로 두었으나, 무평산업의 2018년 감사보고서([20190402000366](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20190402000366))가 「매도가능증권(지분증권) 1,018,600주가 차입금에 대한 담보로 제공」되었고 「대주주 차입금을 제외한 모든 차입금에 대하여」 담보를 제공했다고 적고 있고, 이 수량은 그 해 말 보고서([20181220000380](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20181220000380))의 무평산업 대여·담보 행의 합과 같다. 개인 대주 5명의 차입금이 그 해에 새로 생겼으므로 개인 사채의 담보로 보아 58행을 주식담보로 바로잡았고, 그중 2017년 4월 계약 5행은 2017년 감사보고서가 밝힌 신상용 차입금 담보 몫(72,000주)으로 수량을 고쳤다. 엔케이맥스의 친족 간 대여 18행은 코스닥 급락일 등 주가 급락기에 이루어졌고 빌린 친족이 주식담보대출을 쓰고 있었지만, 빌린 주식을 담보로 넣었다는 기재나 수량 근거가 없다. 개정 후는 보고자가 사채형 담보나 「다」 전체를 적지 않은 6개 종목 130행과, 「다」에는 적혔으나 채무자별 합계로 적혀 행 연결이 누락된 2개 종목 11행에서 담보 수량이 확정되지 않는 1행을 제외한 것이다. 대표 사례는 다음과 같다.\n\n    | 유형 | 사례 | 공시 원문 근거 |\n    |---|---|---|\n    | ① 대여 형식의 사채 담보 | 케어랩스: 최대주주 측 데일리블록체인이 「주식대차거래」로 적은 주식([20191205000391](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20191205000391)) | 사채를 갚을 때 제3부와 정기보고서에 「차입금 상환에 따른 수령」으로 돌아온다 |\n    | ② 대차후담보 | 한국테크놀로지: 에이치티파트너스가 김용석에게 빌려준 400,000주([20140314000846](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20140314000846)) | 비고와 각주에 김용석이 그 주식을 드림저축은행 주식담보대출(2억 8천만원)의 담보로 제공했다고 적혀 있고, 김용석은 그룹 밖이라 이 행이 그 담보의 유일한 기록이다 |\n    | ③ 「다」에 적지 않은 담보 | 시스네오텍: 시너웍스가 개인들과 맺은 「대차거래」([20201202000318](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201202000318)) | 같은 보고서의 취득자금 항목에 「차입처 삼성증권 외 2인 · 주식등의 담보제공 여부 예」로 적혀 있고, 뒤 보고서 각주가 「본인의 금융기관 차입을 위해 각 개인들에게 주식대여」라고 밝힌다 |\n    | ④ 「다」의 합계 행 | 코미팜: 황부연의 「대차보증」 200,000주([20231220000526](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20231220000526)) 등 | 「다」에 채무자별 합계 한 줄로만 적혀, 행 연결 규칙이 놓친 담보이다 |\n\n[^side]: 보고자 그룹이 담보를 받은 쪽이거나 작성기준일에 아직 설정되지 않은 계약은 제외했다. 보고자 그룹이 담보를 받은 쪽인 계약은 87행, 주식담보가 아니거나 아직 질권이 설정되지 않은 계약은 1,594행이다(대장 2.3-2·2.3-3). 앞의 것은 예컨대 엠로의 최대주주 삼성에스디에스가 창업자 송재민의 주식 535,000주에 근질권을 설정받은 행으로([20230531003099](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20230531003099)), 성명 칸이 보고자이지만 보고자의 주식이 담보로 나간 것이 아니다. 뒤의 것은 대부분 주식을 빌린 계약(③의 「차입」 어휘로 표본에 들어왔을 뿐이다)이고, 나머지는 작성기준일에 아직 질권이 없는 약속이다. 예컨대 롯데관광개발의 김기병이 미래에셋대우·더케이저축은행에 준 17,410,621주의 「담보제공확약」은 기존 질권이 풀린 뒤 설정하기로 한 약속이라 제외하고, 같은 주식을 블루밍달리아에 담보로 준 행은 담보로 셌다([20200506000645](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20200506000645)). 뒤의 것에는 발행회사가 자기주식을 담보로 맡긴 27행(4개 기업)도 넣었다. 담보제공자가 발행회사 자신이라 최대주주 그룹의 담보가 아니며, 분모에서 자기주식을 제외하는 것과 같은 기준이다. 예컨대 스피어의 2025년 스냅샷([20260107000707](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260107000707))에서 특별관계자로 적힌 (주)스피어코퍼레이션의 1,800,000주 근질권은 회사 자기주식이므로 이 기업-연도는 담보가 없는 것으로 본다.\n\n[^denomlegacy]: **종전 기준 변수.** 종전 주식등 기준 변수(`holding_shares`, `holding_pct`, `collateral_to_holding_pct`, `collateral_pct_of_total_est`)와 차감식 주권 보조변수(`holding_shares_common`, `collateral_to_common_pct`, `common_denom_suspect`)는 정의를 바꾸지 않고 비교용으로 보존하되, 주 변수와 혼동하지 않도록 분석용 패널에는 두지 않는다. 주권 기준 담보 비율이 주식등 기준보다 5%p 넘게 큰 기업-연도는 713개이고, 아래의 분모 의심 표시가 있는 것을 제외하면 701개이다(대장 3.1-1). 예컨대 KD의 2017년 스냅샷([20171218000301](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20171218000301))에서 지배주주의 주식등은 86,455,438주이지만 주권은 24,343,637주이고 나머지는 잠재주식이다. 담보 24,261,018주는 주식등 기준으로 28.1%, 주권 기준으로 99.7%이다. 종전 차감식 분모는 표지의 「주식등의 수」에서 제2부 「1.가」 아래 비율표의 「보유잠재주식의 수」를 차감한 값이며, 차감 결과가 0 이하가 되는 443개 기업-연도는 결측으로 두었고(`common_denom_suspect='zero'`), 같은 비율표의 주권 보유비율 × 의결권 있는 발행주식총수와 2% 넘게 어긋나는 189개는 표시만 하였다(`'gap'`, 대장 3.1-2·3.1-3). 당시에는 기재 비율과 총수에도 오기가 있어 그 대조값으로 바꾸지 않았다. v32의 주 분석은 직접 기재된 주권 수를 다른 섹션과 대조한 별도 변수로 전환하였다. 주권 기준 비율은 이 443개와 보유주식등의 수가 없는 5개에서 결측이므로, 표시가 비어 있어도 값이 없을 수 있다. 보유비율이 없는 5개 기업-연도는 아모레퍼시픽홀딩스 2011~2015년으로, 스냅샷이 작성기준일 2006년의 옛 서식 보고서를 2016년에 정정한 보고서([20161101000085](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20161101000085))라 표지의 보유 칸을 읽지 못했다(대장 3.1-4). 종전 주식등 기준에서 보유비율과 보유주식등의 수는 5개 기업-연도에서 결측이고, 보유주식등의 수가 0인 0개를 더한 5개(모두 담보가 없는 기업-연도)는 담보 비율도 결측이다. 종전 OWN은 표지 요약정보(주식등 기준). 5개 기업-연도 결측이다. 보유주식등의 수가 비었거나 0인 5개 기업-연도는 담보 비율도 빈칸이다.\n\n[^partial]: 이 조건(`n_live_with_da` < `n_live`)은 대략의 표시이며, 조건에 걸리지 않아도 대출금액이 모두 관측되었다는 보장은 아니다. 이자율·담보유지비율은 유효 행이 하나도 없으면 결측이다. 대출금액이 관측된 기업-연도 가운데 이런 경우는 246개이다(대장 3.1-5). 예컨대 알루코의 2023년 스냅샷([20231213000332](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20231213000332))은 담보 20건마다 대출금(3억~50억원)을 「나」의 기간 칸에 적었지만 「다」에는 그 보고서에서 새로 맺은 하나증권 30억원 1건만 적어, $LOAN_{it}$은 30억원이다. $LOAN_{it}$은 「다」의 대출금액 칸만 읽고 「나」의 자유기재 칸에 적힌 금액은 쓰지 않는다. 또 `n_live_with_da`는 동일 담보 다중 기재의 대표 행만 세지만 $LOAN_{it}$은 대표가 아닌 행에 붙은 「다」의 대출도 더하므로(§4.3), 두 칸의 비교는 대략의 표시이다.\n\n[^linkneg]: 같은 담보제공자가 같은 상대방에게 맡긴 담보를 여러 행에 나눠 적고, 그 가운데 일부를 푼 수량을 음수 행 한 줄로 적은 보고서가 있다. 이 해지분이 어느 행(계약)의 것인지는 공시에 나오지 않는다. 그래서 `loan_linked_shares`를 셀 때는 해지분을 그 묶음 안에서 대출과 연결된 행이 차지하는 비중만큼만 차감했다. 해지분을 모두 연결된 행에서 빼면 0주 아래로 내려가고, 전혀 빼지 않으면 이미 풀린 주식까지 센다. 예컨대 부광약품 2020년 스냅샷([20201211000376](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201211000376))은 김상훈의 한국증권금융 담보 5행(2,992,500주) 가운데 대출금액이 「다」에 적힌 것이 1행(500,000주)뿐이고, 같은 상대방의 해지분 -1,000,000주가 한 줄로 적혀 있다. 연결된 몫은 500,000 × (2,992,500 − 1,000,000) ÷ 2,992,500 = 332,916주로 셌다. 이렇게 나눈 기업-연도는 이 예와 씨젠 2022년의 2개뿐이다(전체본 `n_loan_link_prorated`).\n\n[^loanfill]: 스냅샷 보고서에 대출금액이 없더라도, 같은 계약(담보제공자·상대방·주식수가 같음)을 적은 앞뒤 대량보유보고서의 「다」에 대출금액·이자율·담보유지비율이 모두 있고 실행 잔액으로 확인되면 그 값으로 $LOAN_{it}$·$INT_{it}$·$MAINT_{it}$을 채웠다. 같은 장치로, 스냅샷 「다」가 다른 대출의 행을 그대로 복사해 적은 경우는 그 행을 버리고 같은 계약의 앞 보고서 「다」로 바꾸었다. 비나텍 2025년 스냅샷([20250404004134](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20250404004134))은 주식배당만 보고하면서 「다」에 2022년 대신증권 대출(7억 원)을 옮겨 적었고, 「나」의 신한투자증권 담보 142,200주에 해당하는 대출은 직전 보고서([20241127000019](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241127000019))의 20억 원이다. 채우거나 바꾼 대출은 패널에 따로 남겼다(48개 기업-연도, `loan_fill_krw`). 출처 보고서와 그 해 12월 31일의 간격은 `loan_fill_gap_days`에 남겼고, 1년 넘게 떨어진 보고서나 거래소 공시·감사보고서처럼 이자율·담보유지비율이 없는 원천의 금액은 쓰지 않았다. 비나텍 2025년은 연말과 399일 떨어졌지만, 빈칸을 채운 것이 아니라 스냅샷의 잘못 옮긴 행을 고친 것이고 스냅샷 작성기준일과는 117일이며 그 사이 「나」의 같은 계약은 바뀌지 않아 예외로 두었다. 우리기술 2025년은 스냅샷 「다」가 모두 「-」였고 같은 계약(회사가 사내이사 3명에게 빌려준 돈의 담보)의 「다」는 2023년 12월 보고서뿐이라, 그 행에 대출을 연결하되 금액은 회사 사업보고서 특수관계자 주석의 2025년 말 대여 잔액(합 999,130,901원)을 썼고, 이자율·담보유지비율은 2년 전 값이라 옮기지 않았다. 대출금액이 빈 기업-연도의 「나」 행은 공시 원문·임원 보고·정기보고서·거래소 공시로 다시 판정했고, 그 과정에서 담보가 아니거나 연말 전에 끝난 행을 바로잡았다(§2.3).\n\n[^absent]: 기본 패널에 없는 기업-연도와 그 이유는 확장 패널(`firm_year_panel_universe.csv`)에 정리했다. 2011~2025년 결산일 기준 유가증권·코스닥 상장 기업-연도 전체(31,144개, 2,945개 기업)를 뼈대로 각 기업-연도의 상태(`panel_status`)와 근거(스냅샷 또는 퇴장 보고서의 접수번호, 첫 최대주주 보고 연도, 보고자를 가리지 않은 5% 보고 유무, 벤더 연말 최대주주)를 적었다. 기본 패널은 `observed`·`carried`이고, 나머지 네 상태는 담보 유무를 모르거나 관측할 수 없어 기본 패널에 행이 없다. 최대주주 그룹의 대량보유보고서는 5% 이상을 새로 취득하거나, 지분이 1% 이상 변하거나, 발행주식총수의 1% 이상인 계약을 맺거나 바꿀 때만 나오므로 그동안 지분도 계약도 그만큼 움직이지 않은 기업은 보고서가 없다.\n\n    | `panel_status` | 뜻 | 기업-연도 | 기업 | 내용 | 근거 |\n    |---|---|---:|---:|---|---|\n    | `observed` | 그 해 안의 상태를 적은 최대주주 보고서가 있음 | 19,816 | | 담보 유무는 판정값 | |\n    | `carried` | 직전 보고서 이월 | 8,817 | | 담보 유무는 판정값(변화 없음 가정) | |\n    | `not_reported` | 관측 기간 내내 최대주주 그룹 보고서가 없음 | 489 | 52 | 그중 41개 기업은 기관투자자 등 비지배주주의 5% 보고만 있다. 예: 유한양행은 벤더 자료의 최대주주가 유한재단 외 2인(2025년 15.96%)이지만 그 그룹의 5% 보고서가 관측 기간 내내 없어 기본 패널에 들어오지 않는다 | 대장 3.2-1·3.2-2 |\n    | `gap` | 최대주주 그룹이 승계 없이 떠난 뒤 새 최대주주 보고서가 나오기 전 | 164 | 99 | 퇴장 뒤 연도 가운데 상장이 유지된 해이며 퇴장의 구성은 §2.2의 각주에 있다. 예: 헬릭스미스는 2022년 12월 29일 카나리아바이오엠의 제3자배정 신주 납입으로 최대주주가 바뀌었으나 새 최대주주의 첫 보고서 작성기준일이 2023년이라, 김선영 그룹의 마지막 보고서([20220513001085](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20220513001085)) 뒤 2022년이 이 상태이다 | 대장 3.2-4 |\n    | `unobserved_left` | 첫 최대주주 보고서 이전 연도(좌측 절단) | 1,528 | | 2011년 548개에서 2020년 21개로 줄어든다. 예: LG화학은 최대주주 LG의 첫 보고서가 2018년에 나와 2011~2017년은 담보 유무를 알 수 없다 | 대장 3.2-3 |\n    | `short_form` | 스냅샷이 계약 절 없는 약식 보고서(§2.2 (iii)) | 330 | 124 | 연말 최신 최대주주 보고서가 계약 절이 없는 약식이라 담보를 관측할 수 없다 | 대장 2.2-1 |\n    | 합계 | | 31,144 | 2,945 | 기본 패널은 28,633개 | |\n\n    패널 밖 네 상태는 담보 유무를 0이나 1로 채우지 않았다. 보고서가 없는 `not_reported`·`gap`은 1% 이상인 담보 사건이 있었다면 보고서가 나왔을 것이므로 담보가 없었을 가능성이 크지만, 관측 기간 전에 맺은 담보가 변동 없이 이어졌거나 새 최대주주가 아직 보고하지 않았을 수도 있다.\n\n[^twotier]: 1단은 표본 282,012행 중 만료된 채 실린 행 3,983개와 만료이나 각주가 달린 행 278개, 합 4,261행(1.5%)을 기본 무효로 두었다(대장 4.1-6·4.1-7·4.1-8). 2단은 표본 1,733개 종목을 1,787조각의 시계열 매트릭스로 나눠 읽었고, 판정 유형은 17종이다. 판정은 중복으로 검증했다. 판정한 단위의 일부를 골라 처음 판정을 보지 않고 다시 판정하니 1,462단위 가운데 90.8%가 처음 판정과 같았고, 다른 135건은 공시 원문으로 다시 확인해 처음 판정이 틀린 38건(집계에 영향이 가는 것 18건)을 고쳤다. 담보대출은 만기에 연장되는데 보고자가 기간 칸을 고치지 않는 일이 많아, 2단 이후의 판정은 1단이 만료로 본 행 가운데 2,611행을 존속으로 되살렸다(대장 4.1-9). 예컨대 셀트리온의 2017년 1월 보고서([20170126000408](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20170126000408))에서 셀트리온홀딩스가 유안타증권에 제공한 95,000주는 계약기간이 「2016.10.10~2017.1.9」라 1단 규칙으로는 만료지만, 각주가 만기일 당일의 연장(새 만기 4월 10일)을 밝혀 존속으로 두었다. 매트릭스 판정은 매트릭스만 보고 내렸고, 그 결과는 매트릭스에 없는 정보(행 번호, 보유주식수, 각주가 속한 공시, 앞뒤 보고서의 공시 원문)로 다시 대조해 바로잡았다. 여기에 보고서 제1부 「변동사유」의 담보 해지·담보권 실행 문구를 독립 신호로 대조한 점검과 기술통계상 성립하기 어려운 값의 공시 원문 전수 재확인을 더하였다.\n\n[^endcase]: 판정 대상 표본 행 가운데 주 담보 집계에서 제외된 6,453행은 계약이 끝난 4,772행과, 주식담보가 아니거나 아직 질권이 설정되지 않은 계약 1,594행·보고자가 담보를 받은 쪽인 87행(§2.3)을 합한 것으로, 셋은 성격이 서로 다르다.\n\n    | 구분 | 행 | 무엇인가 | 근거 |\n    |---|---:|---|---|\n    | 계약이 끝난 행 | 4,772 | 작성기준일 전에 해지·상환·만기·반대매매로 끝났는데 보고자가 「나」 표에서 지우지 않고 남겨 둔 행이다. 1단에서 계약기간이 지나 끝난 것으로 본 1,615행과, 기간 칸으로는 살아 있지만 각주·비고·앞뒤 보고서·세부변동내역으로 끝난 것을 확인한 3,157행으로 이루어진다 | 대장 4.1-10·4.1-11 |\n    | 담보가 아닌 계약 | 1,594 | 대부분은 주식을 빌린 계약(주식차입·대차)으로, 계약종류 칸의 「차입」이라는 말 때문에 표본에 들어왔을 뿐 지배주주의 주식이 묶인 것이 아니다. 나머지는 조건이 생겨야 돈을 내는 의무나 금전이 아닌 의무를 담보한 질권, 그리고 작성기준일에 아직 질권이 없는 약속(기존 질권이 풀린 뒤 설정하기로 한 담보제공확약 등)이다 | 대장 2.3-3 |\n    | 보고자가 담보를 받은 쪽 | 87 | 보고자 그룹이 주식을 담보로 내준 것이 아니라 질권자로서 남의 주식을 담보로 받은 계약이다 | 대장 2.3-2 |\n    | 합 | 6,453 | | |\n\n    본문에서 판정이 불명확한 행을 존속으로 본 것은, 끝났다는 근거(날짜가 적힌 해지·상환 기록, 각주, 앞뒤 보고서)를 찾지 못한 행은 「나」 표에 적힌 대로 살아 있는 담보로 센다는 뜻이다. 그래서 이 규칙으로 생기는 오차는 담보를 많게 세는 쪽이다.\n\n    위 행 수는 보고서의 행 수이지 계약이나 사건의 수가 아니다. 한 계약은 끝나기 전까지 여러 보고서에 되풀이 적히고, 끝난 뒤에도 몇 개 보고서에 더 남기도 한다. 그래서 계약 해소나 담보권 실행을 사건으로 연구한다면 이 행들을 그대로 세지 말고, 같은 계약(담보제공자·상대방·주식수·체결일)을 보고서 사이에서 이어 한 계약으로 묶은 뒤 끝난 날짜와 사유(해지·상환·만기·반대매매)를 공시 원문으로 확인해야 한다. 종료 근거의 유형별 사례는 §1 둘째 문단의 각주에 있다.\n\n[^person]: 보유주식수는 「1.가」의 담보제공자 행을 기준으로 하되, 「나」의 담보와 어긋나면 제3부 세부변동내역과 변동사유로 원인을 가렸다. 「1.가」에 담보제공자 행이 없거나 보유가 빈 경우는 표기만 다르면 성명 별칭으로 잇고, 담보권 실행이나 매각으로 보유가 없어졌으면 그 담보 행을 종료로 두었다. 이 점검에서 「1.가」에 담보제공자 행이 없거나 보유 칸이 빈 행은 2,460행(896보고서)이었다. 표기 차이는 「1.가」와 「나」의 식별번호가 같은 경우만 성명 별칭으로 이었으며, 뒤에 더한 것을 합쳐 지금 189쌍이다(대장 4.1-12). 예컨대 에쓰씨엔지니어링은 「나」에 「SC엔지니어링(주)」, 「1.가」에 「에쓰씨엔지니어링(주)」로 적었고 두 식별번호가 같다. 보유 소멸로 종료한 것은 183행이다(대장 4.1-13). 예컨대 세왕의 2013년 1월 보고서([20130104000432](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20130104000432))는 2012년 12월 담보 4건이 반대매매되고 남은 계약도 해지되어 「1.가」 보유가 「-」인데 「나」에는 담보 행이 남아 있었다. 같은 담보제공자·같은 주식수 행이 반복되지만 합이 보유 안에 드는 5,105그룹은 표본 102그룹을 공시 원문으로 검증한 결과 7그룹(6.9%)이 같은 주식을 두 번 적은 중복 기재였고(각주의 공동담보 명시가 대부분) 이들은 모두 접었다. 검증하지 않은 나머지 그룹에도 같은 비율의 중복이 남아 있을 수 있다(§4.2의 각주). 끝으로 「1.가」 보유가 0 이거나 비어 있는데 담보가 실린 487행을 분기·반기·사업보고서와 앞뒤 보고서까지 대조해 다시 판정하여 28행의 판정을 바꾸었다(종료에서 존속 23행, 존속에서 종료 5행; 대장 4.1-14).\n\n[^exceed]: 초과는 「다」의 합산내역·음수(해지) 행의 상계·공탁·중복·분할 전 수량·차입주식과 제3자 주식 담보까지 함께 읽어 판정하였다. 초과의 대부분은 종료가 아니라 차입 주식 담보(「1.가」 미포함), 제3자 주식 담보, 감자·분할 전 수량, 부분해지 뒤 수량 미갱신처럼 「1.가」와 대비하는 쪽의 문제였다. 담보 합이 보유를 넘는 (보고서·담보제공자) 913그룹 3,691행을 판정해 178행을 종료로, 14행을 상계 편입으로 바꾸고 245그룹을 동일 담보 다중 기재로 확정하였다(대장 4.1-15·4.1-16·4.1-17). 보유표가 양도담보·차입주식을 제외하고 적거나 분할 전 수량인 경우와 정당한 제3자·주식등 담보는 유지하였다. 이어 보유가 0인 행 148개(58개 보고서)와 초과가 5%를 넘는 패널 스냅샷 행 413개(104개 보고서), 최대주주 정의 확대 뒤 새로 표본에 들어온 보고서의 변동사유 신호 23건을 다시 확인해 74행을 종료로, 18개 그룹을 동일 담보 다중 기재로 확정하였다.\n\n[^topcheck]: 점검마다의 대상과 결과이다.\n\n    | 점검 | 대상과 결과 | 근거 |\n    |---|---|---|\n    | 「2.가」·「2.나」 근거 전수 점검 | 표지가 아니라 「2.가」·「2.나」 근거로만 그룹에 든 912개 (종목·보고자) 쌍 3,847보고서를 같은 시기 표지 최대주주·벤더 연말 최대주주·「2.가」 관계 칸의 뜻으로 점검해 193보고서를 제외했다. 보고자 자신의 모회사·대표이사를 최대주주로 적은 경우, 2대주주의 최대주주 표기, 특별관계자명 오매칭, 퇴장 뒤 낡은 표기가 대부분이다 | 대장 4.1-1 |\n    | 「최대주주 변동현황」 대조 | 회사가 사업보고서 「최대주주 변동현황」(OpenDART)에 최대주주라고 적은 사람이 5% 보고서를 비최대주주 라벨('주주'·'주요주주'·'임원')로만 낸 구간과 표지 최대주주가 라벨만 바꿔 보고한 구간을 찾았다. 사업보고서 대조로는 1,193보고서를 그룹에 넣고 실제로 지위를 잃은 79건은 그 보고서부터 최대주주 그룹으로 보지 않았다. 그룹 밖이던 보고서가 편입되어 새 담보 행이 들어온 64개 종목은 §4의 절차로 다시 판정하였다 | 대장 4.1-3·4.1-5 |\n    | 의결권 주식 서열 | 「2.가」·「2.나」 근거로 든 보고서 가운데 전환사채 등 잠재주식을 포함한 보유비율로만 최대주주처럼 보인 것은 「1.가」의 의결권 있는 주식 보유량으로 서열을 다시 매겼다. 서열 재점검으로 50개 보고서를 제외하고 11개 보고서를 편입하였다 | 대장 4.1-34·4.1-35 |\n    | 연말 「주식소유 현황」 대조 | 「최대주주 변동현황」은 변동 이력이라 변동이 없던 회사는 최대주주 이름이 비어 있다. 그래서 대조 당시 패널 기업-연도와 약식으로 제외한 기업-연도 29,526개 가운데 변동현황으로 확인되지 않은 13,076개의 연말 스냅샷을 회사가 적은 연말 명단과 대조하고, 스냅샷 보고서의 제출인·「2.가」 보고자·「2.나」 특별관계자 이름이 명단에 없거나 특별관계자 이름으로만 겹친 540개 기업-연도(404단위)를 판정했다. 83단위는 표기 차이, 30단위는 회사 표가 지분 1위를 적었지만 보고자가 사실상지배주주 등으로 지배한 경우, 12단위는 표의 기준일이 연말이 아니거나 표가 틀린 경우였다. 나머지에서 217보고서를 그룹에서 제외하고 80보고서를 넣었으며 84건은 지위를 잃은 시점부터 최대주주 그룹으로 보지 않았다 | 대장 4.1-26~4.1-32 |\n\n    연말 명단은 OpenDART 「최대주주 현황」(2013 사업연도부터, 11,287개)에서 읽고, 2011·2012년과 표준 표가 없는 해는 12월 말 기준 정기보고서 원문(XML·HTML, 1,789개)에서 절 번호가 아니라 표의 머리행으로 찾아 읽었다. 이 대조에서 제외한 것은 계약만 맺고 연말까지 완결되지 않은 인수의 인수인 보고서와 처음부터 최대주주가 아닌 보고자의 보고서이고, 그 시점부터 최대주주 그룹으로 보지 않은 것은 연말 전에 지위를 잃었는데 새 보고가 없어 옛 스냅샷이 이월된 경우이다. 새 최대주주의 보고서가 있어도 그 상태일(§2.1)이 다음 해이면 그 해는 퇴장 뒤 공백으로 두었다.\n\n    예컨대 금호석유화학의 박찬구 그룹(박철완·박준경 포함)은 2012~2020년 보고서의 관계를 「임원(등기)」로 적었으나 벤더 연말 자료의 지분과 회사 기재가 최대주주 그룹과 일치해 그 보고서들을 편입하였다([20120327000320](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20120327000320)). 덴티스의 2017년 7월 보고서에서 하나금융투자는 「2.가」에 자신을 최대주주로 적었으나 의결권 있는 주식은 5,000주뿐이고 나머지는 전환사채였다([20170703000109](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20170703000109)). 이 보고서를 제외하고, 같은 날 의결권 있는 주식 270,000주를 가진 신한캐피탈 그룹의 보고서([20170703000223](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20170703000223))를 넣었다. 한화에어로스페이스의 2014년 스냅샷은 한화가 삼성 계열사의 지분을 사기로 계약만 맺고(2014년 11월, 거래 종결 2015년 6월) 표지에 최대주주로 적은 보고서였다([20170629000351](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20170629000351), 작성기준일 2014년 12월 3일). 이를 제외해 2014년 스냅샷은 매도인 삼성전자의 보고서가 되었다. 남양유업의 2022·2023년 스냅샷도 끝내 무산된 매매 계약의 인수인 대유홀딩스의 보고서였다([20220314000929](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20220314000929)). 에스원의 2012년 스냅샷은 의결권 20.74%의 삼성SDI 그룹이 표지에만 최대주주로 적은 보고서였고([20120323000638](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20120323000638)), 연말 최대주주 SECOM(24.66%)은 5% 보고서를 내지 않아 그 해는 패널에서 제외되었다.\n\n[^rules]: 수량을 바꾸는 부분해지 상계·분할·병합·감자 환산·보유 캡과 원문 판정에 따른 수동 주식수 보정은 패널의 담보 주식수(`collateral_shares_live`)에 반영되어 있다. 패널에는 기업-연도별 부분해지 상계량(`adj_shares_subtracted`)·분할·병합·감자 환산 증감(`split_shares_delta`)·보유 캡 차감량(`cap_shares_subtracted`)과 캡이 걸린 담보제공자 수(`n_cap_groups`)를 실었고, 수동 보정량은 따로 싣지 않았다. 계약 단위 파일에는 공시에 적힌 수량(`contract_shares`)과 보정한 수량(`contract_shares_adj`), 보정 사유(`adj_note`)가 함께 있다. 규칙마다 걸린 범위와 바뀐 양은 다음과 같다.\n\n    | 규칙 | 걸린 범위와 바뀐 양 | 근거 |\n    |---|---|---|\n    | 부분해지 상계 | 부분해지 상계는 167행(118보고서)에서 86,835,134주를 차감한다. 공시 원문과 판정은 그대로 두고 조정 수량만 별도로 기록한다 | 대장 4.1-18 |\n    | 스냅샷 보고자 구분 | group / financial_investor / creditor | |\n    | 늦은 퇴장 기록 | 예: 에스엠. 카카오가 2023년 3월 공개매수로 최대주주가 된 뒤 하이브가 2025년 6월에 보유 0 보고서를 냈다 | |\n    | 분할·병합·감자 환산 | 분할·병합·감자 환산은 178행(57보고서, 그중 패널 스냅샷 10보고서)이며, **사건 전부터 같은 수량으로 이월된**(사건 직전 보고서에도 같은 수량) 담보행에만 곱한다. 비율은 종목·변동일·종류별로 변동후/변동전의 보고자 중앙값을 정수배로 맞추고, 같은 날 감자와 분할이 겹치면 둘을 곱한다(예: SOOP 2011년 회사분할 0.45, 동양 2014년 2:1 뒤 5:1 연속 병합, 아인스엠앤엠 2011년 감자 10:1과 분할 1:5). 보고서 「1.가」가 아직 사건 전 수량이면 보유와 담보가 같은 단위라 곱하지 않는다(광무 2012년) | 대장 4.1-19 |\n    | 보유 캡 | 보유 캡은 332명·314보고서에 걸려 824,327,092주를 차감했고, 그중 87명은 초과가 5% 이내이다. 어느 행이 낡았는지는 공시 원문에 근거가 없으므로 행 단위 값은 손대지 않고 사람 단위 플래그와 차감량만 기록한다. 패널에서의 크기와 패널 스냅샷의 원문 확인 결과는 §3.1 (5)의 각주에 있다 | 대장 4.1-20·4.1-21 |\n    | 보유 캡의 예외 | 같은 그룹 구성원에게서 빌린 주식을 담보로 넣어 캡을 걸지 않은 것은 19그룹이다(빌린 양이 초과분 이상). 담보 초과 판정에서 보유표 쪽 문제(「1.가」 오기·양도담보 차감 등)나 정당한 초과(차입주식·전환사채 등 주식등 담보)로 확인한 담보제공자에도 캡을 걸지 않는다 | 대장 4.1-22 |\n    | 보유 캡 전의 「1.가」 대조 | 캡을 걸기 전에 그 사람의 「1.가」 보유가 오기가 아닌지 같은 보고서의 제3부 변동내역·보유형태별 보유내역과 직전 보고서의 「1.가」로 대조한다. 2명은 「1.가」 오기로 판정해 자동 보정하였고, 51명은 제3부가 주식등 합계·그룹 합계를 적은 경우라 보정하지 않았다 | 대장 4.1-23·4.1-24·4.1-25 |\n\n    캡 예외의 예는 세종메디칼의 2022년 12월 보고서([20221202000629](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20221202000629))이다. 카나리아바이오엠은 세종메디칼컴퍼니에게서 빌린 3,377,740주를 포함한 3,400,000주를 더하기커런시대부에 담보로 제공했는데, 「1.가」가 빌린 몫을 대여자 이름으로 적어 카나리아바이오엠의 보유가 850,000주로만 잡혀 캡이 2,550,000주를 깎을 뻔했다. 한 사람이 별칭으로 합쳐진 여러 표기 중 하나라도 이렇게 판정됐으면 캡에서 제외한다. 「1.가」 오기 보정의 예는 구영테크 2023년 이종명 452,924주 → 1,993,281주이다(변동이 없는데 직전 보고서와 보유형태별이 1,993,281주, [20231201000289](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20231201000289)).\n\n[^cap]: 보유 캡을 두는 이유와 패널에서의 크기이다. 보고자는 「1.가」 보유를 보고서마다 새로 적지만 「나」의 담보 행은 처음 적은 수량을 다음 보고서로 그대로 옮기는 일이 많아, 담보 주식을 팔거나 담보권자가 반대매매한 뒤에도 옛 수량이 남는다. 담보는 자기 보유를 넘을 수 없으므로 담보제공자의 담보 합이 보유를 넘으면 보유를 상한으로 둔다. 어느 행이 낡았는지는 원문에 근거가 없어 행 값은 그대로 두고 사람 단위 차감량만 기록한다. 캡은 수량만 줄이고 담보 유무($PLEDGE$)는 바꾸지 않는다.\n\n    | 구분 | 패널 기업-연도 | 근거 |\n    |---|---|---|\n    | 캡이 걸린 기업-연도 | 56개(담보가 있는 9,422개의 0.59%)이고, 차감한 주식은 89,975,351주(캡 전 담보 합의 0.14%)이다 | 대장 4.1-36 |\n    | 캡 전후 주 담보비율 차이 | 1%p 미만 26개 · 10%p 이상 14개 · 캡이 없으면 100%를 넘는 것 10개 | 대장 4.1-37·4.1-38·4.1-39 |\n    | 원문 확인 | 캡이 걸린 담보 그룹은 모두
