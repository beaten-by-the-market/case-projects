공시 원문·앞뒤 공시·정기보고서·거래소 공시로 확인했다. 가장 많은 원인은 매도·반대매매 뒤 담보 행을 고치지 않은 것이었고, 감자 환산 누락이 원인인 것은 1그룹이었다. 56개 가운데 46개는 캡 값을 그대로 쓴다 | 대장 4.1-40 |\n    | 원문 판정 값 | 캡 값이 틀린 21그룹은 원문 판정 값으로 바꿨다. 그중 11그룹은 제3자 담보·그룹 안 차입주식·성명 오기·「1.가」 오기·담보 목적으로 넘긴 주식이라 캡을 풀었고, 10그룹은 반대매매·대환으로 이미 끝난 몫, 수량 오기, 감자 등을 반영한 값을 쓴다. 뒤의 10그룹이 걸린 기업-연도가 위 56개 가운데 10개이다 | 대장 4.1-41 |\n    | 원천으로 정하지 못한 것 | 코미팜 2022~2025년 4개이다. 담보유지비율을 맞추려고 늘린 담보가 보유의 1.7~2.7배인데 넘는 몫이 누구 주식인지 원천에 없어, 확실한 하한인 보유 전량(캡 값)을 쓴다 | 대장 4.1-40 |\n\n    캡 값이 틀린 예는 엘앤씨피의 2011년 11월 보고서([20111110000202](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20111110000202))이다. 박충주는 보해상호저축은행 담보 4,464,285주를 그대로 적었지만 담보권자가 그중 1,001,130주를 반대매매해 「1.가」 보유는 3,863,155주였다. 캡은 3,863,155주를 남기나, 담보권자의 대량보유 보고서를 따라가면 반대매매 뒤 담보 계좌로 돌아간 것은 3,463,155주이고 나머지 400,000주는 처음부터 담보 밖이었다(대장 4.1-41). 표본 전체의 캡 규모·예외·「1.가」 사전 대조는 §4.1 보유 캡 규칙의 각주에 있다.\n\n[^dup]: 보유는 「1.가」의 주권 의결권있는주식이며, 그 사람 행이 없으면 「1.나 보유형태별」 주식등 합계로 대신한다. 규칙이 잡지 못하는 경우(상대방까지 같은 다중 문서, 보유 전량을 다시 잡은 후순위 포괄행, 각주에 「동일 주식」이 명시된 경우)는 공시 원문 검토로 확정하였다. 대표로 뽑히지 않아 주식수 합에서 제외한 행은 702그룹 899행이고, 그중 377그룹 507행은 공시 원문 검토로 확정한 그룹이다(대장 4.2-1·4.2-2). 예컨대 한진칼의 2025년 10월 보고서([20251022000208](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251022000208))에서 조원태는 은행·증권사 등에 나눠 준 담보 행들과 함께 보유 전량 3,856,002주에 대한 한국산업은행 앞 포괄 근질권(투자합의서의 위약벌 담보)을 적었다. 이 근질권은 개별 담보 행과 같은 주식에 겹쳐 걸려 있으므로 포괄 행을 합에서 제외했다. 반대로 합이 보유 안에 들면 같은 주식을 나눠 담보로 준 것으로 보아 모두 더한다. 이 경우에도 같은 계약을 되풀이해 적은 행이 섞일 수 있다(§4.1의 표본 검증에서 약 7%). 그 잔여 규모는, 같은 보고서 안에서 성명·계약종류·체결일·계약기간·주식수가 모두 같은 행을 반복 기재로 보면 2,039행(23.5억 주, 표본 양수 행 주식수의 0.63%)이다. 이 행들은 별개 계약과 구별할 근거가 없어 그대로 두었다.\n\n[^neg]: 적재 후 검산에서 종료 때문에 합이 음수가 된 담보제공자·상대방 묶음은 0건이다. 고아 음수 행은 같은 보고서에 같은 담보제공자·상대방의 양수 행이 없는 음수 행이며, 대개 설정은 앞 보고서에 있고 이번 보고서에는 해지분 음수 행만 실린 경우이다. 스냅샷에 살아 있는 음수 행이 있는 기업-연도는 49개이고, 고아 음수 행을 합산에서 제외한 기업-연도는 15개이다(대장 4.2-3·4.2-4). 음수 행을 부호째 더하는 예는 씨젠의 2024년 스냅샷인 3월 보고서([20240329002336](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20240329002336))이다. 설정 행과 함께 상환분 48개를 음수로 적었고, 본 연구는 이를 부호째 더한다(벤더가 이 부호를 버린 사례는 §1 셋째). 고아 음수 행은 다음과 같은 경우이다. 앞 보고서에 A은행 질권 100주가 있었고 이번 보고서에는 A은행 행이 해지분 −100주 한 줄뿐이며 B증권 질권 50주가 따로 있다면, 이번 보고서의 담보는 50주인데 −100주를 더하면 B증권 담보까지 지워진다. 대구백화점의 2017년 스냅샷([20170925000347](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20170925000347))은 「나」에 구정모의 KEB하나은행 「질권설정해지」 −350,000주(비고 「기존 주식담보 대출 20억원 전액상환으로 인한 질권설정 해지」) 한 줄만 있어, 이 행을 제외하고 담보 0으로 집계하였다. 고아 음수 행이 있는 스냅샷은 모두 앞뒤 대량보유보고서, 임원·주요주주 소유상황보고서, 정기보고서, 거래소 공시에서 짝인 설정 행을 찾아, 그 담보가 이미 끝났거나(전액 상환·대환) 담보제공자가 그룹을 떠난 기재이거나(이트론 2011년), 양수 행은 여러 상대방을 묶어 적고 음수 행은 상대방별로 적어 이름이 맞지 않은 것(엘브이엠씨 2012~2015년)임을 확인하였다. 반대로 같은 상대방과 같은 날 옛 질권을 풀고 새 질권을 맺은 대환에서는 옛 계약의 해지 행이 새 계약 행과 담보제공자·상대방이 같아 짝으로 묶일 수 있으므로, 짝은 체결일·계약기간과 보고서의 「2.나」 합계 행으로 확인하였다. 예컨대 무림페이퍼의 2021년 스냅샷([20211203000449](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20211203000449))은 2020년 11월 설정한 하나은행 근질권의 해지 −6,526,000주와 같은 날 새로 설정한 「하나은행 外」 근질권 7,826,000주를 함께 적었고 합계도 7,826,000주이므로, 해지 행을 새 계약에서 차감하지 않는다.\n\n[^unit]: 단위를 판정한 보고서는 44,843건이며, 그중 20,720건은 「다」에 원화 대출금액이 없어 판정할 것이 없었다. 나머지 가운데 KRX 시세 교차검증에만 의존한 396건은 신뢰도 「낮음」으로 표시하였다(대장 4.3-1). 예컨대 주석이 「(단위: 백만원)」인 보고서의 「3,000」은 30억원이다. 외화 대출은 3,089행이다(대장 4.3-2).\n\n[^loankey]: 대주를 식별 조합에 넣는 것은 한 사람이 같은 금액을 여러 금융기관에서 따로 빌린 별건 대출을 하나로 접지 않기 위해서이다. 실제 차입자별 잔액을 연구하려면 대출을 채무자별로 다시 묶어 봐야 한다. 패널 스냅샷에서 금액·채무자가 같고 대주만 다른 대출 묶음은 1,108개(740개 보고서)이며, 대주를 식별 조합에서 제외하면 패널 대출금액의 4.0%가 사라진다(대장 4.3-3). 예컨대 삼성전자의 2025년 11월 보고서([20251107000558](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251107000558))에서 홍라희는 NH투자증권과 하나증권에서 각각 3,000억원을 빌렸는데, 대주를 보지 않으면 두 대출이 한 건으로 접힌다. 반대로 반복 기재를 1회로 접지 않으면 크게 과대계상된다. 스냅샷 보고서에서 같은 대출을 여러 담보제공자 행에 반복한 묶음은 1,503개이고 가장 많이 반복된 것은 22번이다(대장 4.3-4). 예컨대 GS의 2020년 12월 보고서([20201216000427](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201216000427))는 계열 싱가포르 법인(GS AROMATICS PTE. LTD)의 대출 두 건을 담보를 낸 22명의 행마다 똑같이 적어, 그대로 더하면 22배가 된다.\n\n[^cross]: 대표 사례는 두산중공업(현 두산에너빌리티)의 한국산업은행·한국수출입은행 대출 3조 원이다. 이 대출에는 두산그룹 여러 회사의 주식이 함께 담보로 잡혀, 3조 원이 2020년에는 두산·두산에너빌리티·두산퓨얼셀 세 회사의 $LOAN_{it}$에, 2021년에는 두산밥캣·오리콤까지 다섯 회사의 $LOAN_{it}$에 각각 전액 들어 있다. 어느 회사의 주가가 떨어져도 이 대출의 담보 가치가 줄어드므로 회사 하나만 볼 때는 맞는 값이고, 기업-연도 단위 분석에서는 그대로 쓰면 된다. 그러나 연도별 시장 전체 대출 규모나 시장·업종·그룹별 합계처럼 여러 기업-연도를 더하면, 2021년 다섯 회사를 그대로 더할 때 3조 원이 15조 원으로 잡힌다. 그래서 이런 대출금액을 `loan_krw_cross_issuer`에 따로 적어 두었고, 합계를 낼 때는 연도·채무자·대출금액·대주가 같은 대출을 한 번만 센다. 이런 대출이 들어간 기업-연도의 수는 다음 각주의 표에 있다.\n\n[^loanrules]: §4.3의 대출 합산 세부 규칙이다.\n\n    | 규칙 | 내용 | 예·건수 |\n    |---|---|---|\n    | 대주 이름 표기 변형 | 대주 이름의 표기 변형(`KDB산업은행 등`과 `한국산업은행`, 대주단 나열)을 한 이름으로 모아, 같은 대출을 다르게 적은 행이 두 번 계상되지 않게 한다 | 두산에너빌리티 보고서의 KDB 3조원 |\n    | 트랜치 | 같은 「나」 행(같은 담보)에 붙은 「다」 여러 행은 금액·채무자·대주가 같아도 이자율·담보유지비율·기타 칸 중 하나라도 다르면 별개 대출분으로 모두 더하고, 전부 같을 때만 반복 기재로 보아 1회 계상한다. 다른 「나」 행(다른 담보제공자·다른 계약)에 붙은 같은 금액·채무자·대주의 「다」는 이자율이나 담보유지비율이 다르면 별개 대출로 더하고, 같거나 기타 칸에 공동담보·합산 문구가 있으면 한 담보 대출을 담보제공자마다 되풀이 적은 것으로 보아 1회 계상한다. 조건이 같아도 채무자의 차입금 표·보고사유로 별개 대출이 확인된 행은 더하고, 조건이 달라도 같은 대출로 확인된 행은 1회 계상한다(공시 원문 판정) | 다른 「나」 행의 대출을 별개로 더한 기업-연도는 189개이다 |\n    | 다중 기재 행의 대출 | 동일 담보의 다중 기재(§4.2)로 주식수 합에서 제외한 행에 붙은 「다」도 더한다. 그 행의 「다」는 같은 주식을 담보로 받은 다른 대출(후순위 질권 등)이다 | |\n    | 대환 겹침 | 공시 원문이 한 행의 대출금액을 총액 기준으로 적었다고 밝히고 그 총액에 다른 행의 대환 대출이 들어 있으면 대환 대출을 더하지 않는다 | 전 공시를 훑어 한 기업(피플바이오)의 3개 보고서뿐이었다(대장 4.3-5) |\n    | 발행회사 간 공동담보 | 여러 회사의 주식으로 함께 담보한 대출은 각 회사에 전액 두고 `loan_krw_cross_issuer`로 표시한다 | 두산중공업이 계열사 주식을 공동담보로 제공받은 KDB 3조원 등이 들어간 기업-연도는 396개이고(대장 4.3-6) |\n    | 연말 잔액 | 대출금액 칸이 한도·약정액이거나 연말 전에 상환·추가 실행된 대출은 원천으로 그 해 12월 31일 잔액이 확인되면 그 잔액으로 바꾼다(0 포함, `n_loan_yearend`·`loan_yearend_delta_krw`). 채무자가 개인이면 감사보고서가 없어 대개 보고서 금액으로 남는다 | 연말 잔액으로 바꾼 대출이 있는 기업-연도는 154개이다 |\n    | 한도 표시 | 「다」 기타 칸이나 각주에 한도·약정·잔액 류의 말이 있는 대출을 공시 원문으로 판정해, 한도로 확인됐지만 연말 잔액을 확인하지 못한 몫을 `loan_krw_limit`으로 표시한다(값은 보고서 금액) | 한도로 확인된 몫이 있는 기업-연도는 66개이다(대장 4.3-7) |\n\n[^kep]: 담보유지비율이 기재된 137,290행 가운데 97.7%가 100~300% 구간에 있다(중앙값 150%, 5분위 110%, 95분위 200%). 100% 미만은 2.0%(2,764행)이며, 그중 118행은 대출이 끝나 0으로 적은 행이고 335행은 대출금액이 없는 행이다. 예컨대 한미사이언스의 2021년 3월 보고서([20210309000770](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20210309000770))는 담보유지비율 칸에 50%·70%를 적었는데, 이는 대출금이 담보가치의 50~70%라는 담보인정비율이다(대장 4.4-1). 300% 초과는 0.3%(370행)이며 대부분 그 시점의 평가값이다. 알 수 없는 값을 채우려고 적은 999 같은 의미 없는 숫자(자리표시)도 14행 있다(예: 남화토건 [20200721000286](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20200721000286), 대장 4.4-2). 대출금액이 있는 행을 다음 각주의 무효 사유로 나누면 세 구간의 성격이 갈린다.\n\n    | 담보유지비율 칸의 값 | 행 | 끝자리가 5의 배수 | 많이 적힌 값(%) | 읽는 법 |\n    |---|---:|---:|---|---|\n    | 100% 미만으로 적은 값 | 2,311 | 98.1% | 70·60·85 | 담보인정비율. 역수(10,000 ÷ 값)의 중앙값이 142.9%, 사분위가 142.9~166.7%로 유효 행(중앙값 150%, 사분위 130~170%)과 겹친다 |\n    | 100~300%로 적은 값(유효 행) | 132,186 | 97.1% | 140·110·150 | 계약상 유지 하한 |\n    | 300%를 넘게 적은 값 | 370 | 44.3% | 400·350·450 | 그 시점의 평가값이 대부분이고, 999 같은 자리표시와 400%·350%처럼 계약 조건일 수 있는 값도 섞여 있다 |\n\n    같은 대출(종목·채무자·대출금액이 같은 「다」 행)이 두 보고서 이상에 나오는 9,101건 가운데 값이 모두 100~300%인 8,841건은 20.5%만 보고서마다 값이 바뀌었으나, 300%를 넘는 값이 있는 69건은 71.0%가 바뀌었다. 계약 하한은 계약을 고치지 않는 한 그대로이고 평가값은 주가를 따라 움직인다. 예컨대 시공테크의 대신증권 20억원 대출은 2022~2024년 보고서에 4.62배·4.72배·5.75배로 적혔다([20221104000362](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20221104000362) · [20231106000333](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20231106000333) · [20241101000105](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20241101000105)). 오스코텍은 담보유지비율 칸에 7,272%·2,652%를 적고 「다」 기타 칸에 「최초 담보유지비율: 1,569%」·「최초 담보유지비율: 1,746%」를 따로 밝혀, 칸의 값이 처음 계약 때가 아니라 그 시점의 평가값임을 보여 준다([20200914000336](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20200914000336)).\n\n    200%를 넘는 값도 다수는 계약 조건이다. 업계의 유지 하한은 대체로 140~200%이다. 증권사 신용융자는 종목 증거금률에 따라 융자금의 140~160%이고(한국투자증권 신용거래약관 별첨, 2025년 7월 시행. 그 전에는 140~170%), 대주주 주식담보대출은 대주마다 달라 오스테오닉 대표의 대출은 부산은행 140%, BNK투자증권 160%, SK증권·신한투자증권 200%였다([딜사이트 2024년 2월 9일 보도](https://dealsite.co.kr/articles/117709)). 패널의 $MAINT_{it}$에 쓰인 「다」 12,786행 가운데 200%를 넘는 값은 271행(2.1%)뿐이고, 이 값이 적힌 대출 210건 가운데 두 보고서 이상에 나오는 55건의 61.8%(34건)는 같은 값을 유지해, 200% 이하만 적힌 대출(81.4%)보다는 낮지만 다수가 계약 조건이다. 나무기술의 교보증권 대출은 2020~2025년 보고서 6건이 모두 250%였고 그사이 대출금액이 20억원에서 약 10억원으로 바뀌어도 그대로였으며([20201130000651](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201130000651) · [20251223000488](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251223000488)), 위메이드의 기업은행 180억원 대출도 6년 내내 220%였다([20201218000522](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201218000522) · [20251209000365](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20251209000365)). 대주가 업계에서 흔한 수준보다 높은 하한을 정한 계약으로 읽힌다. 반대로 평가값으로 보이는 값은 200% 위아래에 모두 있다. 덴티스의 대구은행 16억원 대출은 2021~2023년 보고서에 172%·181%·120%로 적혔고([20210713000438](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20210713000438) · [20220714000289](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20220714000289) · [20231201000450](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20231201000450)), 엘앤에프의 국민은행 40억원 대출은 2021년에 292.5%였다가 2022년부터 120%로 적혔다([20211230000330](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20211230000330) · [20230105000392](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20230105000392)). 그래서 상한을 업계 수준인 200%로 낮추면 200% 아래의 평가값은 그대로 남고 200% 위의 계약 조건도 함께 제외된다. 상한은 300%로 두고, 평가값일 수 있는 대출을 제외하는 검정을 따로 두었다.\n\n[^kepvalid]: 「다」 162,479행 중 유효 행은 132,186행이다. 무효 사유는 아래 순서로 하나만 매기므로, 앞 각주의 100% 미만 2,764행 가운데 대출금액이 없거나 0인 행은 앞의 사유로 들어간다.\n\n    | 무효 사유(매기는 순서) | 행 | 근거 |\n    |---|---:|---|\n    | 비율 미기재 | 25,189 | |\n    | 대출금액 없음 | 2,305 | |\n    | 비율 0인 소멸 행 | 118 | 대장 4.4-3 |\n    | 100% 미만 | 2,311 | 대장 4.4-1 |\n    | 300% 초과 | 370 | 대장 4.4-2 |\n\n[^kepsens]: 패널의 기업-연도에서 유효 구간만 바꿔 $MAINT_{it}$·$MAINT\\_W_{it}$를 다시 계산하면 아래와 같다. 쓰는 「다」 행(§4.3의 중복 제거를 통과해 $LOAN_{it}$에 합산된 행)은 그대로 두었다. 상한을 250~500%로 옮기거나 없애도 중앙값은 145%이고, 상한을 없애면 평균만 오스코텍 7,272% 같은 평가값에 끌려 올라간다. 상한을 200%로 낮추면 중앙값이 143%가 되지만, 제외되는 값의 다수는 계약 조건이다. 하한을 110%로 올리면 계약 조건 100%·105%를 적은 행이 제외되어 중앙값이 150%가 된다. 100% 미만 값을 역수로 바꿔 넣으면 기업-연도가 117개 늘지만 분포는 그대로다. 같은 대출(종목·대주·채무자·대출금액)이 패널의 두 보고서 이상에 나오는데 값이 바뀌고 그중 끝자리를 맞추지 않은 값이 있으면 평가값 의심 대출로 보았다. 재약정으로 하한을 바꾼 대출도 섞이는 넓은 정의인데, 평가값 의심 대출 80건을 제외하면 120개 기업-연도의 값이 바뀌지만 중앙값은 그대로다.\n    | 유효 구간 | 기업-연도 | 주 변수와 값이 다른 기업-연도 | $MAINT$ 중앙값 | $MAINT$ 평균 | $MAINT\\_W$ 평균 |\n    |---|---:|---:|---:|---:|---:|\n    | 100~300% (주 변수) | 3,201 | 0 | 145 | 149.4 | 149.1 |\n    | 100~200% | 3,135 | 207 | 143 | 146.1 | 145.5 |\n    | 100~250% | 3,180 | 67 | 145 | 148.0 | 147.5 |\n    | 100~400% | 3,212 | 28 | 145 | 150.4 | 150.1 |\n    | 100~500% | 3,217 | 36 | 145 | 151.1 | 150.9 |\n    | 100% 이상 전부 | 3,230 | 52 | 145 | 158.1 | 159.0 |\n    | 110~300% | 3,142 | 139 | 150 | 150.6 | 150.3 |\n    | 100~300%, 100% 미만은 역수로 포함 | 3,318 | 169 | 145 | 149.9 | 149.6 |\n    | 100~300%, 평가값 의심 대출 제외 | 3,174 | 120 | 145 | 149.3 | 149.0 |\n\n[^ratelow]: 「다」 162,479행 중 이자율이 1~20%인 행이 145,976행(89.8%)이고 1 미만이 311행이다(대장 4.5-1·4.5-2·4.5-3). 1 미만에는 배수 표기와 실제 저금리가 섞여 있다. 예컨대 참엔지니어링 181행은 이자율이 0.038~0.07인데 같은 표의 담보유지비율도 1.5~2.0으로 적혀 있어, 이 보고자는 비율을 배수로 쓴다. 0.04는 4%다([20201112000293](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201112000293) 등). 반대로 원익IPS 21행의 0.55는 실제 금리이다. 채무자인 원익홀딩스의 2020년 사업보고서 차입금 주석에 「산업은행 연이자율 0.55~1.64%」 차입 200억원이 그대로 실려 있다([20201228000259](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20201228000259) 등). 다만 그 보고서 안에는 퍼센트 표기를 확인할 다른 이자율이 없어 규칙대로 무효로 두었다. 「그 문서의 담보유지비율이 모두 10 미만이면 배수 표기」라는 규칙을 전수로 적용해 보면 71개 문서가 걸리는데 그중 69행의 이자율은 이미 퍼센트였다(3.5%를 350%로 만들 뻔했다). 담보유지비율이 작은 이유가 배수 표기가 아니라 담보인정비율(LTV)형 기재인 문서가 섞여 있기 때문이다.\n\n[^ratefix]: 유효 행은 1~20%인 145,976행과 1 미만이지만 실제 금리로 넣은 10행을 합한 145,986행이다. 1 미만은 문서 안에 근거가 있을 때만 넣었다. 채무자의 사업보고서 같은 문서 밖 자료로 실제 금리임이 확인되더라도 문서 안의 근거가 없으면 규칙을 일관되게 적용하기 위해 넣지 않았다.\n\n    | 무효로 둔 이자율 | 행 | 근거 |\n    |---|---:|---|\n    | 미기재 | 15,694 | |\n    | 0인 행 | 479 | |\n    | 20% 초과 | 19 | |\n    | 1 미만 | 295 | 대장 4.5-1 |\n    | 이자율이 아닌 값 | 6 | 대장 4.5-2 |\n\n    앞 각주의 1 미만 311행은 이 295행과 이자율이 아닌 값 6행, 실제 금리로 넣은 10행으로 나뉜다.\n\n    | 공시 원문으로 판정한 행 | 판정 | 근거 |\n    |---|---|---|\n    | 롯데지주 4행([20200731000603](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20200731000603) 등) | 이자율이 아닌 값 | 같은 공시 각주가 「※ 연번 1은 보증서 발행을 위한 담보제공 건임」이라고 밝혔고 그 행이 연번 1이다 |\n    | 한라IMS 2행([20240329002733](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20240329002733) 등) | 이자율이 아닌 값 | 「다」 기타 칸의 표식이 각주 「이자율이 아닌 외화지급보증서 발행으로 인한 보증 요율입니다」로 이어진다 |\n    | KBI동양철관 10행(0.9) ([20200730000250](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20200730000250) 등) | 실제 금리, 유효 행 | 채무자가 독일 법인(KDK Automotive GmbH)인 유로존 저금리 차입이고 같은 문서의 다른 행이 2.3~4.3%로 퍼센트 표기다(대장 4.5-3) |\n\n[^bok]: 한국은행 기준금리의 각 연도 12월 31일 수준은 2020년 0.50%, 2021년 1.00%, 2022년 3.25%, 2023년 3.50%, 2024년 3.00%, 2025년 2.50%이다(한국은행 「기준금리 변동 추이」). 이자율 중앙값(패널 B)은 같은 해에 3.30, 3.40, 4.90, 5.65, 5.44, 4.80%이며, 두 해 사이의 변화 방향 5개가 모두 기준금리와 같다. 이자율은 가산금리가 붙은 개별 대출의 값이므로 수준이 아니라 방향만 비교하였다.\n\n[^loanna]: 2020년 이후 담보가 있는데 $LOAN$이 결측인 기업-연도의 사유이다(`loan_na_reason`, 대장 5.1-1).\n\n    | 코드 | 사유 | 기업-연도 | 근거 |\n    |---|---|---:|---|\n    | `no_da_rows` | 「다」 행 자체가 없음(2020년 7월 서식 이전 보고서를 이월한 경우 포함) | 280 | 대장 5.1-2 |\n    | `da_blank` | 「다」의 모든 칸이 「-」 자리표시 | 148 | 대장 5.1-3 |\n    | `no_loan_amount` | 대출금액 칸이 비어 있음 | 22 | 대장 5.1-4 |\n    | `supplement_no_loan` | 담보가 연말 보충분뿐인데 보충한 계약의 대출금액이 없음 | 29 | 대장 5.1-6 |\n    | `unmapped` | 「다」가 「나」와 연결되지 않음 | 3 | 대장 5.1-5 |\n    | `repo_no_da` | 담보가 환매조건부 매도뿐(대금은 「나」 비고·각주에 적힘) | 25 | 대장 5.1-7 |\n\n[^match]: 대조 대상 277,076행은 공시 수집 시점에 유가증권·코스닥 종목인 회사의 최대주주 그룹 보고서에서, 의결권 있는 주식이고 계약의 종류에 담보·질권·차입·대출이 들어 있으며 주식수가 양수인 공시 원문 행이다. 벤더 상품의 범위에 맞춘 집합이라 §2.3의 판정 대상 표본(「상동」 상속, 대여·대차·담보신탁·어휘 밖 질권 편입, 납세담보 분리 등을 거친 것)과 다르다. 최대주주 정의를 표지·「2.가」·「2.나」 합집합으로 확대하기 전(2026-09-03, 표지 기준 259,983행)에는 97.4%·83.3%로, 정의 확대가 일치율을 거의 바꾸지 않았다. 최엄격 기준의 일치율이 2011~2012년 공시에서 9.7%로 떨어지는 것은 본 연구의 추출 문제가 아니다. 벤더가 이 구간에서 한 공시의 여러 계약에 계약체결일을 하나의 값으로 채워 넣었기 때문이다(계약이 3건 이상인 공시 가운데 체결일이 모두 같은 공시의 비율: 벤더 96~97%, 공시 원문 14%). 벤더의 이 처리가 사라지는 2014년 이후로 한정하면 최엄격 기준의 일치율은 87.6%이다.\n\n[^resid]: 수량 불일치는 본 연구 → 벤더 방향 1,773행과 벤더 → 본 연구 방향 103행이었다. 공시 원문으로 귀속한 결과 나머지는 벤더 측의 미수록·수록 범위 차이·부호 소실에 따른 이중집계 또는 시점 정의 차이였다(정의 확대로 편입된 316행도 같은 절차로 귀속하였고 전건 벤더 미수록이었다). 잔존 판정이 갈린 16.3%(이미 종료된 계약 3.2%, 담보가 없다고 보고한 최신 보고서를 벤더가 반영하지 않은 경우 12.6%, 중복 기재 0.2%, 벤더 쪽 중복 등 0.3%)의 행 단위 근거는 §1의 각주와 대장에 있다(대장 2-1·2-9·2-13·3-2).\n\n[^timing]: 스냅샷 보고서의 공시일(`rpt_dt`, 최종 정정본의 접수일)이 그 해 말보다 늦은 기업-연도는 1,945개(6.8%)이다(대장 2.1-1). 그 가운데 540개는 스냅샷 보고서가 그 해 말 뒤에 정정된 경우라 정정 전 원본은 연말 전에 공개되었을 수 있고(대장 2.1-3), 1,405개는 원본 자체가 그 해 말 뒤에 접수된 경우이다(12월 하순의 사건을 이듬해 1월에 보고해 상태일로 그 해에 둔 보고서 등, §2.1, 대장 2.1-4). 이듬해 3월 말보다 늦은 것은 386개이다(대장 2.1-2). 예컨대 블루산업개발의 2016~2019년 스냅샷은 작성기준일이 2016년 9월 21일인 보고서를 2021년 6월에 정정한 [기재정정]본([20210603000217](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20210603000217))이다. 이 정정본은 2020년 7월 개정 서식으로 제출되어 「다」가 있지만, 대출 쪽 변수는 2020~2025년에만 두므로 이 기업의 2016~2019년 대출금액은 비워 두었다([^t4]).\n\n\n[^denom]: 「1.가」의 합산값은 제1부 「3. 보유주식등의 수 및 보유비율」의 주권 수와 대조했고, 대조 규칙으로 확정되지 않은 보고서는 그 보고서의 공시 원문과 앞뒤 공시·사업보고서를 직접 확인해 정한 값을 썼다. 지배주주가 채권자에게 담보로 「대차」 형식으로 넘기거나 환매조건부로 매도한 주식은 담보이면서 지배주주의 지분이므로 분자와 분모에 모두 넣었다. 반대로 「1.가」 의결권 칸에 아직 소유하지 않은 주식에 대한 청구권(그룹 밖에 일반 대여한 주식의 반환청구권, 연말까지 대금을 내거나 넘겨받지 않은 매수 주식)이 들어 있으면, 공시 원문으로 그 해 연말의 실제 소유를 확인해 제외했다. 그 결과 의결권 주식 분모는 28,633개 기업-연도에서 검증되었다. 주 담보비율의 결측은 없다.\n\n    | 분모를 정한 방법 | 기업-연도 |\n    |---|---:|\n    | 「1.가」와 다른 섹션의 대조 규칙 | 28,127 |\n    | 공시 원문 재판독(작성기준일 분모) | 311 |\n    | 연말 소유 기준(상태일 반영으로 새로 스냅샷이 된 보고서 등) | 25 |\n    | 연말 보충 판정 때 그 해 연말 분모를 따로 정함(이월 연도의 무상증자·액면분할, 스냅샷 뒤 연말 전 반대매매 등) | 50 |\n    | 보고서가 적은 지분율과 크게 어긋나 공시 원문으로 다시 확인 | 14 |\n    | 담보 목적으로 그룹 밖에 넘긴 주식을 분모에도 더함(케어랩스 2019·2020) | 2 |\n    | 환매조건부 매도로 넘긴 주식을 분모에 다시 더함(앞서 원문으로 정한 분모가 제외한 것) | 8 |\n    | XML 없는 HTML 공시로 들어온 정정 사슬 중간 판(「1.가」 종류별 표가 없어 「1.나」와 요약표로 정함) | 2 |\n    | 「1.가」 의결권 칸에 섞인 청구권(그룹 밖 대여·인도 전 매수·발행 전 신주)을 연말 실제 소유로 가림 | 61 |\n\n    대조 규칙: 구서식은 보통주 칸을 쓴다. 제1부 주권 수와 맞지 않으면 사람별 증권종류 합계·주식등 총수·보유형태별 내역으로 검산하고, 특별관계에서 빠진 사람을 음수로 적은 행과 동일인 중복 행은 이를 제외한 합이 제1부의 주권 수와 정확히 일치할 때만 보정한다. 운용사와 펀드처럼 이름이 다른 두 행에 동일한 주식이 기재된 경우는 공시 원문 각주가 중복 기재·합계 제외를 명시하고, 동일 증권 묶음을 한 번 제외한 주권 수와 주식등 총수가 모두 제1부와 일치할 때만 합산을 보정한다(현대에버다임 2011~2014년의 4개 스냅샷). 같은 수량이라는 이유만으로 다른 사람의 주식을 중복으로 보지는 않는다.\n\n    공시 원문 재판독: 규칙으로 확정되지 않은 보고서는 216개(재판독 당시 기업-연도 333개)였다.\n\n    | 규칙이 확정하지 못한 이유 | 기업-연도 |\n    |---|---:|\n    | 섹션 간 상충 | 253 |\n    | 의결권 주식 0으로 분류 | 69 |\n    | 음수 보유 | 6 |\n    | 종류별 칸 미확인 | 4 |\n    | 동일인 중복 | 1 |\n\n    섹션 간 상충은 대부분 사람별 행 하나의 오기, 같은 공시 제3부나 직후 공시에만 적힌 작성기준일 전 거래, 보고자 본인 수량만 적은 표지, 운용사·펀드·신탁·대차의 중복 기재였다. 규칙이 0으로 분류한 69개 가운데 67개는 실제로는 증권예탁증권(DR) 칸에 보유가 적힌 외국 발행회사였다. DR 1단위가 보통주 몇 주인지는 그 회사의 공개매수신고서·사업보고서 등에서 확인했고, 공시가 발행주식총수와 담보를 DR 단위로 적은 회사는 분모도 그 단위로 두었다. 재판독에서 작성기준일에 의결권 주식이 0주로 나온 4개는 §2.1의 연말 소유 기준에 따라 퇴장으로 보거나 연말에 실제로 소유한 수량을 분모로 썼다. 둘은 퇴장 보고서였고(한세엠케이 2020년은 같은 날 사건의 승계 보고서로 바뀌었고, 보통주를 모두 팔고 신주인수권부사채만 남은 티웨이홀딩스 2011년은 행이 없다), 둘은 인도 전 매수인의 첫 보고서였다(에이디칩스 2015년은 명의개서 뒤의 보고서로 바뀌었고, 이디디컴퍼니 2012년은 연말에 실제로 소유한 260,000주를 분모로 쓴다). 재판독에서는 그룹 밖에 대여해 상대방이 소유하는 주식을 분모에서 제외했다. 다만 담보 목적으로 그룹 밖에 넘긴 주식(대차 형식으로 채권자에게 넘긴 사채 담보, 환매조건부 매도)은 담보 주식수와 분모에 모두 넣으므로, 재판독이 제외한 그 몫은 뒤에 다시 더했다. 규칙으로 확정한 분모도 「1.가」 의결권 칸이 「1.나」 제1호(소유)보다 크면 그 차이(제2호 청구권)를 같은 기준으로 원문 판정했다. 거래가 끝난 주식을 보고자가 제2호로 계속 적었거나 연말까지 결제·발행된 청구권은 그대로 두고, 그룹 밖 대여와 연말까지 결제되지 않은 매수, 그룹 안에서 두 번 적힌 몫만 제외했다. 원천으로 정하지 못한 보고서는 공시대로 두었다. 216개는 모두 공시 원문으로 직접 확인했다. 처음 판독한 값 가운데 133개(62%)는 보고의무발생일을 작성기준일로 적거나 DR을 0주로 읽는 등 틀려서 고쳤고, 고친 값도 다시 확인한 뒤 썼다.\n\n    발행총수는 같은 보고서 제1부와 제2부의 총수와 기재 지분율을 대조해 정했다. 기재 지분율이 검증된 보유 주식수 ÷ 발행총수와 크게 어긋나면 회사의 주요사항보고서·정기보고서, KRX 상장주식수, 다른 보고자의 보고서로 그 날짜의 발행총수를 확인해 더 공신력 있는 값을 썼고, 원천끼리 부딪혀 값을 정할 수 없을 때만 보유비율과 발행총수 대비 담보비율을 결측으로 두고 `voting_total_suspect`에 사유를 남긴다. 그 결과 발행총수는 28,633개 기업-연도 모두에서 확정되었고 자기주식을 포함한다. 제1부 요약표에 총수 칸이 없는 2011~2016년 서식 가운데 219개는 제1부 「1. 발행회사에 관한 사항」의 총수가 제2부와 같아 확정했다. 보고서 총수가 작성기준일 KRX 상장주식수보다 작은 791개는 KRX 값으로 바꿨고, 보고서가 적은 지분율과 크게 어긋나거나 KRX와 15% 넘게 다른 127개는 공시 원문·회사 공시·KRX 상장주식수로 다시 확인한 값을 쓴다. KRX보다 작은 보고서 총수는 대부분 자기주식을 차감한 유통주식수이고(덴티움 2017은 보고서 제1부 주석이 자기주식 2,444,939주를 차감했다고 밝힌다) 일부는 그 사이 상장된 신주를 빠뜨린 옛 총수이다. 자동으로 바꾼 것 가운데 무작위 20개를 회사 공시로 확인하니 19개가 KRX 값과 같았고, 나머지 1개는 발행됐으나 상장 전인 주식배당 때문이었다(DRB동일 2017). 다른 보고자의 공시가 같은 총수를 적은 보고서는 KRX 대조에서 제외했으므로(무작위 표본 196개 중 자기주식 사례 0) 드물게 남아 있을 수 있다. KRX 상장주식수 이력은 뒤의 액면분할만큼 소급 조정된 종목이 있어(감자·무상증자·주식배당은 조정되지 않는다) 15% 넘게 다른 보고서는 기계로 바꾸지 않고 회사 공시로 단위를 확인했다. 지분율 대조로 고친 이유는 총수 칸에 자기주식을 차감한 유통주식수를 적은 경우(넥스트아이 2012 등), 아직 발행되지 않은 유상증자 신주를 미리 넣은 경우(화성밸브 2018), 기재정정 보고서가 총수 칸에 보유 주식수를 적은 경우(에스에프씨 2017) 등이었다. 같은 대조에서 보유 분모의 잘못도 드러나 고쳤다(위 표의 「보고서가 적은 지분율과 크게 어긋나 공시 원문으로 다시 확인」). 매수계약 대상 주식을 매수인과 매도인이 겹쳐 적은 S-Oil 2014([20140819000183](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20140819000183), 표지 주석이 그룹 보유를 「71,669,172주가 맞다」고 밝힌다), 의결권이 되살아난 우선주나 의결권 있는 전환우선주를 규칙이 제외한 사조대림·코리아써키트·현대퓨처넷, 상장 전에 이미 발행된 신주를 전환사채 칸에 적은 한일단조 2022·와이즈파워 2013, 보통주 칸에 미행사 신주인수권·전환사채를 섞어 적은 에프에스티 2011·아이로보틱스 2019, 상호주를 「기타」 칸에 적은 에쓰씨엔지니어링 2021이다. 검증된 주 비율이 종전 주식등 기준보다 5%p 넘게 큰 기업-연도는 740개이다. 예스티 2020년(20201117000017)은 「1.가」의 보고자 3,512,057주와 특별관계자 88,500주를 합한 3,600,557주가 제1부의 주권 수와 일치한다.\n\n    | 예스티 2020년 담보 1,053,945주의 비율 | 분모 | 비율 |\n    |---|---|---:|\n    | 주 비율(검증된 의결권 주식) | 3,600,557주 | 29.27% |\n    | 종전 주식등 기준 | 표지 「주식등의 수」 | 22.75% |\n    | 차감식 보조변수 | 주식등 − 보유잠재주식 | 3,513.15% |\n\n[^sec]: 보고서의 다른 절은 번호로 부른다. 「1.가」·「1.나」는 같은 제2부 「1. 보고자 및 특별관계자별 보유내역」의 주식등의 종류별·보유형태별 표이고, 「2.가 보고자」·「2.나 특별관계자」는 제1부 「2. 대량보유자에 관한 사항」의 표로 계약 절의 「나」와는 다른 곳이다. 제3부는 직전 보고 이후의 변동내역이다.\n[^stkknd]: 제외하는 종류는 전환사채권·신주인수권부사채권·교환사채권·신주인수권증서, 보통주로 전환될 우선주, 증권예탁증권, 「기타」, 종류가 「-」로 적힌 행이다. 외국 기업이 보유와 담보를 증권예탁증권 단위로 적은 경우와 보통주 담보를 「기타」로 적은 경우는 연말 보충으로 더했다(§2.1의 각주).\n[^vocab]: ③은 다음 가운데 하나를 충족하면 된다.\n\n    | 경로 | 기준 | 예 |\n    |---|---|---|\n    | (가) 담보성 어휘 | 계약의 종류에 담보·질권·차입·대출·물상보증·인수금융·지급보증·대부거래·융자·소비대차·금전대여·운전자금·자금대출 중 하나가 들어 있다(부분 일치). 같은 어휘의 오기·띄어쓰기·영문 표기도 같은 어휘로 본다 | 「주식담보대출」·「근질권설정」·「금전소비대차계약」. 오기 「주식당보제공」·「담 보계약」·「금전소비대체계약」·「Mortgage」 |\n    | (가) 공시 원문으로 확인한 상품명 | 공시 원문으로 주식 담보임을 확인한 어휘 | 「연대보증」(주식 질권을 동반)·「일반자금」(대출 상품명)·「보증서」(신용보증기관 담보)·「채권단과의 약정에 따름」(워크아웃 채권단에 담보제공) |\n    | (나) 대여·대차 | 「대여」·「대차」가 들어 있고 그 행이 같은 보고서 「다」의 행과 연결되어 있다(연번, 주식수, 계약상대방 순으로 짝지음). 연결되지 않으면 공시 원문 판정으로 담보가 확인될 때 | 「다」가 서식에 없던 2020년 7월 개정 전 보고서, 「다」에 그 계약을 적지 않은 개정 후 보고서 |\n    | (다) 납세·공탁 판별 | ⑤의 판별에서 금융 차입 담보로 확인되었다 | |\n    | (라) 담보신탁 | 「신탁」으로 적은 계약 가운데 공시 원문 판정으로 담보신탁(그룹 구성원이 금전 채무를 담보하려고 주식을 맡기고, 채권자가 수익자이거나 채무불이행·담보비율 미달 때 처분을 요구할 수 있는 신탁)이 확인되었다 | |\n    | (마) 어휘 밖 질권 | 계약종류가 위 어휘 밖이지만 비고나 「다」에 질권·담보가 적혀 있고, 공시 원문 판정으로 금융 차입 담보 질권이 확인되었다 | 「약식질」·「여신거래약정」·「USANCE발행」·「장외파생상품정산합의계약」, 계약종류 칸에 대출금액·대주 이름을 잘못 적은 행 |\n    | (바) 환매조건부 매도 | 계약의 종류가 환매조건부 매도이다. 매도인과 매수인이 모두 같은 그룹이면 주식이 그룹 밖으로 나가지 않으므로 넣지 않는다 | 「환매조건부주식매매계약」·「환매조건부 주식거래계약」 |\n\n    제외되는 것은 주주간계약, 공동보유 약정·공동목적보유확약, 되사는 조건이 없는 주식매매·양수도계약, 의결권 공동행사·위임, 교환사채 발행계약, 처분·가족·명의·특정금전신탁 등 담보가 아닌 신탁계약, 담보로 확인되지 않은 주식대여·대차이다.\n\n[^taxmix]: 납세담보와 대출 담보를 한 행에 합쳐 적은 소수 행은 대출분만 주 담보로 셌다.\n[^repchg]: 직전 연도 스냅샷이 없으면 빈칸이며, 비교는 상장 필터를 걸기 전의 연도 이력으로 하므로 코넥스·비상장 연도 뒤에 처음 표본에 든 연도에도 값이 있다. 대표보고자만 바뀐 경우(지주회사↔개인)와 그룹이 재편된 경우(인적분할·사명변경)도 1이다. `group_continuity`는 `reporter_changed=1`일 때만 값이 있고(그 밖의 빈칸은 0이 아니다), 직전·이번 스냅샷의 대표보고자∪특별관계자∪최대주주 이름이 겹치면 1이다.\n[^loanrow]: 외화는 작성기준일 매매기준율로 환산하고 공동담보 반복 기재는 1회 계상한다. 대출금액 칸 값이 한도이거나 연말 전에 바뀐 대출은 원천으로 확인된 그 해 12월 31일 잔액을 쓴다(§4.3). 다른 회사 주식과 함께 담보인 대출의 몫(`loan_krw_cross_issuer`)과 한도로 확인된 몫(`loan_krw_limit`)은 값에 들어 있고 따로 표시한다(§4.3).\n[^pledge0]: 패널 밖 기업-연도 2,511개 가운데 1,493개가 2011~2014년에 있고, 좌측 절단(`unobserved_left`)은 1,528개 가운데 1,175개가 이 네 해에 있다. 2015~2025년 기본 패널은 23,149개 기업-연도(2,751개 기업)이다. 패널 밖 기업-연도를 모두 담보 없음 또는 모두 담보 있음으로 두면 담보 기업-연도의 비율은 2011~2025년 30.3~38.3%(기본 패널 32.9%), 2015~2025년 31.6~35.8%이다. 보고서가 없는 `not_reported`·`gap` 653개만 그렇게 두면 2011~2025년 32.2~34.4%이다. 기본 패널의 2,863개 기업 가운데 연말 스냅샷에서 담보가 한 번 이상 관측된 기업은 1,540개, 한 번도 관측되지 않은 기업은 1,323개이다. 주 담보 없이 처분 제한 주식만 있는 기업-연도(488개, 그중 납세담보·공탁이 있는 것 441개)는 $PLEDGE_{it}=0$, $RESTRICT\\_SH_{it}>0$ 으로 코딩된다. 금융 차입 담보가 없다는 사실이 관측된 것이므로 결측으로 두지 않는다.\n[^maint]: 같은 대출을 담보제공자마다 반복한 행이 비율을 여러 번 세지 않는다. 두 값은 같은 모집단에서 계산되므로 직접 비교할 수 있고, 유효 행 수(`n_kep_valid`), 비율이 적힌 행 수(`n_kep_all`), 100% 미만으로 적힌 행 수(`n_kep_ltv_def`)를 함께 두어 각 기업-연도의 값이 몇 행에서 왔는지 드러나게 하였다. 담보유지비율이 기재된 3,376개 기업-연도 중 3,201개에서 유효 값이 있고, 175개는 기재된 비율이 전부 무효(LTV 정의·자리표시 등)이다(대장 4.4-4·4.4-5·4.4-6). 스냅샷 보고서의 「다」에 대출이 없어 같은 계약을 적은 앞뒤 보고서의 「다」로 대출을 채운 기업-연도(스냅샷 「다」가 다른 대출을 옮겨 적어 바꾼 1개 포함, [^loanfill])는 채운 「다」 행을 같은 방식으로 세며, 유효 값이 있는 3,204개 가운데 47개가 그렇다(대장 4.4-7). 두 변수의 차이가 20%p를 넘는 기업-연도는 199개로(대장 4.4-8), 그중 154개는 종류가 다른 대주(예: 한국증권금융과 증권사)에게서 함께 빌린 경우이다. 나머지도 큰 대출과 작은 대출의 조건이 다르거나 한 대출을 여러 행으로 나눠 적어 중앙값이 행 수 쪽으로 끌린 경우여서 측정 오류가 아니다. 그래서 이들을 제외하기보다 두 변수 각각으로 결론을 확인하는 편이 낫다.\n[^t4]: 담보가 있는 9,422개 모두에서 $PLEDGE\\_RATIO$·$PLEDGE\\_TOT$·$OWN$이 관측된다. 기업 연령을 통제하려면 상장일을 따로 붙여야 한다. 담보/보유 비율의 최댓값은 100.0%로, 100%를 **넘는** 기업-연도는 0개이고 **정확히 100%인 기업-연도가 226개**이다(보유 전량을 담보로 제공한 경우이며 그중 154개는 계약이 1건). 100% 이상을 합쳐 226개이다. 마지막까지 100%를 넘었던 것은 해피드림 2011년이었다. 2011년 3월 보고서([20110318000178](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20110318000178))는 키온건설 외 2인의 담보를 2,031,350주로 적었는데, 이는 직전 사업보고서(2010.12.31)의 세 법인 합계와 정확히 같고, 같은 보고서 주석이 「스톤건설이 2011.01.22 보유주식 117,932주를 장외매도」라고 밝힌다. 2,031,350 − 117,932 = 1,913,418로 표지의 보유주식수와 일치하므로 초과분은 매도를 반영하지 않은 담보행의 수량 미갱신이다. 담보행 성명이 「키온건설 외 2인」 묶음이라 「1.가」 구성원과 짝이 맞지 않아 캡이 걸리지 않았고, 질권자 진흥저축은행의 2011년 12월 보고서([20111223000368](https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20111223000368))가 처분권 대상을 그룹 보유 전부인 1,913,418주로 적어 담보 수량을 그 값으로 고쳤다(대장 4.6-1·4.6-2). 원문으로 담보 수량을 고친 다른 행도 같은 대장 줄에 있다. 이처럼 캡을 걸 수 없는 경우가 다시 생기면 값은 고치지 않고 `collateral_exceeds_voting`으로 표시만 하며, 이 표시가 켜진 기업-연도는 현재 0개이다. $LOAN$은 2020년 이후 담보 기업-연도 4,474개 중 507개에서 결측이며 사유를 `loan_na_reason`에 남겼다. 이들을 0으로 두면 \"담보는 있는데 빚이 없다\"는 관측이 되므로 결측으로 처리하였다. 대출 쪽 변수($LOAN$·$MAINT$·$INT$와 그 보조 열)는 「다」가 생긴 2020~2025년에만 두고, 담보가 있는 2011~2019년 4,948개 기업-연도는 `loan_na_reason=pre_2020`이다. 2020년 7월 이후 서식으로 늦게 제출한 보고서가 그 전 상태를 적은 경우(천일고속 2019, 블루산업개발 2016~2019, 배럴 2019, §2.1 끝 문장의 각주)와 연말 보충 판정이 뒤 보고서의 「다」나 「나」 자유기재 금액으로 대출을 붙인 경우(모린스 2011, 코리안리·STX엔진 2018·2019, 한국주강·컴퍼니케이 2019)에도 금액을 알 수는 있지만, 서식에 따른 관측이 아니어서 연도 간 기준을 맞추려고 같게 비웠다. 담보 1주당 대출금액은 대출금액을 그 대출이 들어간 담보의 주식수(`loan_krw_live` ÷ `loan_linked_shares`)로 나눈 값이다. 담보 주식 전체($PLEDGE\\_SH$)로 나누면 일부 담보만 「다」에 연결된 기업-연도(§3.1)에서 작게 나오기 때문이다. 대출금액이 0원이라 연결된 주식이 없는 1개는 세지 않았다. 다른 회사 주식과 함께 담보로 잡힌 대출은 이 회사 주식만으로 나누게 되어 1주당 대출이 크게 나온다(이용 안내).\n[^t5]: 벤더 단면 48,256행에서 먼저 두 가지를 걷어낸다. 하나는 본 연구 행과 짝을 지을 수 없는 행이다. 2009~2010년 공시는 본 연구의 수집 범위 밖이고, 벤더가 정정 전 판의 공시일을 출처로 적은 행은 본 연구가 최종 정정본만 가지므로 그 날짜의 보고서가 없다. 공시일·종목·주식수가 같은 행이 여럿이거나 같은 수량의 행이 없는 경우도 1:1로 붙일 수 없다. 다른 하나는 본 연구 범위 밖의 행으로, 최대주주 그룹 보고서가 아니거나, 의결권 없는 증권·담보가 아닌 계약·납세담보·공탁이거나, 연말 최신 최대주주 보고서가 계약 절 없는 약식이라 패널에서 제외한 기업-연도의 행이다. 이를 걷어내면 비교 모집단 39,438행이 남는다. 여기서 §4의 판정과 벤더의 최신 보고서 미반영·중복 기재로 연말에 살아 있지 않은 담보(유효하지 않은 잔존) 6,435행을 제외하고, 본 연구에만 있는 담보를 더한다. 벤더에 없는 담보는 §1의 생존 편의, 즉 자료 추출 시점에 상장폐지되어 벤더 유니버스에서 통째로 빠진 182개 종목의 3,012행과 상장 중인 종목의 커버리지 공백 3,078행이다. 벤더에도 같은 계약이 있으나 수량이 다르거나(본 연구 값으로 바꿈) 정정 전 날짜·같은 내용 행 여럿으로 행끼리 붙지 않아 본 연구 행으로 대신한 것이 1,375행이다. 그 결과가 본 연구의 12월말 스냅샷에 살아있는 담보 행 40,468행이며, 담보 주식수 합이 양쪽에서 일치함을 확인하였다. 마지막으로 그해 연말에 유가증권·코스닥에 상장되어 있지 않은 기업-연도와 코넥스 종목·리츠 등 일반기업이 아닌 종목의 기업-연도의 행을 제외하면 §2.2의 패널에 속하는 담보 행 39,114행(9,303개 기업-연도)이 된다.\n[^lim1]: 스냅샷 그룹이 그 해 사업보고서의 최대주주와 같고 그 사이 새 공시가 없을 때 끝난 날이나 누락을 원천으로 정할 수 없는 담보는 공시대로 두었고, 「다」에만 적힌 담보는 앞뒤 공시로 확인되지 않으면 「나」의 기재를 따랐다. 담보유지비율이 100% 미만으로 적힌 값은 담보인정비율(대출 ÷ 담보가치) 정의로 보이며(「다」 행의 2.0%), 이를 변환하지 않고 유효 행에서 제외하되 그 행 수를 `n_kep_ltv_def`로 남겼다. 단순투자 목적 등으로 약식 보고서만 내는 최대주주(국민연금·자산운용사·정책금융기관 등)가 있는 기업은 그 기간이 표본에서 제외된다.\n";
const md = window.markdownit({html: true, linkify: false, typographer: false})
  .use(window.markdownitFootnote)
  .use(window.texmath, {engine: window.katex, delimiters: 'dollars', katexOptions: {throwOnError: false}});
const doc = document.getElementById('doc');
doc.innerHTML = md.render(SRC);
// 바깥 링크는 새 창으로
doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
// 제목에 id 를 달고 목차를 만든다
const toc = [], seen = {};
doc.querySelectorAll('h2,h3').forEach(h => {
  let id = h.textContent.trim().replace(/\s+/g, '-').replace(/[^\w가-힣\-.§]/g, '').slice(0, 60) || 'sec';
  if (seen[id]) id += '-' + (++seen[id]); else seen[id] = 1;
  h.id = id; toc.push(`<li style="margin-left:${h.tagName === 'H3' ? 14 : 0}px"><a href="#${id}">${h.textContent}</a></li>`);
});
document.getElementById('toc').innerHTML = toc.length ? '<b>목차</b><ul>' + toc.join('') + '</ul>' : '';
// 「대장 4.1-10·4.1-11」 → 근거 대장의 그 줄로 가는 링크
const RX = /대장\s+(\d+(?:\.\d+)?-\d+(?:\s*[·~]\s*\d+(?:\.\d+)?-\d+)*)/g;
const walker = document.createTreeWalker(doc, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest('a,code') ? NodeFilter.FILTER_REJECT : (RX.test(n.nodeValue) ? (RX.lastIndex = 0, NodeFilter.FILTER_ACCEPT) : NodeFilter.FILTER_REJECT)});
const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
nodes.forEach(n => {
  const span = document.createElement('span');
  span.innerHTML = n.nodeValue.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])).replace(RX, (all, nums) =>
    '대장 ' + nums.replace(/\d+(?:\.\d+)?-\d+/g, x => `<a class="ptr" href="gap_review.html#${x}" target="_blank" rel="noopener">${x}</a>`));
  n.replaceWith(...span.childNodes);
});
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
