<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 880" width="1480" height="880" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif"><rect width="1480" height="880" fill="#ffffff"/><text x="30" y="44" font-size="24" font-weight="700" fill="#225287" text-anchor="start">거래소가 고른 저PBR 151사, 공개 데이터로 똑같이 골라 볼 수 있을까?</text><text x="30" y="72" font-size="14" font-weight="400" fill="#5b6470" text-anchor="start">재료를 모으고 → 거래소 규칙대로 고르고 → 거래소가 실제로 발표한 결과와 맞춰 봤다</text><rect x="30" y="96" width="1420" height="34" rx="4" fill="#225287"/><text x="46" y="119" font-size="16" font-weight="700" fill="#fff" text-anchor="start">1  어디서 가져왔나</text><text x="1434" y="119" font-size="13" font-weight="400" fill="#dbe6f3" text-anchor="end">색 = 데이터 출처 (아래 단계의 꼬리표와 같은 색)</text><rect x="30" y="142" width="276" height="118" rx="8" fill="#fff" stroke="#1b8fd6" stroke-width="1.5"/><rect x="30" y="142" width="276" height="8" rx="4" fill="#1b8fd6"/><text x="46" y="176" font-size="17" font-weight="700" fill="#225287" text-anchor="start">주가 · 시가총액</text><text x="46" y="197" font-size="12" font-weight="700" fill="#1b8fd6" text-anchor="start">CHECK API (코스콤)</text><text x="46" y="222" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">매일의 시가총액 6년치 · 거래일 달력</text><text x="46" y="241" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">2,843종목 · 우선주 포함</text><rect x="316" y="142" width="276" height="118" rx="8" fill="#fff" stroke="#d9690b" stroke-width="1.5"/><rect x="316" y="142" width="276" height="8" rx="4" fill="#d9690b"/><text x="332" y="176" font-size="17" font-weight="700" fill="#225287" text-anchor="start">재무제표 (지배주주 자본)</text><text x="332" y="197" font-size="12" font-weight="700" fill="#d9690b" text-anchor="start">CHECK API(IFRS) + DART 공시</text><text x="332" y="222" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">계산: CHECK IFRS, 전 기업 2,715사</text><text x="332" y="241" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">DART: 기준 보고서 결정 · 원문 · 캡처</text><rect x="602" y="142" width="276" height="118" rx="8" fill="#fff" stroke="#1aa6bf" stroke-width="1.5"/><rect x="602" y="142" width="276" height="8" rx="4" fill="#1aa6bf"/><text x="618" y="176" font-size="17" font-weight="700" fill="#225287" text-anchor="start">상장 · 공시 현황</text><text x="618" y="197" font-size="12" font-weight="700" fill="#1aa6bf" text-anchor="start">KIND · KRX 정보데이터시스템</text><text x="618" y="222" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">그날 상장된 회사 · 관리종목 · 우선주</text><text x="618" y="241" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">밸류업 공시 · 실제 공표 명단</text><rect x="888" y="142" width="276" height="118" rx="8" fill="#fff" stroke="#7c5cbf" stroke-width="1.5"/><rect x="888" y="142" width="276" height="8" rx="4" fill="#7c5cbf"/><text x="904" y="176" font-size="17" font-weight="700" fill="#225287" text-anchor="start">업종 분류 (GICS)</text><text x="904" y="197" font-size="12" font-weight="700" fill="#7c5cbf" text-anchor="start">KRX 지수 사이트</text><text x="904" y="222" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">반기마다 그날의 GICS 11개 업종</text><text x="904" y="241" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">없는 회사만 CHECK 업종으로 보완</text><rect x="1174" y="142" width="276" height="118" rx="8" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><rect x="1174" y="142" width="276" height="8" rx="4" fill="#6b7280"/><text x="1190" y="176" font-size="17" font-weight="700" fill="#225287" text-anchor="start">정답지</text><text x="1190" y="197" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">거래소 보도자료</text><text x="1190" y="222" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">2,431 → 185 → 151</text><text x="1190" y="241" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">업종별 표 · 151사 명단</text><path d="M718.0,270 L762.0,270 L762.0,284 L778.0,284 L740.0,310 L702.0,284 L718.0,284 z" fill="#c9d6e3"/><text x="792.0" y="296" font-size="13" font-weight="700" fill="#5b6470" text-anchor="start">모아서 계산</text><rect x="30" y="318" width="1420" height="34" rx="4" fill="#225287"/><text x="46" y="341" font-size="16" font-weight="700" fill="#fff" text-anchor="start">2  어떻게 골랐나 — 거래소 규칙 그대로</text><text x="1434" y="341" font-size="13" font-weight="400" fill="#dbe6f3" text-anchor="end">큰 숫자 = 보도자료 · 2020.11 ~ 2026.11 반기마다 13번 반복 계산</text><rect x="30" y="366" width="220" height="176" rx="8" fill="#f7fafc" stroke="#cfd6dc"/><circle cx="54" cy="392" r="14" fill="#225287"/><text x="54" y="397" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="76" y="397" font-size="15" font-weight="700" fill="#225287" text-anchor="start">대상 회사</text><text x="236" y="442" font-size="30" font-weight="700" fill="#225287" text-anchor="end">2,431</text><text x="44" y="474" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">그날 상장된 회사에서</text><text x="44" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">관리종목 · 거래정지 빼기</text><rect x="44" y="510" width="66" height="22" rx="11" fill="#1aa6bf"/><text x="77.0" y="525" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">KIND</text><rect x="116" y="510" width="40" height="22" rx="11" fill="#1b8fd6"/><text x="136.0" y="525" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">주가</text><path d="M252,445.0 L267,454.0 L252,463.0 z" fill="#225287"/><rect x="270" y="366" width="220" height="176" rx="8" fill="#f7fafc" stroke="#cfd6dc"/><circle cx="294" cy="392" r="14" fill="#225287"/><text x="294" y="397" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="316" y="397" font-size="15" font-weight="700" fill="#225287" text-anchor="start">PBR 계산</text><text x="284" y="474" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">20일 평균 시가총액</text><text x="284" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">÷ 지배주주 자본</text><rect x="284" y="510" width="40" height="22" rx="11" fill="#1b8fd6"/><text x="304.0" y="525" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">주가</text><rect x="330" y="510" width="40" height="22" rx="11" fill="#d9690b"/><text x="350.0" y="525" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">재무</text><path d="M492,445.0 L507,454.0 L492,463.0 z" fill="#225287"/><rect x="510" y="366" width="220" height="176" rx="8" fill="#f7fafc" stroke="#cfd6dc"/><circle cx="534" cy="392" r="14" fill="#225287"/><text x="534" y="397" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="556" y="397" font-size="15" font-weight="700" fill="#225287" text-anchor="start">업종 안 순위</text><text x="524" y="474" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">같은 업종 하위</text><text x="524" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">25%(유가)·10%(코스닥)</text><rect x="524" y="510" width="40" height="22" rx="11" fill="#7c5cbf"/><text x="544.0" y="525" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">업종</text><path d="M732,445.0 L747,454.0 L732,463.0 z" fill="#225287"/><rect x="750" y="366" width="220" height="176" rx="8" fill="#f7fafc" stroke="#cfd6dc"/><circle cx="774" cy="392" r="14" fill="#225287"/><text x="774" y="397" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="796" y="397" font-size="15" font-weight="700" fill="#225287" text-anchor="start">3년 내내 낮았나</text><text x="956" y="442" font-size="30" font-weight="700" fill="#225287" text-anchor="end">185</text><text x="764" y="474" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">최근 반기 6번 모두</text><text x="764" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">하위권이어야 선정</text><path d="M972,445.0 L987,454.0 L972,463.0 z" fill="#225287"/><rect x="990" y="366" width="220" height="176" rx="8" fill="#f7fafc" stroke="#cfd6dc"/><circle cx="1014" cy="392" r="14" fill="#225287"/><text x="1014" y="397" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1036" y="397" font-size="15" font-weight="700" fill="#225287" text-anchor="start">개선계획 낸 곳 빼기</text><text x="1196" y="442" font-size="30" font-weight="700" fill="#d9690b" text-anchor="end">−34</text><text x="1004" y="474" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">10.22까지 PBR 개선계획</text><text x="1004" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">공시하면 제외*</text><rect x="1004" y="510" width="66" height="22" rx="11" fill="#1aa6bf"/><text x="1037.0" y="525" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">KIND</text><path d="M1212,445.0 L1227,454.0 L1212,463.0 z" fill="#225287"/><rect x="1230" y="366" width="220" height="176" rx="8" fill="#e6f6f9" stroke="#cfd6dc"/><circle cx="1254" cy="392" r="14" fill="#225287"/><text x="1254" y="397" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="1276" y="397" font-size="15" font-weight="700" fill="#225287" text-anchor="start">최종 공표</text><text x="1436" y="442" font-size="30" font-weight="700" fill="#225287" text-anchor="end">151</text><text x="1244" y="474" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">유가 96 · 코스닥 55</text><text x="1244" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">MTS·HTS에 '저PBR' 표시</text><text x="30" y="566" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">* 단, 6년(13번 중 12번) 내내 하위권이었던 회사는 계획을 내도 공표된다.    PBR이 1보다 작을수록 회사 가치가 장부상 자본보다 낮게 평가된다는 뜻이다.</text><path d="M718.0,578 L762.0,578 L762.0,592 L778.0,592 L740.0,618 L702.0,592 L718.0,592 z" fill="#c9d6e3"/><text x="792.0" y="604" font-size="13" font-weight="700" fill="#5b6470" text-anchor="start">맞는지 확인</text><rect x="30" y="626" width="1420" height="34" rx="4" fill="#225287"/><text x="46" y="649" font-size="16" font-weight="700" fill="#fff" text-anchor="start">3  맞게 골랐나 — 거래소가 실제로 발표한 결과와 비교</text><text x="1434" y="649" font-size="13" font-weight="400" fill="#dbe6f3" text-anchor="end"></text><rect x="30" y="672" width="345" height="150" rx="8" fill="#fff" stroke="#cfd6dc"/><rect x="30" y="672" width="6" height="150" rx="3" fill="#1aa6bf"/><text x="50" y="700" font-size="14" font-weight="700" fill="#5b6470" text-anchor="start">PBR 숫자</text><text x="50" y="734" font-size="24" font-weight="700" fill="#1aa6bf" text-anchor="start">151 / 151 일치</text><text x="50" y="762" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">공표 151사 PBR, 소수 둘째 자리까지 같다</text><text x="50" y="781" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">CHECK 값 · DART 원문 값 둘 다 일치</text><text x="50" y="800" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">→ 분모는 '자본총계'가 아니라 지배주주 자본</text><rect x="388" y="672" width="345" height="150" rx="8" fill="#fff" stroke="#cfd6dc"/><rect x="388" y="672" width="6" height="150" rx="3" fill="#1aa6bf"/><text x="408" y="700" font-size="14" font-weight="700" fill="#5b6470" text-anchor="start">개선계획 낸 회사</text><text x="408" y="734" font-size="24" font-weight="700" fill="#1aa6bf" text-anchor="start">62사 · 15사 일치</text><text x="408" y="762" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">KIND 공시 제목으로 62사를 찾았고</text><text x="408" y="781" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">그중 그래도 공표된 15사(장기 저PBR)</text><text x="408" y="800" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">까지 보도자료 숫자와 같다</text><rect x="746" y="672" width="345" height="150" rx="8" fill="#fff" stroke="#cfd6dc"/><rect x="746" y="672" width="6" height="150" rx="3" fill="#1aa6bf"/><text x="766" y="700" font-size="14" font-weight="700" fill="#5b6470" text-anchor="start">최종 명단</text><text x="766" y="734" font-size="24" font-weight="700" fill="#1aa6bf" text-anchor="start">151 / 151 재현</text><text x="766" y="762" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">거래소 공표 151사를 모두 골라냈다</text><text x="766" y="781" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">대상 779·1,652 · 업종 기준선 22/22 일치</text><text x="766" y="800" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">재현은 경계선 7사를 더 골랐다</text><rect x="1104" y="672" width="345" height="150" rx="8" fill="#fff" stroke="#cfd6dc"/><rect x="1104" y="672" width="6" height="150" rx="3" fill="#225287"/><text x="1124" y="700" font-size="14" font-weight="700" fill="#5b6470" text-anchor="start">결과물</text><text x="1124" y="734" font-size="24" font-weight="700" fill="#225287" text-anchor="start">웹페이지</text><text x="1124" y="762" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">단계별 화면 · 회사 추적 (전 기업)</text><text x="1124" y="781" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">원문 링크 · 캡처 362장 (공표·계획 198사)</text><text x="1124" y="800" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">GitHub Pages로 공개</text><text x="30" y="856" font-size="12" font-weight="400" fill="#5b6470" text-anchor="start">숫자는 2026-11-11 실행 기준. 코스콤 CHECK 원자료는 재배포하지 않아 레포에 없고, 웹페이지는 가공한 값만 쓴다.</text></svg>