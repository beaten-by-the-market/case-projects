<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저PBR 선정 재현</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="in">
  <h1>저PBR기업 선정 재현 <small>2026년 11월 공표분</small></h1>
  <span class="sub">비공식 재현 자료 · 주가·재무 CHECK API · 근거 DART 원문 · 대조 KIND 밸류업</span>
  <div class="right">
    <input id="q" class="q" placeholder="회사 추적 — 이름·코드" autocomplete="off">
    <div id="qlist" class="qlist"></div>
    <span id="badge" class="badge"></span>
  </div>
</div></header>

<nav class="stepper" id="stepper"></nav>

<div class="wrap">
  <section class="pane" id="p0"></section>
  <section class="pane" id="p1"></section>
  <section class="pane" id="p2"></section>
  <section class="pane" id="p3"></section>
  <section class="pane" id="p4"></section>
  <section class="pane" id="p5"></section>
  <section class="pane" id="p6"></section>
  <section class="pane" id="p9"></section>
</div>

<div class="modal" id="modal"><div class="card">
  <div class="head"><h2 id="m-title"></h2><span id="m-sub" class="small"></span><button class="x" id="m-close">닫기</button></div>
  <div class="body" id="m-body"></div>
</div></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
